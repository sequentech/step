units = ["doc_renderer"]
kind = "test"
runner = "cargo"
cost = "fast"
cwd = "packages"
command = "cargo test --locked -p doc_renderer"
focus = ["cargo", "test", "--locked", "-p", "doc_renderer"]
workflows = ["orare-unit-tests.yml"]
