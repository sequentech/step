actions = ["setup-test-browser"]

# The committed sequent-core tgz must match its Rust sources; consumers test
# that tgz, so they are selected when it is regenerated.
[[checks]]
id = "wasm-freshness"
units = ["sequent-core"]
kind = "build"
runner = "shell"
cost = "fast"
cwd = "."
command = "python3 -m scripts.dev.wasm --check-package"
paths = ["packages/*/rust/sequent-core-*.tgz", "packages/yarn.lock", "scripts/dev/wasm.py"]
workflows = ["build_wasm.yml"]

[[checks]]
id = "python:scripts-dev"
units = ["scripts-dev", "devcontainer"]
kind = "test"
runner = "python"
cost = "fast"
cwd = "."
command = "python3 -m unittest discover -s scripts/dev -p 'test_*.py'"
focus = ["python3", "-m", "unittest"]
tests = ["scripts/dev/**/test_*.py"]

[[checks]]
id = "lint:scripts-dev"
units = ["scripts-dev"]
kind = "lint"
runner = "shell"
cost = "fast"
trigger = "changed"
cwd = "."
command = "ruff check --config scripts/dev/ruff.toml scripts/dev"
requires = ["ruff"]

[[checks]]
id = "python:scripts-coverage"
units = ["scripts-coverage"]
kind = "test"
runner = "python"
cost = "fast"
cwd = "."
command = "python3 -m unittest discover -s scripts/coverage -p 'test_*.py' && node scripts/coverage/test_frontend.cjs"
focus = ["python3", "-m", "unittest"]
tests = ["scripts/coverage/test_*.py"]
workflows = ["rust-coverage.yml", "frontend-coverage.yml", "core-native-features.yml", "strand-native-backends.yml"]

[[checks]]
id = "python:scripts-e2e"
units = ["scripts-e2e"]
kind = "test"
runner = "python"
cost = "fast"
cwd = "."
command = "python3 -m unittest scripts.e2e.test_runner scripts.e2e.test_run_safety && python3 scripts/e2e/ui/test_run_safety.py"
focus = ["python3", "-m", "unittest"]
tests = ["scripts/e2e/test_*.py", "scripts/e2e/ui/test_*.py", "scripts/e2e/journeys/test_*.py"]
workflows = ["backend-e2e.yml", "frontend-stack-e2e.yml"]

[[checks]]
id = "java:keycloak-extensions"
units = ["keycloak-extensions"]
kind = "test"
runner = "maven"
cost = "slow"
cwd = "packages/keycloak-extensions"
command = "mvn -B -ntp test"
requires = ["mvn"]
workflows = ["java-unit-tests.yml", "java_test.yml"]

[[checks]]
id = "java:ecies"
units = ["ecies"]
kind = "test"
runner = "maven"
cost = "slow"
cwd = "packages/ECIESEncryption"
command = "mvn -B -ntp test"
requires = ["mvn"]
workflows = ["java-unit-tests.yml"]

[[checks]]
id = "docs-build"
units = ["docs-site"]
kind = "build"
runner = "shell"
cost = "slow"
cwd = "docs/docusaurus"
command = "yarn install --frozen-lockfile --non-interactive && yarn build"
workflows = ["documentation.yml"]

[[checks]]
id = "docs-graphql"
units = ["docs-api"]
kind = "build"
runner = "shell"
cost = "slow"
cwd = "docs/api/graphql"
command = "yarn install --frozen-lockfile --non-interactive && yarn generate-full-docs"
workflows = ["documentation.yml"]

[[checks]]
id = "reuse"
units = []
kind = "lint"
runner = "shell"
cost = "fast"
trigger = "changed"
cwd = "."
command = "reuse lint"
paths = ["**"]
requires = ["reuse"]
workflows = ["license_reuse.yml"]

# Needs a running Hasura on graphql-engine:8080, as in the full devcontainer.
[[checks]]
id = "graphql-codegen"
units = ["hasura"]
kind = "build"
runner = "shell"
cost = "integration"
cwd = "packages"
command = "yarn generate:voting-portal && yarn generate:admin-portal && yarn generate:ballot-verifier && yarn generate:results-portal && git diff --exit-code -- '*/graphql.schema.json' '*/src/gql'"
paths = ["packages/*/codegen.ts"]

[[checks]]
id = "db-contracts"
units = ["scripts-database", "hasura", "voting-load"]
kind = "test"
runner = "shell"
cost = "integration"
cwd = "."
command = "docker run --rm --user postgres --volume \"$PWD:/step:ro\" --workdir /step postgres:18-bookworm scripts/postgres/check_migrations.sh && scripts/postgres/check_hasura_metadata.sh"
paths = ["packages/windmill/src/postgres/**", ".devcontainer/postgresql/init.sh"]
requires = ["docker"]
workflows = ["backend-database-contracts.yml"]

[[checks]]
id = "backend-e2e"
units = ["scripts-e2e", "windmill", "harvest", "immu-board", "step-cli", "b4", "braid", "keycloak-extensions", "hasura", "devcontainer", "docker-images"]
kind = "test"
runner = "shell"
cost = "integration"
cwd = "."
command = "scripts/e2e/run.sh"
requires = ["docker"]
workflows = ["backend-e2e.yml"]

[[checks]]
id = "frontend-stack-e2e"
units = ["ui-e2e", "scripts-e2e", "windmill", "harvest", "immu-board", "step-cli", "b4", "braid", "keycloak-extensions", "hasura", "devcontainer", "docker-images", "voting-portal", "admin-portal", "results-portal", "ballot-verifier"]
kind = "test"
runner = "shell"
cost = "integration"
cwd = "."
command = "scripts/e2e/ui/run.sh"
requires = ["docker"]
workflows = ["frontend-stack-e2e.yml"]
