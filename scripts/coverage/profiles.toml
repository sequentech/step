features = ["immudb-tests"]
limitations = [
    "Native library, CLI subprocesses and ImmuDB 1.9.6 integration; each test owns its local database process and files.",
    "Set ELECTORAL_LOG_TEST_IMMUDB_BINARY or install immudb on PATH; no production endpoint or credentials are accepted by the integration fixture.",
