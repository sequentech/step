# This is an explicit rollout list, not a claim that every profile is measured.
# Add service-backed profiles only with their local, synthetic service recipe.
cargo_llvm_cov_version = "0.9.1"
minimum_lines = 95

[profiles.sequent-core]
package = "sequent-core"
features = ["default_features", "keycloak"]
limitations = [
    "Native library and integration tests; matches the existing Rust CI feature selection.",
    "WASM, reports/S3, SQLite, signatures and plugin runtime configurations require separate runs.",
    "Stable LLVM includes inline unit-test code; move tests to separate *_tests.rs files before claiming production-only coverage.",
    "Native stable coverage does not measure branch coverage or doctests.",
]
issue = "https://github.com/sequentech/meta/issues/13292"

[profiles.sequent-core.scope_exceptions]

[profiles.strand]
package = "strand"
features = []
limitations = [
    "Native default backend only; optional backends, rayon and WASM require separate runs.",
    "Stable LLVM includes inline unit-test code and does not measure branches or doctests.",
]
issue = "https://github.com/sequentech/meta/issues/13293"

[profiles.strand.scope_exceptions]
"src/context.rs" = "Trait declarations without executable default methods; implementations are measured in the selected backend."
"src/hashing/mod.rs" = "Module declaration only; the RustCrypto implementation is measured."
"src/random/mod.rs" = "Module declaration only; the rand implementation is measured."
"src/signatures/mod.rs" = "Module declaration only; the Dalek implementation is measured."
"src/symmetric/mod.rs" = "Module declaration only; the RustCrypto implementation is measured."
"src/backend/malachite.rs" = "Disabled malachite feature; requires its own backend run before claiming coverage of that configuration."
"src/backend/num_bigint.rs" = "Disabled num_bigint feature; requires its own backend run before claiming coverage of that configuration."
"src/backend/rug.rs" = "Disabled rug feature; requires its own backend run before claiming coverage of that configuration."
"src/wasm.rs" = "Disabled wasm feature; browser exports require a separate WASM run."
"src/wasm/test.rs" = "Browser-only test module under the disabled wasm feature."
"src/wasm/test/bench.rs" = "Browser benchmark harness under the disabled wasm feature."
"src/wasm/test/demo.rs" = "Browser demonstration under the disabled wasm feature."
"src/wasm/test/test.rs" = "Browser test harness under the disabled wasm feature."

[profiles.velvet]
package = "velvet"
features = []
limitations = [
    "Native library and integration tests with the package's declared dependencies; synthetic ballots and local temporary files only.",
    "Local in-place PDF rendering is included and requires Chrome; cloud PDF transports and object storage require separate runs.",
    "Existing inline tests and public fixture builders contribute to LLVM's source aggregate; not production-only or branch coverage.",
]
issue = "https://github.com/sequentech/meta/issues/13294"

[profiles.velvet.scope_exceptions]
"src/cli/mod.rs" = "Module declarations and re-exports only."
"src/config/mod.rs" = "Module declarations and re-exports only."
"src/fixtures/mod.rs" = "Module declarations and re-exports only; the fixture implementations remain in the measured source inventory."
"src/lib.rs" = "Module declarations only; their implementations are inventoried separately."
"src/pipes/ballot_images/mod.rs" = "Module declarations and re-exports only."
"src/pipes/decode_ballots/mod.rs" = "Module declarations and re-exports only."
"src/pipes/do_tally/counting_algorithm/counting_algorithm.rs" = "Re-exports and trait declaration without executable default methods."
"src/pipes/do_tally/counting_algorithm/mod.rs" = "Module declarations and re-exports only."
"src/pipes/do_tally/mod.rs" = "Module declarations and re-exports only."
"src/pipes/generate_db/mod.rs" = "Module declarations and re-exports only."
"src/pipes/generate_reports/mod.rs" = "Module declarations and re-exports only."
"src/pipes/mark_winners/mod.rs" = "Module declarations and re-exports only."
"src/pipes/mod.rs" = "Module declarations and re-exports only."
"src/config/config.rs" = "Struct declarations and derives without handwritten executable methods. LLVM attributes no line regions to this file; configuration deserialization is exercised through CLI tests."
"src/config/generate_reports.rs" = "Struct/enum declarations, derives and a constant without handwritten executable methods. This native compiler export attributes no line regions to this file."

[profiles.wrap-map-err]
package = "wrap-map-err"
compiler_coverage = true
features = []
limitations = [
    "Native parser/expansion tests and compiled public macro consumers; no ignored cases or source exclusions.",
    "LLVM combines runtime unit-test counters with compiler-time macro expansion counters from the compiled consumer fixtures.",
    "Branch coverage, arbitrary aliases without the Result suffix and the full Windmill/Celery task integration are separate scopes.",
]
issue = "https://github.com/sequentech/meta/issues/13299"

[profiles.wrap-map-err.scope_exceptions]

[profiles.harvest]
package = "harvest"
features = []
limitations = [
    "Native tests with declared default dependencies, including Windmill's default FIPS feature selection.",
    "Request-boundary tests use Rocket's local client; they do not start service workers or verify identity-provider signatures.",
    "Database, Keycloak, broker, storage and complete successful service workflows require local integration fixtures before claiming their coverage.",
    "Existing inline unit tests contribute to LLVM source counters; branch and deployment coverage are separate scopes.",
]
issue = "https://github.com/sequentech/meta/issues/13295"

[profiles.harvest.scope_exceptions]
"src/routes/mod.rs" = "Module declarations only; registered route implementations are inventoried separately."
"src/services/mod.rs" = "Module declarations only."
"src/services/authorization.rs" = "Imports and re-exports of Sequent Core authorization; no handwritten executable methods."
"src/types/mod.rs" = "Module declarations only."
"src/types/optional.rs" = "Struct and derives only; no handwritten executable methods or LLVM line regions."
"src/routes/manual_verification_pdf.rs" = "Not declared in routes/mod.rs or mounted in main.rs, so this source is not part of the native binary. No runtime coverage claim is made for it."

# Only parsing configuration is required here; Harvest's native tests do not
# connect to these endpoints. A complete service fixture is a separate profile.
[profiles.harvest.test_environment]
KEYCLOAK_DB__HOST = "127.0.0.1"
HASURA_DB__HOST = "127.0.0.1"
LOW_SQL_LIMIT = "1000"
DEFAULT_SQL_LIMIT = "20"
DEFAULT_SQL_BATCH_SIZE = "1000"

[profiles.windmill]
package = "windmill"
features = []
limitations = [
    "Native default FIPS profile with local synthetic PostgreSQL 16 on port 3322, matching the Rust CI service fixture.",
    "The ignored voter-channel PostgreSQL regression is run separately; ignored full-service activity-log coverage remains open.",
    "Cloud transports, complete election workflows, optional features and branch coverage require separate evidence.",
    "Existing inline tests contribute to LLVM source counters; this aggregate is not production-only coverage.",
]
issue = "https://github.com/sequentech/meta/issues/13296"

[profiles.windmill.test_environment]
KEYCLOAK_DB__HOST = "127.0.0.1"
KEYCLOAK_DB__PORT = "3322"
KEYCLOAK_DB__USER = "test"
KEYCLOAK_DB__PASSWORD = "test"
KEYCLOAK_DB__DBNAME = "test"
