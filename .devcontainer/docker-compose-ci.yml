# Backend E2E overlay for docker-compose.yml, used by scripts/e2e/run.sh.
#
# It runs prebuilt binaries (scripts/e2e/build.sh) instead of cargo-watch,
# drops fixed container names and host ports so several stacks can share one
# Docker host, waits on healthchecks, and adds the trustees and the test
# driver. Services keep their devcontainer environment and working directories.
#
#   docker compose --env-file .env.development -p step-e2e \
#     -f docker-compose.yml -f docker-compose-ci.yml up -d --wait <services>
#
# Binary and output paths default to this checkout's .cache/backend-e2e.
# scripts/e2e/run.sh writes per-run overrides into its compose.env file.

x-e2e-binaries: &e2e-binaries
  type: bind
  source: ${STEP_E2E_BIN_DIR:-../.cache/backend-e2e/bin}
  target: /opt/step-e2e/bin
  read_only: true

x-e2e-probe: &e2e-probe
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3030/ready || exit 1"]
  interval: 3s
  timeout: 5s
  retries: 100
  start_period: 10s

services:
  # Only holds the checkout mount that other services take with volumes_from.
  devcontainer:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    entrypoint: ["sleep", "infinity"]
    init: true
    cap_add: !reset []
    tmpfs: !reset []
    volumes: !override
      - ..:/workspaces/step:ro

  postgres-volume-init:
    container_name: !reset null

  postgres:
    image: step-backend-e2e-postgresql:local
    container_name: !reset null
    depends_on:
      postgres-volume-init:
        condition: service_completed_successfully

  postgres-keycloak:
    image: step-backend-e2e-postgresql:local
    container_name: !reset null
    depends_on:
      postgres-volume-init:
        condition: service_completed_successfully

  localstack:
    container_name: !reset null
    ports: !reset []

  configure-localstack:
    container_name: !reset null

  postgres-b4v6:
    image: step-backend-e2e-postgresql-b4v6:local
    container_name: !reset null
    depends_on:
      postgres-volume-init:
        condition: service_completed_successfully

  # MinIO no longer publishes community images; build the last release.
  minio:
    image: step-backend-e2e-minio:local
    build:
      context: ../scripts/e2e/docker
      dockerfile: minio.Dockerfile
    container_name: !reset null
    ports: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s

  configure-minio:
    image: step-backend-e2e-configure-minio:local
    build:
      context: ./minio
      dockerfile: ../../scripts/e2e/docker/configure-minio.Dockerfile
    container_name: !reset null

  # Windmill, Beat and Harvest wait until it has finished, as after a deployment's setup job.
  task-queues-setup:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    command: ["/opt/step-e2e/bin/windmill", "setup-queue-database"]
    volumes:
      - *e2e-binaries

  data-connector-agent:
    container_name: !reset null
    ports: !reset []

  graphql-engine:
    container_name: !reset null
    ports: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 30s

  keycloak:
    image: step-backend-e2e-keycloak:local
    container_name: !reset null
    ports: !reset []
    environment:
      # Issue login URLs and tokens for the address the driver can reach.
      KC_HOSTNAME: http://keycloak:8090
    # The realms only: tests use the themes packaged in the image, not the
    # checkout's live theme sources.
    volumes: !override
      - ./keycloak/import:/opt/keycloak/data/import:ro,z
    healthcheck:
      # Ready once the imported tenant realm serves its discovery document.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8090 &&
          printf 'GET /realms/tenant-${SUPER_ADMIN_TENANT_ID}/.well-known/openid-configuration HTTP/1.0\r\nHost: keycloak\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 60s

  harvest:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    ports: !reset []
    command: ["/opt/step-e2e/bin/harvest"]
    volumes:
      - *e2e-binaries
    environment:
      # Presigned downloads must resolve inside the compose network.
      AWS_S3_PUBLIC_URI: http://minio:9000
    healthcheck: *e2e-probe
    depends_on:
      postgres:
        condition: service_healthy
      postgres-keycloak:
        condition: service_healthy
      task-queues-setup:
        condition: service_completed_successfully
      configure-minio:
        condition: service_completed_successfully

  messaging-webhooks:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    ports: !reset []
    command: ["/opt/step-e2e/bin/messaging-webhooks"]
    volumes:
      - *e2e-binaries
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MESSAGING_WEBHOOKS_PORT}/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 10s
    depends_on: !override
      harvest:
        condition: service_healthy

  monitoring-renderer:
    container_name: !reset null

  windmill:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    command:
      - /opt/step-e2e/bin/windmill
      - consume
      - -q
      - beat
      - short_queue
      - tally_queue
      - reports_queue
      - communication_queue
      - import_export_queue
      - electoral_log_batch_queue
      - electoral_log_beat_queue
      - monitoring_queue
      - --prefetch-count
      - "1"
    volumes:
      - *e2e-binaries
    environment:
      AWS_S3_PUBLIC_URI: http://minio:9000
    healthcheck: *e2e-probe
    depends_on:
      postgres:
        condition: service_healthy
      postgres-keycloak:
        condition: service_healthy
      task-queues-setup:
        condition: service_completed_successfully
      postgres-b4v6:
        condition: service_healthy

  beat:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    command: ["/opt/step-e2e/bin/beat"]
    volumes:
      - *e2e-binaries
    environment:
      # The readiness probe initializes the task registry, including S3 plugins.
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_S3_ACCESS_SECRET}
      AWS_S3_PRIVATE_URI: ${AWS_S3_PRIVATE_URI}
      AWS_S3_PUBLIC_BUCKET: ${AWS_S3_PUBLIC_BUCKET}
    healthcheck: *e2e-probe
    depends_on:
      task-queues-setup:
        condition: service_completed_successfully
      configure-minio:
        condition: service_completed_successfully

  b4v6:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    ports: !reset []
    volumes:
      - *e2e-binaries
    entrypoint: ["/opt/step-e2e/bin/b4v6"]
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/boards"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    depends_on: !override
      postgres-b4v6:
        condition: service_healthy
      configure-localstack:
        condition: service_completed_successfully

  trustee1:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    build: !reset null
    container_name: !reset null
    working_dir: /opt/trustee
    volumes: !override
      - *e2e-binaries
      - ../packages/trustee/dev/trustee1.toml:/etc/step-e2e/trustee.toml:ro
      - trustee1_data:/opt/trustee/message_store
    command: !reset []
    entrypoint: ["/opt/step-e2e/bin/trustee", "start", "--b4-url", "http://b4v6:3005", "--trustee-config", "/etc/step-e2e/trustee.toml"]
    depends_on: !override
      b4v6:
        condition: service_healthy

  trustee2:
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    container_name: !reset null
    working_dir: /opt/trustee
    volumes: !override
      - *e2e-binaries
      - ../packages/trustee/dev/trustee2.toml:/etc/step-e2e/trustee.toml:ro
      - trustee2_data:/opt/trustee/message_store
    command: !reset []
    entrypoint: ["/opt/step-e2e/bin/trustee", "start", "--b4-url", "http://b4v6:3005", "--trustee-config", "/etc/step-e2e/trustee.toml"]
    depends_on: !override
      b4v6:
        condition: service_healthy

  # Runs the journeys from inside the compose network; see scripts/e2e/run.sh.
  driver:
    profiles: ["e2e"]
    image: ${STEP_E2E_RUNTIME_IMAGE:-step-backend-e2e-cargo-packages:local}
    init: true
    user: ${STEP_E2E_UID:-0}:${STEP_E2E_GID:-0}
    working_dir: /workspaces/step
    volumes:
      - ..:/workspaces/step:ro
      - *e2e-binaries
      - type: bind
        source: ${STEP_E2E_OUTPUT_DIR:-../.cache/backend-e2e/default}
        target: /out
    environment:
      HOME: /tmp
      STEP_E2E_OUTPUT_DIR: /out
      STEP_E2E_BIN_DIR: /opt/step-e2e/bin
      ENV_SLUG: ${ENV_SLUG}
      SUPER_ADMIN_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
      HASURA_ENDPOINT: ${HASURA_ENDPOINT}
      HASURA_ADMIN_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_PORTAL_TEST_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PORTAL_TEST_PASSWORD}
      API_KEY_CLIENT_SECRET: ${API_KEY_CLIENT_SECRET}
      TRUSTEE1_PASSWORD: ${TRUSTEE1_PASSWORD}
      TRUSTEE2_PASSWORD: ${TRUSTEE2_PASSWORD}
      TRUSTEE_KEYCLOAK_CLIENT_ID: ${TRUSTEE_KEYCLOAK_CLIENT_ID}
      TRUSTEE_KEYCLOAK_CLIENT_SECRET: ${TRUSTEE_KEYCLOAK_CLIENT_SECRET}
      AWS_S3_PRIVATE_URI: ${AWS_S3_PRIVATE_URI}
      AWS_S3_PUBLIC_BUCKET: ${AWS_S3_PUBLIC_BUCKET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_JWKS_CERTS_PATH: ${AWS_S3_JWKS_CERTS_PATH}
      AWS_S3_JWKS_CACHE_POLICY: ${AWS_S3_JWKS_CACHE_POLICY}
      KEYCLOAK_VOTER_GROUP_NAME: ${KEYCLOAK_VOTER_GROUP_NAME}
      VOTING_PORTAL_URL: ${VOTING_PORTAL_URL}
      B4_URL: http://b4v6:3005
      TRUSTEE_PLATFORM_URL: ${TRUSTEE_PLATFORM_URL:-${HASURA_ENDPOINT}}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    entrypoint: ["python3", "-m", "scripts.e2e.journeys"]
