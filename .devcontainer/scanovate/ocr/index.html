<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Card Scanning</title>
    <style>
        html, body, #root {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Sequent: the page mirrors the camera preview whenever the browser
           isn't a phone or a tablet (mirror_view || !isMobile() in its
           client), whatever video_config says. Show it as the camera sees it,
           as on phones. The frames sent for OCR were never mirrored. */
        .video-element {
            transform: none !important;
        }
    </style>
    <script>
        window.__ENV__ = {
            ENABLE_ANALYTICS: "{{ enable_analytics }}".toLowerCase() === "true",
            CLIENT_ID: "{{ client_id }}",
            CLIENT_BASE_URL_PREFIX: "{{ client_base_url_prefix }}".toLowerCase(),
            STICKY_SESSION_HEADER: "{{sticky_session_header}}".toLowerCase()
        };
    </script>
  <script type="module" crossorigin src="/{{client_base_url_prefix}}ocr/assets/index-C243eWap.js" onload="window.parent.postMessage('js-load-success', '*')" onerror="window.parent.postMessage('js-load-error', '*')"></script>
  <link rel="stylesheet" crossorigin href="/{{client_base_url_prefix}}ocr/assets/index-DTxKRzC9.css" onload="window.parent.postMessage('css-load-success', '*')" onerror="window.parent.postMessage('css-load-error', '*')">
</head>
<body>
<div id="root"></div>
<div id="embeddedContent"></div>
</body>
</html>
