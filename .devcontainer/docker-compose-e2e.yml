# Synthetic-data-only local diagnostic overlay. SQL text can contain literal values. Keep expensive statement/plan logging out of capacity runs.
x-e2e-postgres-command: &e2e-postgres-command
  - postgres
  - -c
  - config_file=/etc/postgresql/postgresql.conf
  - -c
  - log_statement=all
  - -c
  - log_file_mode=0600
  - -c
  - log_parameter_max_length=0
  - -c
  - session_preload_libraries=auto_explain
  - -c
  - auto_explain.log_min_duration=0
  - -c
  - auto_explain.log_nested_statements=on
  - -c
  - auto_explain.log_analyze=off

services:
  postgres:
    command: *e2e-postgres-command
  postgres-keycloak:
    command: *e2e-postgres-command
  devcontainer:
    volumes:
      - db_logs:/logs/backend:ro
      - keycloak_db_logs:/logs/keycloak:ro
