# The Vitrine deployment configuration of the development environment: Harvest
# drafts each transparent election event's trust policy from it and from the
# event (docs/docusaurus/docs/07-developers/14-vitrine.md describes every key).
# The keys are development keys: their private halves are in secrets/, next
# to this file. Never use them anywhere else.

domain = "vote.localhost"
operator = "sequent"
quorum = "witnesses"
monitor_quorum = 2
# Other explorer pages anyone can use to look a record up.
# explorers = ["https://explorer.example.org/"]

[anchor]
period = 10
max_gap = 60

[anchor_hubs]
min = 2
min_independent = 1

[profiles]
election = "sha256:b77e087d44cf4621cb2ca2cdf982abb5c46f3b964ce79f9ff2b04ef645624ab1"
events = "sha256:a76f20437d3846a9cb930a379fe545c218e9e80f35c186fff6dd79e870b5ba51"

# The Electoral Board seals and signs each event's policy; it alone approves
# successors.
[sign]
threshold = 1
authorities = ["board"]

[[authorities]]
name = "board"
vkey = "board.localhost/policy+e84875ed+AcTFy7hl2XaVrTmh8sYkfe2zx0jmlSaCRx+U2GfY/ecY"
role = "board"

# Windmill signs the events log's statements with this key (secrets/operator.key).
[[authorities]]
name = "sequent"
vkey = "sequent.localhost/policy+965f165e+AYKfBcg/N5ARcFPC8jzo3rDOsuZSzuAwELOU1cSZQqH0"
role = "operator"

[[auditors]]
name = "auditor"
vkey = "auditor.localhost/auditor+0e0f5920+AeNdKNo9J2Kfb/4XojAVi0e2PL3HtRWq3fJ+OYa/Tl4U"

# The two witnesses of the compose profile `vitrine`. They share the sidecar's
# network namespace, so the sidecar reaches them on localhost.
[[witnesses]]
name = "w1"
vkey = "witness-1.localhost+df7780a5+BDqFD4Tm5LiM1Y9lXZGf4/crPTGNR8HbiE9s8r39o10e"
url = "http://localhost:8096/"
party = "observers"

[[witnesses]]
name = "w2"
vkey = "witness-2.localhost+85abf543+BHrAQhQfW3/7ERydAjcoSYy+W3ovvjQEN6hTIgneCgiR"
url = "http://localhost:8098/"
party = "university"

[[groups]]
name = "witnesses"
threshold = "all"
members = ["w1", "w2"]

# A public election log needs a mirror that the operator doesn't run. In
# development the sidecar's own public listener stands in for the observers'.
[[mirrors]]
url = "http://localhost:8094/{path}/"
party = "observers"

# These independently labelled development parties run in separate services.
# Provision the matching hubs and monitors before enabling an event; never use
# development keys or claim this single-host setup is production independence.

[[hubs]]
name = "hub-a"
vkey = "hub-a.localhost+aa8b8f0c+AYVYw0AGwx4o5dP8ZbfXbGIRn3vD7M2ZEzs7JfL3X98C"
url = "http://localhost:8100/"
operator = "hub-a-party"
# explorer = "http://localhost:8100/explorer/"
quorum = "hw-a"
witnesses = [{name = "hw-a", vkey = "hub-a-witness.localhost+f78cda18+BMDNr5maYRLQ7LsDPIw/BM0vkFQ5ezVClODVcyCJVagZ", party = "hub-a-witness-party"}]

[[hubs]]
name = "hub-b"
vkey = "hub-b.localhost+fb65477d+AV5m7yBs5WBLANN+ZcOZCru0sif5MKaLuluJHLgts2E2"
url = "http://localhost:8104/"
operator = "hub-b-party"
# explorer = "http://localhost:8104/explorer/"
# The ballot verifier hub-b runs, where a voter checks an audited ballot; the
# preview harness serves Step's ballot verifier there.
# ballot_verifier = "http://127.0.0.1:18856/"
quorum = "hw-b"
witnesses = [{name = "hw-b", vkey = "hub-b-witness.localhost+927b93e5+BO7zehUpdCteYfDFbO4kJxPU3dwNffcgRMU1vjS0dqRH", party = "hub-b-witness-party"}]

[[monitors]]
name = "monitor-a"
vkey = "monitor-a.localhost+b451709e+AVg2WdnluLhcTqSA05IwSyqEyzbRBrjyWpPL+6B2VvLm"
url = "http://localhost:8108/"
party = "monitor-a-party"
# explorer = "http://localhost:8108/explorer/"

[[monitors]]
name = "monitor-b"
vkey = "monitor-b.localhost+0c1473f3+AaAHs3slTWk5rPVd1xb3OsEo+efV20OCm7eBVWpYE5r+"
url = "http://localhost:8110/"
party = "monitor-b-party"
# explorer = "http://localhost:8110/explorer/"
