      EMAIL_TRANSPORT_NAME: ${EMAIL_TRANSPORT_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      KEYCLOAK_DB__USER: ${KEYCLOAK_DB__USER}
      KEYCLOAK_DB__PASSWORD: ${KEYCLOAK_DB__PASSWORD}
      KEYCLOAK_DB__HOST: ${KEYCLOAK_DB__HOST}
      KEYCLOAK_DB__PORT: ${KEYCLOAK_DB__PORT}
      KEYCLOAK_DB__DBNAME: ${KEYCLOAK_DB__DBNAME}
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: ${KEYCLOAK_DB__MANAGER__RECYCLING_METHOD}
      HASURA_DB__USER: ${HASURA_DB__USER}
      HASURA_DB__PASSWORD: ${HASURA_DB__PASSWORD}
      HASURA_DB__HOST: ${HASURA_DB__HOST}
      HASURA_DB__PORT: ${HASURA_DB__PORT}
      HASURA_DB__DBNAME: ${HASURA_DB__DBNAME}
      HASURA_DB__MANAGER__RECYCLING_METHOD: ${HASURA_DB__MANAGER__RECYCLING_METHOD}
      LOW_SQL_LIMIT: ${LOW_SQL_LIMIT}
      DEFAULT_SQL_LIMIT: ${DEFAULT_SQL_LIMIT}
      DEFAULT_SQL_BATCH_SIZE: ${DEFAULT_SQL_BATCH_SIZE}
      WINDMILL_PROBE_ADDR: ${WINDMILL_PROBE_ADDR}
      WINDMILL_PROBE_LIVE_PATH: ${WINDMILL_PROBE_LIVE_PATH}
      WINDMILL_PROBE_READY_PATH: ${WINDMILL_PROBE_READY_PATH}
      APP_VERSION: ${APP_VERSION}
      APP_HASH: ${APP_HASH}
      PUBLIC_ASSETS_PATH: ${PUBLIC_ASSETS_PATH}
      DEMO_PUBLIC_KEY: ${DEMO_PUBLIC_KEY}
      B3_PG_HOST: ${B3_PG_HOST}
      B3_PG_PORT: ${B3_PG_PORT}
      B3_PG_USER: ${B3_PG_USER}
      B3_PG_PASSWORD: ${B3_PG_PASSWORD}
      B3_PG_DATABASE: ${B3_PG_DATABASE}
      DOC_RENDERER_BACKEND: ${DOC_RENDERER_BACKEND}
      BALLOT_VERIFIER_URL: ${BALLOT_VERIFIER_URL}
      ENV_SLUG: ${ENV_SLUG}
      KEYCLOAK_VOTER_GROUP_NAME: ${KEYCLOAK_VOTER_GROUP_NAME}

  beat:
    profiles: ["full", "base"]
    stdin_open: true
    image: sequentech.local/cargo-packages
    container_name: beat
    volumes:
      - ..:/workspaces/step:z
    depends_on:
      rabbitmq:
        condition: service_started
      harvest:
        condition: service_started
    working_dir: /workspaces/step/packages/windmill
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: [
      "cargo",
      "watch",
      "--why",
      "--ignore",
      "rust-local-target/",
      "-x",
      "run --bin beat"
    ]
    environment:
      RUSTFLAGS: ${RUSTFLAGS}
      LOG_LEVEL: ${LOG_LEVEL}
      CARGO_TERM_COLOR: ${CARGO_TERM_COLOR}
      HASURA_ENDPOINT: ${HASURA_ENDPOINT}
      AMQP_ADDR: ${AMQP_ADDR}
      BEAT_PROBE_ADDR: ${BEAT_PROBE_ADDR}
      BEAT_PROBE_LIVE_PATH: ${BEAT_PROBE_LIVE_PATH}
      BEAT_PROBE_READY_PATH: ${BEAT_PROBE_READY_PATH}
      ENV_SLUG: ${ENV_SLUG}

  postgres-b3:
    profiles: ["full", "base"]
    image: sequentech.local/postgresql-b3
    container_name: postgres-b3
    build:
      context: ./postgresql-b3
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - b3_db_data:/var/lib/postgresql
      - b3_db_logs:/logs
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      POSTGRES_PASSWORD: ${B3_PG_PASSWORD}
    user: "999:999"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready  -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s
    depends_on:
      - postgres-volume-init

  b3:
    profiles: ["full", "base"]
    stdin_open: true
    image: sequentech.local/cargo-packages
    container_name: b3
    restart: always
    volumes:
      - ..:/workspaces/step:z
    depends_on:
      - postgres-b3
    working_dir: /workspaces/step/packages/b3
    entrypoint: [
      "cargo",
      "watch",
      "--why",
      "--ignore",
      "rust-local-target/",
      "-x",
      "run --bin server --features server sqlcopy -- --host $B3_PG_HOST --port $B3_PG_PORT --username $B3_PG_USER --password $B3_PG_PASSWORD --database $B3_PG_DATABASE --bind $B3_BIND",
    ]
    environment:
      RUSTFLAGS: ${RUSTFLAGS}
      RUST_BACKTRACE: ${RUST_BACKTRACE}
      LOG_LEVEL: ${LOG_LEVEL}
      CARGO_TERM_COLOR: ${CARGO_TERM_COLOR}
      B3_PG_HOST: ${B3_PG_HOST}
      B3_PG_PORT: ${B3_PG_PORT}
      B3_PG_USER: ${B3_PG_USER}
      B3_PG_PASSWORD: ${B3_PG_PASSWORD}
      B3_PG_DATABASE: ${B3_PG_DATABASE}
      B3_BIND: ${B3_BIND}

  admin-portal:
    profiles: ["full"]
    image: sequentech.local/admin-portal-prod
    container_name: admin-portal
    build:
      context: ../packages/
      dockerfile: Dockerfile.prod
      args:
        SPA_NAME: admin-portal
    environment:
        MAX_DIFF_LINES: ${MAX_DIFF_LINES}
        SECONDS_TO_SHOW_COUNTDOWN: ${SECONDS_TO_SHOW_COUNTDOWN}
        SECONDS_TO_SHOW_ALRET: ${SECONDS_TO_SHOW_ALRET}
        HASURA_URL: ${HASURA_ENDPOINT}
        KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}/
        PUBLIC_BUCKET_URL: ${AWS_S3_PUBLIC_URI}/public/
        VOTING_PORTAL_URL: ${VOTING_PORTAL_URL}
        RESULTS_PORTAL_URL: ${RESULTS_PORTAL_URL}
        APP_VERSION: ${APP_VERSION}
        APP_HASH: ${APP_HASH}
        DEFAULT_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
        ONLINE_VOTING_CLIENT_ID: admin-portal
        QUERY_POLL_INTERVAL_MS: 30000
        ACTIVATE_MIRU_EXPORT: "true"
        CUSTOM_URLS_DOMAIN_NAME: ${DOMAIN}

  voting-portal:
    profiles: ["full"]
    image: sequentech.local/voting-portal-prod
    container_name: voting-portal
    build:
      context: ../packages/
      dockerfile: Dockerfile.prod
      args:
        SPA_NAME: voting-portal
    environment:
        DISABLE_AUTH: "false"
        QUERY_POLL_INTERVAL_MS: 2000
        DEFAULT_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
        DEFAULT_EVENT_ID: 33f18502-a67c-4853-8333-a58630663559
        ONLINE_VOTING_CLIENT_ID: voting-portal
        KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}/
        HASURA_URL: ${HASURA_ENDPOINT}
        APP_VERSION: ${APP_VERSION}
        APP_HASH: ${APP_HASH}
        BALLOT_VERIFIER_URL: ${BALLOT_VERIFIER_URL}
        RESULTS_PORTAL_URL: ${RESULTS_PORTAL_URL}
        PUBLIC_BUCKET_URL: ${AWS_S3_PUBLIC_URI}/public/
        KEYCLOAK_ACCESS_TOKEN_LIFESPAN_SECS: 900
        POLLING_DURATION_TIMEOUT: 12000

  results-portal:
    profiles: ["full"]
    image: sequentech.local/results-portal-prod
    container_name: results-portal
    build:
      context: ../packages/
      dockerfile: Dockerfile.prod
      args:
        SPA_NAME: results-portal
    ports:
      - 3004:8000
    environment:
        RESULTS_PORTAL_CLIENT_ID: results-portal
        KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}/
        HASURA_URL: ${HASURA_ENDPOINT}
        APP_VERSION: ${APP_VERSION}
        APP_HASH: ${APP_HASH}
        PUBLIC_BUCKET_URL: ${AWS_S3_PUBLIC_URI}/public/

