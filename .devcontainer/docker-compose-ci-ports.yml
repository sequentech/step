# Optional loopback access. Find the allocated port with `docker compose port`.
services:
  graphql-engine:
    ports:
      - "127.0.0.1::8080"
  keycloak:
    ports:
      - "127.0.0.1::8090"
  minio:
    ports:
      - "127.0.0.1::9000"
