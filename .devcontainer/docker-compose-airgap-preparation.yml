services:
  simplesaml:
    profiles: ["full"]
    image: kenchan0130/simplesamlphp
    platform: linux/amd64
    container_name: simplesamlphp
    ports:
      - "8083:8080"

  # Needed to set up proper permissions for non root user in postgres
  postgres-volume-init:
    profiles: ["full", "base"]
    image: alpine:latest
    platform: linux/amd64
    container_name: postgres-volume-init
    user: root
    group_add:
      - '999'
    command: chown -R 999:999 /logs /keycloak_logs

  postgres:
    profiles: ["full", "base"]
    image: ghcr.io/sequentech/step/postgres:latest
    platform: linux/amd64
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./postgresql/init-electoral-log.sh:/docker-entrypoint-initdb.d/20-electoral-log.sh:ro
      - ../packages/electoral-log/catalog.sql:/electoral-log-catalog.sql:ro
      - ./postgresql/init-task-queues.sh:/docker-entrypoint-initdb.d/30-task-queues.sh:ro
    environment:
      POSTGRES_PASSWORD: ${HASURA_PG_PASSWORD}
      ELECTORAL_LOG_PG_USER: ${ELECTORAL_LOG_PG_USER}
      ELECTORAL_LOG_PG_PASSWORD: ${ELECTORAL_LOG_PG_PASSWORD}
      ELECTORAL_LOG_PG_PROVISIONING_USER: ${ELECTORAL_LOG_PG_PROVISIONING_USER:-electoral_log_provisioner}
      ELECTORAL_LOG_PG_PROVISIONING_PASSWORD: ${ELECTORAL_LOG_PG_PROVISIONING_PASSWORD:-electoral_log_provisioner_dev}
      ELECTORAL_LOG_PG_READER_USER: ${ELECTORAL_LOG_PG_READER_USER:-electoral_log_reader}
      ELECTORAL_LOG_PG_READER_PASSWORD: ${ELECTORAL_LOG_PG_READER_PASSWORD:-electoral_log_reader_dev}
      ELECTORAL_LOG_PG_DATABASE: ${ELECTORAL_LOG_PG_DATABASE}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB_OWNER_USER: ${QUEUE_DB_OWNER_USER}
      QUEUE_DB_OWNER_PASSWORD: ${QUEUE_DB_OWNER_PASSWORD}
      QUEUE_DB_WORKER_USER: ${QUEUE_DB_WORKER_USER}
      QUEUE_DB_WORKER_PASSWORD: ${QUEUE_DB_WORKER_PASSWORD}
      QUEUE_DB_PRODUCER_USER: ${QUEUE_DB_PRODUCER_USER}
      QUEUE_DB_PRODUCER_PASSWORD: ${QUEUE_DB_PRODUCER_PASSWORD}
      QUEUE_DB_READER_USER: ${QUEUE_DB_READER_USER}
      QUEUE_DB_READER_PASSWORD: ${QUEUE_DB_READER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    depends_on:
      - postgres-volume-init

  minio:
    profiles: ["full", "base"]
    container_name: minio
    # Use the release tag for offline docker save/load; digest-only archives lose the image name.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    platform: linux/amd64
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_S3_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${AWS_S3_ROOT_PASSWORD}
      - MINIO_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - MINIO_ACCESS_SECRET=${AWS_S3_ACCESS_SECRET}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 5s

  # used to add headers to minio
  minio-proxy:
    profiles: ["full", "base"]
    container_name: minio-proxy
    image: nginx:latest
    platform: linux/amd64
    ports:
      - "9002:9002"
    depends_on:
      - minio

  configure-minio:
    profiles: ["full", "base"]
    container_name: configure-minio
    image: sequentech.local/configure-minio
    platform: linux/amd64
    build: ./minio
    volumes:
      - ./keycloak/import:/realm-configs:ro,z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${AWS_S3_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${AWS_S3_ROOT_PASSWORD}
      - MINIO_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - MINIO_ACCESS_SECRET=${AWS_S3_ACCESS_SECRET}
      - MINIO_PRIVATE_URI=${AWS_S3_PRIVATE_URI}
      - MINIO_PUBLIC_BUCKET=${AWS_S3_PUBLIC_BUCKET}
      - MINIO_BUCKET=${AWS_S3_BUCKET}
      - KEYCLOAK_TENANT_REALM_CONFIG_S3_KEY=${KEYCLOAK_TENANT_REALM_CONFIG_S3_KEY}
      - KEYCLOAK_ELECTION_EVENT_REALM_CONFIG_S3_KEY=${KEYCLOAK_ELECTION_EVENT_REALM_CONFIG_S3_KEY}
    entrypoint: /scripts/entrypoint.sh

  # hashicorp vault to store secrets
  vault:
    profiles: ["full", "base"]
    container_name: vault
    image: sequentech.local/vault
    platform: linux/amd64
    build: ./vault
    restart: on-failure:10
    #recommend way for docker-outside-of-docker is using devcontainer.json forwardPorts
    #More info: https://github.com/microsoft/vscode-dev-containers/blob/main/containers/docker-from-docker-compose/.devcontainer/docker-compose.yml#L28
    ports:
      - "8201:8201"
      - "8200:8200"
    environment:
      VAULT_ADDR: 'http://127.0.0.1:8200'
      VAULT_UNSEAL_KEY: ciWE5G/CT7/uo5mfaGeRvSyuGRnbtijzvLDg3ru/jv0=
      VAULT_TOKEN: hvs.s0djsk0LLBI19K0DkW4Fajs7
    cap_add:
      - IPC_LOCK
    healthcheck:
      retries: 5
    entrypoint: /opt/vault/entrypoint.sh

  graphql-engine:
    profiles: ["full", "base"]
    image: hasura/graphql-engine:v2.33.1.cli-migrations-v3
    platform: linux/amd64
    container_name: hasura
    ports:
      - "8080:8080"
    restart: always
    environment:
      # applies migrations on start
      HASURA_GRAPHQL_MIGRATIONS_SERVER_TIMEOUT: 60
      HASURA_GRAPHQL_MIGRATIONS_DIR: /workspaces/step/hasura/migrations
      HASURA_GRAPHQL_METADATA_DIR: /workspaces/step/hasura/metadata
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_METADATA_DATABASE_URL: ${HASURA_GRAPHQL_METADATA_DATABASE_URL}
      ## this env var can be used to add the above postgres database to Hasura as a data source. this can be removed/updated based on your needs
      PG_DATABASE_URL: ${HASURA_PG_DATABASE_URL}
      ## enable the console served by server
      # set to "false" to disable console
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE}
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE}
      # https://hasura.io/docs/latest/deployment/graphql-engine-flags/config-examples/#console-assets-on-server
      ## uncomment next line to run console offline (i.e load console assets from server instead of CDN)
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: ${HASURA_GRAPHQL_CONSOLE_ASSETS_DIR}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: ${HASURA_GRAPHQL_ENABLED_LOG_TYPES}
      HASURA_GRAPHQL_METADATA_DEFAULTS: ${HASURA_GRAPHQL_METADATA_DEFAULTS}
      # Hasura role for unauthorized users
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "unauthorized"
      # keycloak jwks endpoint
      HASURA_GRAPHQL_JWT_SECRET: ${HASURA_GRAPHQL_JWT_SECRET}
      HASURA_GRAPHQL_ADMIN_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      ACTIONS_ADMIN_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      HARVEST_DOMAIN: ${HARVEST_DOMAIN}
      HARVEST_BALLOT_LOG_DOMAIN: ${HARVEST_BALLOT_LOG_DOMAIN:-harvest-edge:8080}
    depends_on:
      data-connector-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy

  data-connector-agent:
    profiles: ["full", "base"]
    container_name: data-connector-agent
    image: hasura/graphql-data-connector:v2.31.0
    platform: linux/amd64
    restart: always
    ports:
      - 8081:8081
    environment:
      QUARKUS_LOG_LEVEL: ERROR # FATAL, ERROR, WARN, INFO, DEBUG, TRACE
      ## https://quarkus.io/guides/opentelemetry#configuration-reference
      QUARKUS_OPENTELEMETRY_ENABLED: "false"
      ## QUARKUS_OPENTELEMETRY_TRACER_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/athena/health"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 5s

  postgres-keycloak:
    profiles: ["full", "base"]
    image: ghcr.io/sequentech/step/postgres:latest
    platform: linux/amd64
    container_name: postgres-keycloak
    restart: unless-stopped
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready  -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  keycloak:
    profiles: ["full", "base"]
    container_name: keycloak
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/keycloak:STEP_VERSION
    platform: linux/amd64
    restart: always
    ports:
      - 8090:8090
    environment:
      ENV_SLUG: ${ENV_SLUG}
      QUEUE_DB__HOST: ${QUEUE_DB__HOST}
      QUEUE_DB__PORT: ${QUEUE_DB__PORT}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB__USER: ${QUEUE_DB_PRODUCER_USER}
      QUEUE_DB__PASSWORD: ${QUEUE_DB_PRODUCER_PASSWORD}
      ELECTORAL_LOG_PUBLISH_FAILURE_POLICY: ${ELECTORAL_LOG_PUBLISH_FAILURE_POLICY:-fail-request}
      KC_HOSTNAME: ${KC_HOSTNAME}
      MASTER_SECRET: ${MASTER_SECRET}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_DB: ${KC_DB}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_PORT: ${KC_DB_URL_PORT}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      SUPER_ADMIN_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      APP_VERSION: ${APP_VERSION}
      APP_HASH: ${APP_HASH}
      KC_OTP_RESEND_INTERVAL: ${KC_OTP_RESEND_INTERVAL}
      HARVEST_DOMAIN: ${HARVEST_DOMAIN}
    # Below we're using the dummy email email sender provider but that's just for
    # development, in production we should still use the default SMTP email provider
    #
    # We are doing the same to configure the dummy sms sender provider
    #
    # More info here: https://www.keycloak.org/server/configuration-provider
    entrypoint: >
      /opt/keycloak/bin/kc.sh start-dev
      --features=preview
      --health-enabled=true
      --spi-events-store--provider-default=sequent-privacy
      --spi-user-sessions--provider-default=sequent-privacy
      --spi-user-profile-declarative-user-profile-read-only-attributes=area-id,tenant-id
      --spi-user-profile-declarative-user-profile-admin-read-only-attributes=sequent.admin-read-only.*
      -Dkeycloak.profile.feature.upload_scripts=enabled
      --spi-email-sender-provider=dummy
      --spi-email-sender-dummy-enabled=true
      --spi-email-sender-default-enabled=false
      --spi-sms-sender-provider=dummy
      --spi-sms-sender-dummy-enabled=true
      --spi-sms-sender-aws-enabled=false
      --import-realm
    depends_on:
      postgres:
        condition: service_healthy
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health/live"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 5s

  admin-portal:
    profiles: ["full"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/admin-portal:STEP_VERSION
    platform: linux/amd64
    container_name: admin-portal
    restart: always
    ports:
      - 3002:8000
    stdin_open: true
    environment:
        WBRAID_BOARD_URL: ${WBRAID_BOARD_PUBLIC_URL:-http://localhost:3005}
        MAX_DIFF_LINES: ${MAX_DIFF_LINES}
        SECONDS_TO_SHOW_COUNTDOWN: ${SECONDS_TO_SHOW_COUNTDOWN}
        SECONDS_TO_SHOW_ALERT: ${SECONDS_TO_SHOW_ALERT}

  voting-portal:
    profiles: ["full"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/voting-portal:STEP_VERSION
    platform: linux/amd64
    container_name: voting-portal
    depends_on:
      - admin-portal
    restart: always
    ports:
      - 3000:8000
    stdin_open: true

  results-portal:
    profiles: ["full"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/results-portal:STEP_VERSION
    platform: linux/amd64
    container_name: results-portal
    depends_on:
      - admin-portal
    restart: always
    ports:
      - 3004:8000
    stdin_open: true

  harvest-edge:
    profiles: ["full", "base"]
    image: nginx:latest
    restart: always
    environment:
      HARVEST_DOMAIN: ${HARVEST_DOMAIN}
    volumes:
      - ./harvest-edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      harvest:
        condition: service_started

  harvest:
    profiles: ["full", "base"]
    stdin_open: true
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/harvest:STEP_VERSION
    platform: linux/amd64
    depends_on:
      task-queues-setup:
        condition: service_completed_successfully
    environment:
      # Monitoring snapshot cadence, the same on beat, windmill and harvest:
      # seconds between passes (5..3600), and between full voter reads.
      MONITORING_SNAPSHOT_INTERVAL_SECONDS: ${MONITORING_SNAPSHOT_INTERVAL_SECONDS:-30}
      MONITORING_VOTER_FULL_PASS_SECONDS: ${MONITORING_VOTER_FULL_PASS_SECONDS:-300}
      ENV_SLUG: ${ENV_SLUG}
      RUST_BACKTRACE: ${RUST_BACKTRACE}
      SUPER_ADMIN_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
      LOG_LEVEL: ${LOG_LEVEL}
      ROCKET_ADDRESS: ${ROCKET_ADDRESS}
      ROCKET_PORT: ${HARVEST_PORT}
      RUSTFLAGS: ${RUSTFLAGS}
      CARGO_TERM_COLOR: ${CARGO_TERM_COLOR}
      ELECTORAL_LOG_PG_HOST: ${ELECTORAL_LOG_PG_HOST}
      ELECTORAL_LOG_PG_PORT: ${ELECTORAL_LOG_PG_PORT}
      ELECTORAL_LOG_PG_USER: ${ELECTORAL_LOG_PG_USER}
      ELECTORAL_LOG_PG_PASSWORD: ${ELECTORAL_LOG_PG_PASSWORD}
      ELECTORAL_LOG_PG_READER_USER: ${ELECTORAL_LOG_PG_READER_USER:-electoral_log_reader}
      ELECTORAL_LOG_PG_READER_PASSWORD: ${ELECTORAL_LOG_PG_READER_PASSWORD:-electoral_log_reader_dev}
      ELECTORAL_LOG_PG_DATABASE: ${ELECTORAL_LOG_PG_DATABASE}
      ELECTORAL_LOG_PG_EVENT_POOL_SIZE: ${ELECTORAL_LOG_PG_EVENT_POOL_SIZE:-4}
      ELECTORAL_LOG_PG_OPEN_EVENTS: ${ELECTORAL_LOG_PG_OPEN_EVENTS:-16}
      # Role of the backups, granted read access to each election event's database.
      ELECTORAL_LOG_PG_BACKUP_USER: ${ELECTORAL_LOG_PG_BACKUP_USER:-}
      ELECTORAL_LOG_PG_SSLMODE: ${ELECTORAL_LOG_PG_SSLMODE}
      ELECTORAL_LOG_PG_SSLROOTCERT: ${ELECTORAL_LOG_PG_SSLROOTCERT:-}
      SMS_TRANSPORT_NAME: ${SMS_TRANSPORT_NAME}
      AWS_SNS_ATTRIBUTES: ${AWS_SNS_ATTRIBUTES}
      EMAIL_TRANSPORT_NAME: ${EMAIL_TRANSPORT_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      KEYCLOAK_DB__USER: ${KEYCLOAK_DB__USER}
      KEYCLOAK_DB__PASSWORD: ${KEYCLOAK_DB__PASSWORD}
      KEYCLOAK_DB__HOST: ${KEYCLOAK_DB__HOST}
      KEYCLOAK_DB__PORT: ${KEYCLOAK_DB__PORT}
      KEYCLOAK_DB__DBNAME: ${KEYCLOAK_DB__DBNAME}
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: ${KEYCLOAK_DB__MANAGER__RECYCLING_METHOD}
      QUEUE_DB__HOST: ${QUEUE_DB__HOST}
      QUEUE_DB__PORT: ${QUEUE_DB__PORT}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB__USER: ${QUEUE_DB_PRODUCER_USER}
      QUEUE_DB__PASSWORD: ${QUEUE_DB_PRODUCER_PASSWORD}
      QUEUE_DB_READER_USER: ${QUEUE_DB_READER_USER}
      QUEUE_DB_READER_PASSWORD: ${QUEUE_DB_READER_PASSWORD}
      QUEUE_DB__MANAGER__RECYCLING_METHOD: ${QUEUE_DB__MANAGER__RECYCLING_METHOD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KIOSK_KEYCLOAK_URL: ${KIOSK_KEYCLOAK_URL:-}
      HARVEST_JWT_ISSUER_URLS: ${HARVEST_JWT_ISSUER_URLS:-}
      KEYCLOAK_PASSWORD_POLICY_CACHE_TTL_SECS: ${KEYCLOAK_PASSWORD_POLICY_CACHE_TTL_SECS:-30}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      HASURA_ENDPOINT: ${HASURA_ENDPOINT}
      HASURA_DB__USER: ${HASURA_DB__USER}
      HASURA_DB__PASSWORD: ${HASURA_DB__PASSWORD}
      HASURA_DB__HOST: ${HASURA_DB__HOST}
      HASURA_DB__PORT: ${HASURA_DB__PORT}
      HASURA_DB__DBNAME: ${HASURA_DB__DBNAME}
      HASURA_DB__MANAGER__RECYCLING_METHOD: ${HASURA_DB__MANAGER__RECYCLING_METHOD}
      VOTING_PORTAL_URL: ${VOTING_PORTAL_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      LOW_SQL_LIMIT: ${LOW_SQL_LIMIT}
      DEFAULT_SQL_LIMIT: ${DEFAULT_SQL_LIMIT}
      DEFAULT_SQL_BATCH_SIZE: ${DEFAULT_SQL_BATCH_SIZE}
      HARVEST_PROBE_ADDR: ${HARVEST_PROBE_ADDR}
      HARVEST_PROBE_LIVE_PATH: ${HARVEST_PROBE_LIVE_PATH}
      HARVEST_PROBE_READY_PATH: ${HARVEST_PROBE_READY_PATH}
      KEYCLOAK_VOTER_GROUP_NAME: ${KEYCLOAK_VOTER_GROUP_NAME}
      AWS_S3_PRIVATE_URI: ${AWS_S3_PRIVATE_URI}
      AWS_S3_PUBLIC_URI: ${AWS_S3_PUBLIC_URI}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PUBLIC_BUCKET: ${AWS_S3_PUBLIC_BUCKET}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_ACCESS_SECRET: ${AWS_S3_ACCESS_SECRET}
      PUBLIC_ASSETS_PATH: ${PUBLIC_ASSETS_PATH}

      # used by AWS S3 to "load_from_env()". Don't use this in production, not
      # needed. Instead, in production we'll use Web Identity Tokens
      AWS_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_S3_ACCESS_SECRET}

      SECRETS_BACKEND: ${SECRETS_BACKEND}
      MASTER_SECRET: ${MASTER_SECRET}
      AWS_SM_KEY_PREFIX: ${AWS_SM_KEY_PREFIX}

      AWS_S3_UPLOAD_EXPIRATION_SECS: ${AWS_S3_UPLOAD_EXPIRATION_SECS}
      AWS_S3_FETCH_EXPIRATION_SECS: ${AWS_S3_FETCH_EXPIRATION_SECS}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_MAX_UPLOAD_BYTES: ${AWS_S3_MAX_UPLOAD_BYTES}

      CLOUDFLARE_ZONE: ${CLOUDFLARE_ZONE}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      CUSTOM_URLS_IP_DNS_CONTENT: ${CUSTOM_URLS_IP_DNS_CONTENT}
      WBRAID_B4_URL: http://b4v6:3005
      WBRAID_BOARD_DATABASE_URL: postgres://postgres@postgres-b4v6:5432/wbraid_board
      WBRAID_B4_PG_PASSWORD: ${WBRAID_B4_PG_PASSWORD}
      # The monitoring renderer, reached on the internal monitoring-renderer
      # network only.
      HARVEST_MONITORING_RENDERER_URL: ${HARVEST_MONITORING_RENDERER_URL:-http://monitoring-renderer:8080}
      HARVEST_MONITORING_RENDERER_TOKEN: ${MONITORING_RENDERER_TOKEN}
      HARVEST_MONITORING_RENDERER_TIMEOUT_MS: ${HARVEST_MONITORING_RENDERER_TIMEOUT_MS:-5000}
      # Provider callbacks arrive only through messaging-webhooks.
      MESSAGING_RELAY_SECRET: ${MESSAGING_RELAY_SECRET:?MESSAGING_RELAY_SECRET must be set}
      MESSAGING_WEBHOOKS_PUBLIC_URL: ${MESSAGING_WEBHOOKS_PUBLIC_URL}
      MESSAGING_WEBHOOKS_MAX_BODY_BYTES: ${MESSAGING_WEBHOOKS_MAX_BODY_BYTES:-262144}
      MESSAGING_CALLBACK_CONNECTIONS: ${MESSAGING_CALLBACK_CONNECTIONS:-4}
    networks:
      - default
      - monitoring-renderer
    # No published port: harvest is internal. Hasura and messaging-webhooks
    # reach it on the compose network (HARVEST_DOMAIN).

  # The one public entrypoint for messaging provider callbacks; relays each
  # one, signed, to harvest's internal /messaging/callbacks.
  messaging-webhooks:
    profiles: ["full", "base"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/messaging-webhooks:STEP_VERSION
    platform: linux/amd64
    depends_on:
      - harvest
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      ROCKET_ADDRESS: ${ROCKET_ADDRESS}
      ROCKET_PORT: ${MESSAGING_WEBHOOKS_PORT}
      HARVEST_DOMAIN: ${HARVEST_DOMAIN}
      MESSAGING_RELAY_SECRET: ${MESSAGING_RELAY_SECRET:?MESSAGING_RELAY_SECRET must be set}
      MESSAGING_WEBHOOKS_MAX_BODY_BYTES: ${MESSAGING_WEBHOOKS_MAX_BODY_BYTES:-262144}
      MESSAGING_WEBHOOKS_MAX_IN_FLIGHT: ${MESSAGING_WEBHOOKS_MAX_IN_FLIGHT:-16}
    ports:
     - ${MESSAGING_WEBHOOKS_PORT}:${MESSAGING_WEBHOOKS_PORT}

  # Draws monitoring widgets with dbt Charts. Internal only: no published
  # ports, on a network with no route out, shared with harvest alone.
  monitoring-renderer:
    profiles: ["full", "base"]
    container_name: monitoring-renderer
    image: sequentech.local/monitoring-renderer
    platform: linux/amd64
    build: ../packages/monitoring-renderer
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RENDERER_TOKEN: ${MONITORING_RENDERER_TOKEN}
      RENDERER_CONCURRENCY: ${MONITORING_RENDERER_CONCURRENCY:-2}
    networks:
      - monitoring-renderer
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-b4v6:
    profiles: ["full", "base"]
    image: postgres:16-bookworm
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wbraid_board
      POSTGRES_PASSWORD: ${WBRAID_B4_PG_PASSWORD:?set the native board database password}
    volumes:
      - wbraid_board_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wbraid_board"]
      interval: 5s
      timeout: 5s
      retries: 30

  b4v6:
    profiles: ["full", "base"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/b4v6:STEP_VERSION
    platform: linux/amd64
    restart: unless-stopped
    ports: ["3005:3005"]
    depends_on:
      postgres-b4v6:
        condition: service_healthy
    environment:
      WBRAID_B4_BIND: 0.0.0.0:3005
      DATABASE_URL: postgres://postgres@postgres-b4v6:5432/wbraid_board
      WBRAID_B4_PG_PASSWORD: ${WBRAID_B4_PG_PASSWORD}
      AWS_ENDPOINT_URL: ${AWS_S3_PRIVATE_URI}
      AWS_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_S3_ACCESS_SECRET}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${AWS_S3_BUCKET}

  trustee1:
    profiles: ["full"]
    stdin_open: true
    container_name: trustee1
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/trustee:STEP_VERSION
    platform: linux/amd64
    working_dir: /opt/trustee
    volumes:
      - trustee1_data:/opt/trustee
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      TRUSTEE_NAME: trustee1
      TRUSTEE_CONFIG_PATH: ${TRUSTEE1_CONFIG:-/opt/trustee/trustee.toml}
      TRUSTEE_CONFIG: ${TRUSTEE1_CONFIG_DATA:-}
      SECRETS_BACKEND: ${SECRETS_BACKEND}
      AWS_SM_KEY_PREFIX: ${AWS_SM_KEY_PREFIX}
      AWS_REGION: ${AWS_REGION}
      VAULT_SERVER_URL: ${VAULT_SERVER_URL}
      VAULT_TOKEN: ${VAULT_TOKEN}
      B4_URL: http://b4v6:3005
      TRUSTEE_PASSWORD: ${TRUSTEE1_PASSWORD}
      TRUSTEE_PLATFORM_URL: ${TRUSTEE_PLATFORM_URL:-${HASURA_ENDPOINT}}
      TRUSTEE_KEYCLOAK_URL: ${KEYCLOAK_URL}
      TRUSTEE_KEYCLOAK_REALM: tenant-${TENANT_ID}
      TRUSTEE_KEYCLOAK_CLIENT_ID: ${TRUSTEE_KEYCLOAK_CLIENT_ID}
      TRUSTEE_KEYCLOAK_CLIENT_SECRET: ${TRUSTEE_KEYCLOAK_CLIENT_SECRET}
    depends_on:
      harvest:
        condition: service_started

  trustee2:
    profiles: ["full"]
    stdin_open: true
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/trustee:STEP_VERSION
    platform: linux/amd64
    container_name: trustee2
    depends_on:
      harvest:
        condition: service_started
    working_dir: /opt/trustee
    volumes:
      - trustee2_data:/opt/trustee
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      TRUSTEE_NAME: trustee2
      TRUSTEE_CONFIG_PATH: ${TRUSTEE2_CONFIG:-/opt/trustee/trustee.toml}
      TRUSTEE_CONFIG: ${TRUSTEE2_CONFIG_DATA:-}
      SECRETS_BACKEND: ${SECRETS_BACKEND}
      AWS_SM_KEY_PREFIX: ${AWS_SM_KEY_PREFIX}
      AWS_REGION: ${AWS_REGION}
      VAULT_SERVER_URL: ${VAULT_SERVER_URL}
      VAULT_TOKEN: ${VAULT_TOKEN}
      B4_URL: http://b4v6:3005
      TRUSTEE_PASSWORD: ${TRUSTEE2_PASSWORD}
      TRUSTEE_PLATFORM_URL: ${TRUSTEE_PLATFORM_URL:-${HASURA_ENDPOINT}}
      TRUSTEE_KEYCLOAK_URL: ${KEYCLOAK_URL}
      TRUSTEE_KEYCLOAK_REALM: tenant-${TENANT_ID}
      TRUSTEE_KEYCLOAK_CLIENT_ID: ${TRUSTEE_KEYCLOAK_CLIENT_ID}
      TRUSTEE_KEYCLOAK_CLIENT_SECRET: ${TRUSTEE_KEYCLOAK_CLIENT_SECRET}


  # Installs PGMQ and the queues in the task-queue database, as the database owner,
  # like the setup job of a deployment. It is idempotent.
  task-queues-setup:
    profiles: ["full", "base"]
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/windmill:STEP_VERSION
    platform: linux/amd64
    container_name: task-queues-setup
    entrypoint: ["./main"]
    command: ["setup-queue-database"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV_SLUG: ${ENV_SLUG}
      LOG_LEVEL: ${LOG_LEVEL}
      QUEUE_DB__HOST: ${QUEUE_DB__HOST}
      QUEUE_DB__PORT: ${QUEUE_DB__PORT}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB__USER: ${QUEUE_DB_OWNER_USER}
      QUEUE_DB__PASSWORD: ${QUEUE_DB_OWNER_PASSWORD}
      QUEUE_DB_WORKER_ROLE: ${QUEUE_DB_WORKER_USER}
      QUEUE_DB_PRODUCER_ROLE: ${QUEUE_DB_PRODUCER_USER}
      QUEUE_DB_READER_ROLE: ${QUEUE_DB_READER_USER}

  windmill:
    profiles: ["full", "base"]
    stdin_open: true
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/windmill:STEP_VERSION
    platform: linux/amd64
    restart: always
    depends_on:
      task-queues-setup:
        condition: service_completed_successfully
      configure-minio:
        condition: service_completed_successfully
    environment:
      # Monitoring snapshot cadence, the same on beat, windmill and harvest:
      # seconds between passes (5..3600), and between full voter reads.
      MONITORING_SNAPSHOT_INTERVAL_SECONDS: ${MONITORING_SNAPSHOT_INTERVAL_SECONDS:-30}
      MONITORING_VOTER_FULL_PASS_SECONDS: ${MONITORING_VOTER_FULL_PASS_SECONDS:-300}
      ENV_SLUG: ${ENV_SLUG}
      RUSTFLAGS: ${RUSTFLAGS}
      RUST_BACKTRACE: ${RUST_BACKTRACE}
      LOG_LEVEL: ${LOG_LEVEL}
      CARGO_TERM_COLOR: ${CARGO_TERM_COLOR}
      HASURA_ENDPOINT: ${HASURA_ENDPOINT}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_PASSWORD_POLICY_CACHE_TTL_SECS: ${KEYCLOAK_PASSWORD_POLICY_CACHE_TTL_SECS:-30}
      ELECTORAL_LOG_PG_HOST: ${ELECTORAL_LOG_PG_HOST}
      ELECTORAL_LOG_PG_PORT: ${ELECTORAL_LOG_PG_PORT}
      ELECTORAL_LOG_PG_USER: ${ELECTORAL_LOG_PG_USER}
      ELECTORAL_LOG_PG_PASSWORD: ${ELECTORAL_LOG_PG_PASSWORD}
      # Creates and drops each election event's database, which the role above owns.
      ELECTORAL_LOG_PG_PROVISIONING_USER: ${ELECTORAL_LOG_PG_PROVISIONING_USER:-electoral_log_provisioner}
      ELECTORAL_LOG_PG_PROVISIONING_PASSWORD: ${ELECTORAL_LOG_PG_PROVISIONING_PASSWORD:-electoral_log_provisioner_dev}
      # Granted read access to each election event's database when it is created.
      ELECTORAL_LOG_PG_READER_USER: ${ELECTORAL_LOG_PG_READER_USER:-electoral_log_reader}
      ELECTORAL_LOG_PG_DATABASE: ${ELECTORAL_LOG_PG_DATABASE}
      ELECTORAL_LOG_PG_EVENT_POOL_SIZE: ${ELECTORAL_LOG_PG_EVENT_POOL_SIZE:-4}
      ELECTORAL_LOG_PG_OPEN_EVENTS: ${ELECTORAL_LOG_PG_OPEN_EVENTS:-16}
      # Role of the backups, granted read access to each election event's database.
      ELECTORAL_LOG_PG_BACKUP_USER: ${ELECTORAL_LOG_PG_BACKUP_USER:-}
      ELECTORAL_LOG_PG_SSLMODE: ${ELECTORAL_LOG_PG_SSLMODE}
      ELECTORAL_LOG_PG_SSLROOTCERT: ${ELECTORAL_LOG_PG_SSLROOTCERT:-}
      AWS_S3_PRIVATE_URI: ${AWS_S3_PRIVATE_URI}
      AWS_S3_PUBLIC_URI: ${AWS_S3_PUBLIC_URI}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PUBLIC_BUCKET: ${AWS_S3_PUBLIC_BUCKET}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_ACCESS_SECRET: ${AWS_S3_ACCESS_SECRET}
      AWS_S3_JWKS_CACHE_POLICY: ${AWS_S3_JWKS_CACHE_POLICY}

      # used by AWS S3 to "load_from_env()". Don't use this in production, not
      # needed. Instead, in production we'll use Web Identity Tokens
      AWS_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_S3_ACCESS_SECRET}

      AWS_S3_UPLOAD_EXPIRATION_SECS: ${AWS_S3_UPLOAD_EXPIRATION_SECS}
      AWS_S3_FETCH_EXPIRATION_SECS: ${AWS_S3_FETCH_EXPIRATION_SECS}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_MAX_UPLOAD_BYTES: ${AWS_S3_MAX_UPLOAD_BYTES}

      SECRETS_BACKEND: ${SECRETS_BACKEND}
      MASTER_SECRET: ${MASTER_SECRET}
      AWS_SM_KEY_PREFIX: ${AWS_SM_KEY_PREFIX}
      MESSAGING_WEBHOOKS_PUBLIC_URL: ${MESSAGING_WEBHOOKS_PUBLIC_URL}

      KEYCLOAK_ELECTION_EVENT_REALM_CONFIG_S3_KEY: ${KEYCLOAK_ELECTION_EVENT_REALM_CONFIG_S3_KEY}
      KEYCLOAK_TENANT_REALM_CONFIG_S3_KEY: ${KEYCLOAK_TENANT_REALM_CONFIG_S3_KEY}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SUPER_ADMIN_TENANT_ID: ${SUPER_ADMIN_TENANT_ID}
      VOTING_PORTAL_URL: ${VOTING_PORTAL_URL}
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL}
      KIOSK_VOTING_PORTAL_URL: ${KIOSK_VOTING_PORTAL_URL:-}
      RESULTS_PORTAL_URL: ${RESULTS_PORTAL_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      SMS_TRANSPORT_NAME: ${SMS_TRANSPORT_NAME}
      AWS_SNS_ATTRIBUTES: ${AWS_SNS_ATTRIBUTES}
      EMAIL_TRANSPORT_NAME: ${EMAIL_TRANSPORT_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      KEYCLOAK_DB__USER: ${KEYCLOAK_DB__USER}
      KEYCLOAK_DB__PASSWORD: ${KEYCLOAK_DB__PASSWORD}
      KEYCLOAK_DB__HOST: ${KEYCLOAK_DB__HOST}
      KEYCLOAK_DB__PORT: ${KEYCLOAK_DB__PORT}
      KEYCLOAK_DB__DBNAME: ${KEYCLOAK_DB__DBNAME}
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: ${KEYCLOAK_DB__MANAGER__RECYCLING_METHOD}
      QUEUE_DB__HOST: ${QUEUE_DB__HOST}
      QUEUE_DB__PORT: ${QUEUE_DB__PORT}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB__USER: ${QUEUE_DB_WORKER_USER}
      QUEUE_DB__PASSWORD: ${QUEUE_DB_WORKER_PASSWORD}
      QUEUE_DB__MANAGER__RECYCLING_METHOD: ${QUEUE_DB__MANAGER__RECYCLING_METHOD}
      HASURA_DB__USER: ${HASURA_DB__USER}
      HASURA_DB__PASSWORD: ${HASURA_DB__PASSWORD}
      HASURA_DB__HOST: ${HASURA_DB__HOST}
      HASURA_DB__PORT: ${HASURA_DB__PORT}
      HASURA_DB__DBNAME: ${HASURA_DB__DBNAME}
      HASURA_DB__MANAGER__RECYCLING_METHOD: ${HASURA_DB__MANAGER__RECYCLING_METHOD}
      LOW_SQL_LIMIT: ${LOW_SQL_LIMIT}
      DEFAULT_SQL_LIMIT: ${DEFAULT_SQL_LIMIT}
      DEFAULT_SQL_BATCH_SIZE: ${DEFAULT_SQL_BATCH_SIZE}
      ELECTORAL_LOG_BATCH_SIZE: ${ELECTORAL_LOG_BATCH_SIZE:-1000}
      QUEUE_ARCHIVE_RETENTION_HOURS: ${QUEUE_ARCHIVE_RETENTION_HOURS:-168}
      ELECTORAL_LOG_BATCH_MAX_BYTES: ${ELECTORAL_LOG_BATCH_MAX_BYTES:-16777216}
      ELECTORAL_LOG_CHECKPOINT_COPY: ${ELECTORAL_LOG_CHECKPOINT_COPY:-off}
      ELECTORAL_LOG_CHECKPOINT_BUCKET: ${ELECTORAL_LOG_CHECKPOINT_BUCKET:-electoral-log-checkpoints}
      ELECTORAL_LOG_CHECKPOINT_LOCK_MODE: ${ELECTORAL_LOG_CHECKPOINT_LOCK_MODE:-compliance}
      ELECTORAL_LOG_CHECKPOINT_RETENTION_DAYS: ${ELECTORAL_LOG_CHECKPOINT_RETENTION_DAYS:-3650}
      WINDMILL_PROBE_ADDR: ${WINDMILL_PROBE_ADDR}
      WINDMILL_PROBE_LIVE_PATH: ${WINDMILL_PROBE_LIVE_PATH}
      WINDMILL_PROBE_READY_PATH: ${WINDMILL_PROBE_READY_PATH}
      KEYCLOAK_VOTER_GROUP_NAME: ${KEYCLOAK_VOTER_GROUP_NAME}

      PUBLIC_ASSETS_PATH: ${PUBLIC_ASSETS_PATH}
       #Demo key
      DEMO_PUBLIC_KEY: ${DEMO_PUBLIC_KEY}

  beat:
    restart: unless-stopped
    profiles: ["full"]
    stdin_open: true
    image: 581718213778.dkr.ecr.us-east-1.amazonaws.com/windmill:STEP_VERSION
    platform: linux/amd64
    container_name: beat
    entrypoint: ["./beat"]
    depends_on:
      task-queues-setup:
        condition: service_completed_successfully
    environment:
      # Monitoring snapshot cadence, the same on beat, windmill and harvest:
      # seconds between passes (5..3600), and between full voter reads.
      MONITORING_SNAPSHOT_INTERVAL_SECONDS: ${MONITORING_SNAPSHOT_INTERVAL_SECONDS:-30}
      MONITORING_VOTER_FULL_PASS_SECONDS: ${MONITORING_VOTER_FULL_PASS_SECONDS:-300}
      ENV_SLUG: ${ENV_SLUG}
      QUEUE_DB__HOST: ${QUEUE_DB__HOST}
      QUEUE_DB__PORT: ${QUEUE_DB__PORT}
      QUEUE_DB__DBNAME: ${QUEUE_DB__DBNAME}
      QUEUE_DB__USER: ${QUEUE_DB_WORKER_USER}
      QUEUE_DB__PASSWORD: ${QUEUE_DB_WORKER_PASSWORD}
      QUEUE_DB__MANAGER__RECYCLING_METHOD: ${QUEUE_DB__MANAGER__RECYCLING_METHOD}
      RUSTFLAGS: ${RUSTFLAGS}
      LOG_LEVEL: ${LOG_LEVEL}
      CARGO_TERM_COLOR: ${CARGO_TERM_COLOR}
      HASURA_ENDPOINT: ${HASURA_ENDPOINT}
      BEAT_PROBE_ADDR: ${BEAT_PROBE_ADDR}
      BEAT_PROBE_LIVE_PATH: ${BEAT_PROBE_LIVE_PATH}
      BEAT_PROBE_READY_PATH: ${BEAT_PROBE_READY_PATH}
      ELECTORAL_LOG_CHECKPOINT_INTERVAL_SECS: ${ELECTORAL_LOG_CHECKPOINT_INTERVAL_SECS:-300}
      QUEUE_ARCHIVE_PURGE_INTERVAL_SECS: ${QUEUE_ARCHIVE_PURGE_INTERVAL_SECS:-3600}
      # Messaging, the same callback base as harvest and windmill.
      MESSAGING_WEBHOOKS_PUBLIC_URL: ${MESSAGING_WEBHOOKS_PUBLIC_URL}

networks:
  # Harvest and the monitoring renderer only; no route out.
  monitoring-renderer:
    internal: true

volumes:
  trustee1_data:
  trustee2_data:
  wbraid_board_data:
