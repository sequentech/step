server {
    listen 9002;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configurable headers
        add_header Cross-Origin-Embedder-Policy credentialless;
        # Required for pages that enforce Cross-Origin-Embedder-Policy: require-corp
        # (e.g. voting-portal, for WASM SharedArrayBuffer support) to be able to
        # load this proxy's responses as a subresource (fetch/iframe/img).
        add_header Cross-Origin-Resource-Policy cross-origin;
    }
}