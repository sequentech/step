# Location snippet for the admin portal's own nginx (packages/default.conf
# includes /etc/nginx/default.d/*.conf), next to b4.conf. The Admin Portal
# sends an encrypted configuration package's staging document and transfer
# password here, same origin, never through Hasura: Harvest unwraps it server
# side (harvest/src/routes/configuration_package_intake.rs). Harvest refuses
# the request unless this nginx received it over HTTPS, or plain HTTP to
# loopback; it trusts this header only because Harvest is not published and
# this proxy overwrites it. Nothing here logs the body.
location = /configuration-package-intake/unwrap {
    limit_except POST {
        deny all;
    }
    # Request lines carry no secret, but this endpoint needs no access log.
    access_log off;
    # Docker's DNS, asked per request: Harvest may start later or be recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The air-gapped bundle's HARVEST_PORT (scripts/airgap-files/.env).
    set $harvest_upstream harvest:8400;
    proxy_pass http://$harvest_upstream;
    # Exactly as the browser sent it (with any port): Harvest compares it
    # with the request's Origin.
    proxy_set_header Host $http_host;
    # Only this server's own scheme, overwriting anything the client sent.
    # An inbound X-Forwarded-Proto is never trusted here: behind a separate
    # TLS terminator this is "http", and Harvest refuses non-loopback HTTP
    # (fail closed) until that topology is proven and configured to overwrite
    # the header itself.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A document ID and a password of at most 1024 bytes.
    client_max_body_size 8k;
}
