# Location snippet for the admin portal's own nginx (packages/default.conf
# includes /etc/nginx/default.d/*.conf), used where no reverse proxy fronts the
# portal, as in the air-gapped bundle. Trustees reach the board service (b4)
# only through Harvest, which checks their token and board membership; b4
# itself is not published. Authorization and the body pass through unchanged.
location /b4/ {
    # Docker's DNS, asked per request: Harvest may start later or be recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The air-gapped bundle's HARVEST_PORT (scripts/airgap-files/.env).
    set $harvest_upstream harvest:8400;
    # With a variable and no URI part, nginx sends the original request URI,
    # /b4/ prefix and query included, so that URI must start with /b4/ as sent,
    # not only after normalization.
    if ($request_uri !~ "^/b4/") {
        return 404;
    }
    proxy_pass http://$harvest_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # b4's JSON request limit (axum default).
    client_max_body_size 2m;
}
