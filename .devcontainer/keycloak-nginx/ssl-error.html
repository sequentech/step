            height: 22px;
            fill: #D32F2F;
        }

        .kc-error-alert-text {

            font-family: 'Roboto', sans-serif;

            width: 100%;
            max-width: 474px;
            height: 42px;
            background: #0F054C;
            box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.12), 0px 2px 2px rgba(0, 0, 0, 0.14), 0px 3px 1px -2px rgba(0, 0, 0, 0.2);

            font-family: 'Roboto', sans-serif;
            font-style: normal;
            font-weight: 500;
            font-size: 15px;
            line-height: 26px;

            color: #FFFFFF !important;

<body class="login-pf">
    <div class="login-pf-page">
        <div class="login-pf-page-header">
            <div id="kc-header-wrapper">
                <div class="logo"></div>
            </div>
        </div>
        <div class="card-pf">
            <div id="kc-error-message">
                <h1 id="error-title" class="kc-error-title">AUTHENTICATION FAILED</h1>
                <div class="kc-error-alert">
                    <div class="kc-error-alert-icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="kc-error-alert-icon" aria-hidden="true">
                            <path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
                        </svg>
                    </div>
                    <span id="error-message" class="kc-error-alert-text">Authentication failed: Invalid certificate, access denied</span>
                </div>
                <a id="backToLogin" class="kc-error-back-btn" href="/">Back to login</a>
            </div>
        </div>
    </div>
    <script>
        var T = {
            en: { title: 'AUTHENTICATION FAILED',       message: 'Authentication failed: Invalid certificate, access denied',               back: 'Back to login' },
            es: { title: 'AUTENTICACIÓN FALLIDA',       message: 'Error de autenticación: Certificado inválido, acceso denegado',           back: 'Volver al inicio de sesión' },
            ca: { title: 'AUTENTICACIÓ FALLIDA',        message: "Error d'autenticació: Certificat no vàlid, accés denegat",               back: "Tornar a l'inici de sessió" },
            eu: { title: 'AUTENTIFIKAZIO ERROREA',      message: 'Autentifikazio-errorea: Ziurtagiri baliogabea, sarbidea ukatuta',         back: 'Itzuli saioa hasteko orrialdera' },
            fr: { title: "ÉCHEC DE L'AUTHENTIFICATION", message: "Échec de l'authentification : Certificat invalide, accès refusé",         back: 'Retour à la connexion' },
            gl: { title: 'AUTENTICACIÓN FALLIDA',       message: 'Erro de autenticación: Certificado non válido, acceso denegado',          back: 'Volver ao inicio de sesión' },
            nl: { title: 'AUTHENTICATIE MISLUKT',       message: 'Authenticatie mislukt: Ongeldig certificaat, toegang geweigerd',          back: 'Terug naar aanmelden' },
            tl: { title: 'NABIGO ANG PAGPAPATUNAY',     message: 'Nabigo ang pagpapatunay: Hindi wastong sertipiko, tinanggihan ang access', back: 'Bumalik sa pag-login' }
        };

        (function () {
            var locale = 'en';
            // Priority order:
            // 1. KEYCLOAK_LOCALE cookie injected by nginx via sub_filter —
            //    nginx reads the cookie from the request headers (works even
            //    when the cookie is HttpOnly and invisible to JS).
            // 2. kc_locale query param — present on some Keycloak redirect URLs.
            // 3. Browser language preference via navigator.languages.
            var raw = '__KC_LOCALE__'
                   || new URLSearchParams(window.location.search).get('kc_locale');
            if (raw) {
                var l = raw.toLowerCase().split('-')[0];
                if (T[l]) { locale = l; }
            } else {
                var langs = navigator.languages || [navigator.language || 'en'];
                for (var i = 0; i < langs.length; i++) {
                    var lang = langs[i].toLowerCase().split('-')[0];
                    if (T[lang]) { locale = lang; break; }
                }
            }
            var t = T[locale];
            document.documentElement.lang = locale;
            document.title = t.title;
            document.getElementById('error-title').textContent = t.title;
            document.getElementById('error-message').textContent = t.message;
            var btn = document.getElementById('backToLogin');
            btn.textContent = t.back;
            btn.onclick = function (e) {
                if (history.length > 1) { e.preventDefault(); history.back(); }
            };
        })();
    </script>
