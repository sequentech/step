services:
  # --- Infrastructure ---
  postgres:
    image: sequentech.local/postgresql
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${HASURA_PG_PASSWORD:-password}
    ports:
      - "5432:5432"

  postgres-b3:
    image: sequentech.local/postgresql-b3
    container_name: postgres-b3
    environment:
      POSTGRES_PASSWORD: ${B3_PG_PASSWORD:-password}
    ports:
      - "5433:5432"

  rustfs:
    image: rustfs/rustfs
    container_name: rustfs
    command: server --console-address ":9001" /data
    environment:
      - RUSTFS_ROOT_USER=${AWS_S3_ROOT_USER:-admin}
      - RUSTFS_ROOT_PASSWORD=${AWS_S3_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"

  configure-minio:
    image: sequentech.local/configure-minio
    container_name: configure-minio
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${AWS_S3_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${AWS_S3_ROOT_PASSWORD:-password}
      - MINIO_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - MINIO_ACCESS_SECRET=${AWS_S3_ACCESS_SECRET}
      - MINIO_PRIVATE_URI=${AWS_S3_PRIVATE_URI:-http://rustfs:9000}
      - MINIO_PUBLIC_BUCKET=${AWS_S3_PUBLIC_BUCKET:-public}
      - MINIO_BUCKET=${AWS_S3_BUCKET:-private}
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3.12.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: sequentech.local/keycloak
    container_name: keycloak
    entrypoint: /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-password}
    depends_on:
      - postgres
    ports:
      - "8090:8090"

  hasura:
    image: hasura/graphql-engine:v2.33.1.cli-migrations-v3
    container_name: hasura
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: ${HASURA_GRAPHQL_METADATA_DATABASE_URL}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  # --- Application Services (Pre-built, No Source Needed) ---

  admin-portal:
    image: sequentech.local/admin-portal
    container_name: admin_portal
    ports:
      - "3000:80"
    env_file:
      - .env

  voting-portal:
    image: sequentech.local/voting-portal
    container_name: voting_portal
    ports:
      - "3001:80"
    env_file:
      - .env

  harvest:
    image: sequentech.local/harvest
    container_name: harvest
    depends_on:
      - postgres
    env_file:
      - .env

  windmill:
    image: sequentech.local/windmill
    container_name: windmill
    depends_on:
      - rabbitmq
    env_file:
      - .env

  b3:
    image: sequentech.local/b3
    container_name: b3
    depends_on:
      - postgres-b3
    env_file:
      - .env

