apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-setup
  namespace: gitea
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      serviceAccountName: gitea-runner-sa
      containers:
        - name: setup
          image: sequentech.local/ci-builder:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: step-secrets
                  key: GITEA_ADMIN_PASSWORD
            - name: GITEA_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: step-secrets
                  key: GITEA_REGISTRY_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Waiting for Gitea to be ready..."
              kubectl rollout status deployment/gitea -n gitea --timeout=300s

              echo "Generating runner registration token..."
              for i in $(seq 1 10); do
                TOKEN=$(kubectl exec -n gitea deploy/gitea -- su git -c "gitea actions generate-runner-token" 2>/dev/null)
                if [ -n "$TOKEN" ]; then
                  break
                fi
                echo "Retrying token generation ($i/10)..."
                sleep 5
              done

              if [ -z "$TOKEN" ]; then
                echo "Failed to generate token"
                exit 1
              fi

              echo "Registering runner with token into secret..."
              kubectl create secret generic gitea-runner-token \
                -n gitea \
                --from-literal=token="$TOKEN" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Creating step repository..."
              curl -sf -X POST "http://gitea.gitea:3000/api/v1/user/repos" \
                -u "admin:${GITEA_ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{"name": "step", "auto_init": false, "private": false}' \
                -o /dev/null || echo "Repository may already exist, continuing..."

              echo "Creating GITEA_REGISTRY_PASSWORD Actions secret..."
              curl -sf -X PUT "http://gitea.gitea:3000/api/v1/repos/admin/step/actions/secrets/GITEA_REGISTRY_PASSWORD" \
                -u "admin:${GITEA_ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "{\"data\": \"${GITEA_REGISTRY_PASSWORD}\"}"

              echo "Setup complete!"
      restartPolicy: OnFailure
  backoffLimit: 4
