---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-portal
  namespace: step-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-portal
  template:
    metadata:
      labels:
        app: voting-portal
    spec:
      imagePullSecrets:
        - name: gitea-pull-secret
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: voting-portal
          image: gitea.gitea:3000/admin/voting-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: step-env
          env:
            - name: KEYCLOAK_URL
              value: "https://portal.local"
---
apiVersion: v1
kind: Service
metadata:
  name: voting-portal
  namespace: step-apps
spec:
  selector:
    app: voting-portal
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: step-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      imagePullSecrets:
        - name: gitea-pull-secret
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: beat
          image: gitea.gitea:3000/admin/windmill:latest
          imagePullPolicy: Always
          command: ["/app/target/debug/beat", "consume", "-q", "beat"]
          envFrom:
            - configMapRef:
                name: step-env
            - secretRef:
                name: step-secrets
