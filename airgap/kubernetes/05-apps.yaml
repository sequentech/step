apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvest
  namespace: step-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harvest
  template:
    metadata:
      labels:
        app: harvest
    spec:
      imagePullSecrets:
        - name: gitea-pull-secret
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: harvest
          image: gitea.gitea:3000/admin/harvest:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: step-env
            - secretRef:
                name: step-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windmill
  namespace: step-apps
spec:
  replicas: 1
  selector:
    matchLabels:
