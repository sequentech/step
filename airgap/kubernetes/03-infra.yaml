# Persistent Volumes for Postgres/Keycloak
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: step-infra
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: sequentech.local/postgresql
          env:
            - name: POSTGRES_PASSWORD
              value: "password"
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg-data
          hostPath:
            path: /var/lib/rancher/k3s/storage/postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: step-infra
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: step-infra
spec:
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: ["server", "--console-address", ":9001", "/data"]
          env:
            - name: RUSTFS_ROOT_USER
              value: "admin"
            - name: RUSTFS_ROOT_PASSWORD
              value: "password"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage/rustfs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: step-infra
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12.11-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: step-infra
spec:
  selector:
    app: keycloak
  ports:
    - port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: sequentech.local/keycloak
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_PASSWORD
              value: "password"
          ports:
            - containerPort: 8090
