# Persistent Volumes for Postgres/Keycloak
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: step-infra
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: step-infra
data:
  00-airgap.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE keycloak;
      CREATE DATABASE hasura;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: sequentech.local/postgresql
          imagePullPolicy: Never
          env:
            - name: POSTGRES_PASSWORD
              value: "password"
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql
            - name: pg-init-script
              mountPath: /docker-entrypoint-initdb.d/00-airgap.sh
              subPath: 00-airgap.sh
      volumes:
        - name: pg-data
          hostPath:
            path: /var/lib/rancher/k3s/storage/postgres
            type: DirectoryOrCreate
        - name: pg-init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: step-infra
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: step-infra
spec:
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: fix-permissions
          image: debian:bookworm
          command: ["sh", "-c", "chmod 777 /data"]
          volumeMounts:
            - name: storage
              mountPath: /data
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: ["server", "--console-address", ":9001", "/data"]
          env:
            - name: RUSTFS_ROOT_USER
              value: "admin"
            - name: RUSTFS_ROOT_PASSWORD
              value: "password"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage/rustfs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: step-infra
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12.11-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: step-infra
spec:
  selector:
    app: keycloak
  ports:
    - port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: step-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: keycloak
          image: sequentech.local/keycloak
          imagePullPolicy: Never
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_DB_PASSWORD
              value: "password"
          ports:
            - containerPort: 8090
