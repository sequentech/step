apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner-sa
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter
  namespace: step-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner-restart-binding
  namespace: step-apps
subjects:
  - kind: ServiceAccount
    name: gitea-runner-sa
    namespace: gitea
roleRef:
  kind: Role
  name: deployment-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-setup-role
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-setup-binding
  namespace: gitea
subjects:
  - kind: ServiceAccount
    name: gitea-runner-sa
    namespace: gitea
roleRef:
  kind: Role
  name: gitea-setup-role
  apiGroup: rbac.authorization.k8s.io
