apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: gitea
data:
  config.yaml: |
    runner:
      capacity: 1
      envs:
        A_TEST_ENV_NAME_1: a_test_env_value_1
    container:
      workdir_parent: /workspace
      # Use a local custom image that includes kubectl
      image: sequentech.local/runner-ubuntu:22.04
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      serviceAccountName: gitea-runner-sa
      initContainers:
        - name: wait-for-token
          image: sequentech.local/ci-builder:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until kubectl get secret gitea-runner-token -n gitea; do echo waiting for secret; sleep 5; done"
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: runner
          image: gitea/act_runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea.gitea:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: CONFIG_FILE
              value: /config/config.yaml
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: config-volume
              mountPath: /config
            - name: dind-socket
              mountPath: /var/run
        - name: dind
          image: docker:24-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          command: ["sh", "-c", "dockerd-entrypoint.sh dockerd --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock --insecure-registry gitea.gitea:3000 --default-address-pool base=10.200.0.0/16,size=24 & until docker info >/dev/null 2>&1; do echo 'Waiting for docker...'; sleep 2; done; if [ -d /images ]; then for f in /images/*.tar; do if [ -f \"$f\" ]; then echo \"Loading $f...\"; docker load -i \"$f\"; fi; done; fi; wait"]
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: image-cache
              mountPath: /images
              readOnly: true
            - name: dind-socket
              mountPath: /var/run
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: runner-data-pvc
        - name: docker-storage
          persistentVolumeClaim:
            claimName: docker-storage-pvc
        - name: image-cache
          hostPath:
            path: /var/lib/rancher/k3s/agent/images
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: runner-config
        - name: dind-socket
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-data-pvc
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-storage-pvc
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
