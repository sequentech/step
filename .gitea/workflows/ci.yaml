name: Build and Deploy (Airgap)
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-22.04 # Locked to specific version
    permissions:
      packages: write
      contents: read
    steps:
      - name: Verify Tools
        run: |
          kubectl version --client
          docker version

      - name: Check out repository
        run: |
          git clone "http://oauth2:${{ secrets.GITHUB_TOKEN }}@gitea.gitea:3000/admin/step.git" .
          git checkout "${{ github.sha }}"

      - name: Login to Local Gitea Registry
        run: echo "admin123" | docker login http://gitea.gitea:3000 -u "admin" --password-stdin

      - name: Build and Push Harvest
        run: |
          docker build -f ./packages/harvest/Dockerfile.airgap -t gitea.gitea:3000/admin/harvest:latest ./packages
          docker push gitea.gitea:3000/admin/harvest:latest

      - name: Build and Push Windmill
        run: |
          docker build -f ./packages/windmill/Dockerfile.airgap -t gitea.gitea:3000/admin/windmill:latest ./packages
          docker push gitea.gitea:3000/admin/windmill:latest

      - name: Build and Push Admin Portal
        run: |
          docker build -f ./packages/Dockerfile.airgap --build-arg SPA_NAME=admin-portal -t gitea.gitea:3000/admin/admin-portal:latest ./packages
          docker push gitea.gitea:3000/admin/admin-portal:latest

      - name: Build and Push Hasura
        run: |
          docker build -f ./hasura/Dockerfile -t gitea.gitea:3000/admin/hasura:latest ./hasura
          docker push gitea.gitea:3000/admin/hasura:latest

      - name: Rollout Update
        run: |
          kubectl rollout restart deployment/harvest deployment/windmill deployment/admin-portal deployment/hasura -n step-apps
