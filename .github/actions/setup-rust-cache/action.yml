name: Restore Rust compiler units
description: Optional bounded compiler cache; every caller still runs Cargo
inputs:
  epoch:
    description: Explicit cache reset version, supplied by the calling workflow
    default: v1
  name:
    description: Stable compilation group
    required: true
  target-dir:
    description: Checkout-relative Cargo output directory
    required: true
  lockfile:
    description: Actual workspace lockfile
    required: true
  profile:
    description: Cargo profiles compiled by the job
    default: dev
  features:
    description: Cargo feature sets compiled by the job
    default: default
  targets:
    description: Compilation targets, including host when applicable
    default: host
runs:
  using: composite
  steps:
    - name: Fingerprint compiler compatibility
      id: identity
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_NAME: ${{ inputs.name }}
        CACHE_LOCKFILE: ${{ inputs.lockfile }}
        CACHE_TARGET_DIR: ${{ inputs.target-dir }}
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_FEATURES: ${{ inputs.features }}
        CACHE_TARGETS: ${{ inputs.targets }}
        CACHE_EPOCH: ${{ inputs.epoch }}
      run: |
        python3 -m scripts.dev.rust_cache --name "$CACHE_NAME" --lockfile "$CACHE_LOCKFILE" \
          --target-dir "$CACHE_TARGET_DIR" --profile "$CACHE_PROFILE" --features "$CACHE_FEATURES" \
          --targets "$CACHE_TARGETS" --epoch "$CACHE_EPOCH" --github-output "$GITHUB_OUTPUT"
    - name: Select isolated cache and output directories
      shell: bash
      env:
        TARGET_DIR: ${{ steps.identity.outputs.target-dir }}
      run: |
        echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
        echo "SCCACHE_DIR=$RUNNER_TEMP/step-sccache" >> "$GITHUB_ENV"
        echo 'SCCACHE_CACHE_SIZE=512M' >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_ENABLED=false' >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
    - name: Restore compiler units (read only)
      if: github.event_name != 'push' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/'))
      id: compiler-read
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/step-sccache
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore-prefix }}
    - name: Restore and save compiler units (trusted push)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/'))
      id: compiler-write
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/step-sccache
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore-prefix }}
    - name: Restore Cargo downloads (read only)
      if: github.event_name != 'push' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/'))
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Restore and save Cargo downloads (trusted push)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/'))
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Install compiler cache
      id: sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
    - name: Enable compiler cache
      if: steps.sccache.outcome == 'success'
      shell: bash
      run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
    - name: Explain compiler reuse
      shell: bash
      env:
        CACHE_KEY: ${{ steps.identity.outputs.key }}
        CACHE_HIT: ${{ steps.compiler-read.outputs.cache-hit || steps.compiler-write.outputs.cache-hit || 'false' }}
        CACHE_SETUP: ${{ steps.sccache.outcome }}
      run: |
        {
          echo '### Rust compiler cache'
          echo "Key: \`$CACHE_KEY\`"
          echo "Exact snapshot: $CACHE_HIT; sccache setup: $CACHE_SETUP; limit: 512 MiB per compilation group."
          echo 'Cargo still builds and tests the current source. Compiler hits/misses appear in the sccache post-step.'
          echo 'Only trusted branch pushes save snapshots; PRs and manual runs only restore. A missing cache compiles normally.'
        } >> "$GITHUB_STEP_SUMMARY"
