name: Restore Rust downloads
description: Select the Cargo output directory and restore Cargo downloads; every caller still runs Cargo
inputs:
  epoch:
    description: Explicit cache reset version, supplied by the calling workflow
    default: v1
  name:
    description: Stable compilation group
    required: true
  target-dir:
    description: Checkout-relative Cargo output directory
    required: true
  lockfile:
    description: Actual workspace lockfile
    required: true
  profile:
    description: Cargo profiles compiled by the job
    default: dev
  features:
    description: Cargo feature sets compiled by the job
    default: default
  targets:
    description: Compilation targets, including host when applicable
    default: host
runs:
  using: composite
  steps:
    - name: Fingerprint compiler compatibility
      id: identity
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_NAME: ${{ inputs.name }}
        CACHE_LOCKFILE: ${{ inputs.lockfile }}
        CACHE_TARGET_DIR: ${{ inputs.target-dir }}
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_FEATURES: ${{ inputs.features }}
        CACHE_TARGETS: ${{ inputs.targets }}
        CACHE_EPOCH: ${{ inputs.epoch }}
      run: |
        python3 -m scripts.dev.rust_cache --name "$CACHE_NAME" --lockfile "$CACHE_LOCKFILE" \
          --target-dir "$CACHE_TARGET_DIR" --profile "$CACHE_PROFILE" --features "$CACHE_FEATURES" \
          --targets "$CACHE_TARGETS" --epoch "$CACHE_EPOCH" --github-output "$GITHUB_OUTPUT"
    - name: Select the output directory
      shell: bash
      env:
        TARGET_DIR: ${{ steps.identity.outputs.target-dir }}
      run: |
        echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
    - name: Restore Cargo downloads (read only)
      if: github.event_name != 'pull_request' && (github.event_name != 'push' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/')))
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Restore and save Cargo downloads (PR or trusted push)
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/')))
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Explain the download cache
      shell: bash
      env:
        REGISTRY_KEY: ${{ steps.identity.outputs.registry-key }}
      run: |
        {
          echo '### Rust caches'
          echo "Cargo downloads: \`$REGISTRY_KEY\`."
          echo 'Compiled units are not cached: the bounded sccache store hit under 1% of Rust compilations (sequentech/meta#14622).'
        } >> "$GITHUB_STEP_SUMMARY"
