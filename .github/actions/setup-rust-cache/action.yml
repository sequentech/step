name: Restore Rust downloads
description: Select the Cargo output directory, restore Cargo downloads, and use the shared GCS compiler cache when configured; every caller still runs Cargo
inputs:
  epoch:
    description: Explicit cache reset version, supplied by the calling workflow
    default: v1
  name:
    description: Stable compilation group
    required: true
  target-dir:
    description: Checkout-relative Cargo output directory
    required: true
  lockfile:
    description: Actual workspace lockfile
    required: true
  profile:
    description: Cargo profiles compiled by the job
    default: dev
  features:
    description: Cargo feature sets compiled by the job
    default: default
  targets:
    description: Compilation targets, including host when applicable
    default: host
  compile-cache:
    description: >-
      The STEP_COMPILE_CACHE repository variable, a JSON object with bucket, provider,
      reader and writer. Empty leaves compiled units uncached.
    default: ''
runs:
  using: composite
  steps:
    - name: Fingerprint compiler compatibility
      id: identity
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_NAME: ${{ inputs.name }}
        CACHE_LOCKFILE: ${{ inputs.lockfile }}
        CACHE_TARGET_DIR: ${{ inputs.target-dir }}
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_FEATURES: ${{ inputs.features }}
        CACHE_TARGETS: ${{ inputs.targets }}
        CACHE_EPOCH: ${{ inputs.epoch }}
      run: |
        python3 -m scripts.dev.rust_cache --name "$CACHE_NAME" --lockfile "$CACHE_LOCKFILE" \
          --target-dir "$CACHE_TARGET_DIR" --profile "$CACHE_PROFILE" --features "$CACHE_FEATURES" \
          --targets "$CACHE_TARGETS" --epoch "$CACHE_EPOCH" --github-output "$GITHUB_OUTPUT"
    - name: Select the output directory
      shell: bash
      env:
        TARGET_DIR: ${{ steps.identity.outputs.target-dir }}
      run: |
        echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
    # Compiled units go to a GCS bucket that only main, ovcs and release pushes
    # write; every other run reads it. The identities come from GitHub OIDC
    # through Workload Identity Federation (gitops iac/catalog/gcp/ci-compile-cache).
    - name: Choose the compiler cache access
      id: compile-cache
      if: inputs.compile-cache != ''
      shell: bash
      env:
        CONFIG: ${{ inputs.compile-cache }}
        TRUSTED_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/')) }}
      run: |
        # Fork PRs and jobs without id-token: write get no OIDC token.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo 'Compiled units: no OIDC token in this job, so the shared cache is off.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$TRUSTED_PUSH" = true ]; then role=writer mode=READ_WRITE; else role=reader mode=READ_ONLY; fi
        if ! bucket=$(jq -er .bucket <<<"$CONFIG") || ! provider=$(jq -er .provider <<<"$CONFIG") \
          || ! account=$(jq -er --arg role "$role" '.[$role]' <<<"$CONFIG"); then
          echo "::warning::STEP_COMPILE_CACHE needs bucket, provider, reader and writer; the shared compiler cache is off."
          exit 0
        fi
        {
          echo 'enabled=true'
          echo "bucket=$bucket"
          echo "provider=$provider"
          echo "service-account=$account"
          echo "mode=$mode"
        } >> "$GITHUB_OUTPUT"
    - name: Authenticate to the compiler cache
      id: gcp
      if: steps.compile-cache.outputs.enabled == 'true'
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ steps.compile-cache.outputs.provider }}
        service_account: ${{ steps.compile-cache.outputs.service-account }}
        create_credentials_file: true
        # Only sccache gets the credentials; tests must not pick them up.
        export_environment_variables: false
    - name: Install sccache
      id: install-sccache
      if: steps.gcp.outcome == 'success'
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
    - name: Use the shared compiler cache
      if: steps.install-sccache.outcome == 'success'
      shell: bash
      env:
        SCCACHE_GCS_BUCKET: ${{ steps.compile-cache.outputs.bucket }}
        SCCACHE_GCS_KEY_PATH: ${{ steps.gcp.outputs.credentials_file_path }}
        SCCACHE_GCS_RW_MODE: ${{ steps.compile-cache.outputs.mode }}
        SCCACHE_GCS_KEY_PREFIX: step
        SCCACHE_IDLE_TIMEOUT: '0'
      run: |
        # A cache that can't start must not fail the build: Cargo then compiles without it.
        if sccache --start-server && sccache --show-stats >/dev/null; then
          {
            for name in SCCACHE_GCS_BUCKET SCCACHE_GCS_KEY_PATH SCCACHE_GCS_RW_MODE SCCACHE_GCS_KEY_PREFIX SCCACHE_IDLE_TIMEOUT; do
              echo "$name=${!name}"
            done
            echo 'RUSTC_WRAPPER=sccache'
          } >> "$GITHUB_ENV"
          echo "Compiled units: shared GCS cache \`$SCCACHE_GCS_BUCKET\`, $SCCACHE_GCS_RW_MODE. sccache reports hits when the job ends." >> "$GITHUB_STEP_SUMMARY"
        else
          sccache --stop-server || true
          echo '::warning::sccache could not reach the GCS compiler cache; compiling without it.'
        fi
    - name: Restore Cargo downloads (read only)
      if: github.event_name != 'pull_request' && (github.event_name != 'push' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/')))
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Restore and save Cargo downloads (PR or trusted push)
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ovcs' || startsWith(github.ref, 'refs/heads/release/')))
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.identity.outputs.registry-key }}
        restore-keys: ${{ steps.identity.outputs.registry-prefix }}
    - name: Explain the download cache
      shell: bash
      env:
        REGISTRY_KEY: ${{ steps.identity.outputs.registry-key }}
      run: |
        {
          echo '### Rust caches'
          echo "Cargo downloads: \`$REGISTRY_KEY\`."
          if [ -z "${RUSTC_WRAPPER:-}" ]; then
            echo 'Compiled units are not cached in this job (sequentech/meta#14622).'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
