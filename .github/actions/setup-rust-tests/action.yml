name: Set up Rust tests
description: Install the Rust toolchain, restore Cargo caches, and install native test dependencies

inputs:
  cache-epoch:
    description: Explicit compiler-cache reset version
    default: v1
  cargo-build-name:
    description: Stable name used to isolate the Cargo build cache
    required: true
  cargo-build-path:
    description: Checkout-relative Cargo output directory (exported as CARGO_TARGET_DIR)
    required: true
  cargo-lock-path:
    description: Cargo lockfile used to invalidate the package build cache
    required: true
  components:
    description: Toolchain components to install (comma-separated)
    required: false
    default: rustfmt, clippy
  targets:
    description: Extra compilation targets to install (comma-separated)
    required: false
    default: x86_64-unknown-linux-musl

  profile:
    description: Cargo profiles compiled by the job
    default: dev
  features:
    description: Cargo feature sets compiled by the job
    default: default
  compile-cache:
    description: The STEP_COMPILE_CACHE repository variable; empty leaves compiled units uncached
    default: ''

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: 1.96.0
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Restore compatible compiler units
      uses: ./.github/actions/setup-rust-cache
      with:
        epoch: ${{ inputs.cache-epoch }}
        name: ${{ inputs.cargo-build-name }}
        target-dir: ${{ inputs.cargo-build-path }}
        lockfile: ${{ inputs.cargo-lock-path }}
        profile: ${{ inputs.profile }}
        features: ${{ inputs.features }}
        targets: host,${{ inputs.targets }}
        compile-cache: ${{ inputs.compile-cache }}

    # Full debug info makes every test binary larger and slower to link; line
    # tables keep file and line numbers in backtraces. A job's own setting wins.
    - name: Limit test debug info to line tables
      shell: bash
      run: |
        if [ -z "${CARGO_PROFILE_DEV_DEBUG:-}" ]; then
          echo 'CARGO_PROFILE_DEV_DEBUG=line-tables-only' >> "$GITHUB_ENV"
        fi
        if [ -z "${CARGO_PROFILE_TEST_DEBUG:-}" ]; then
          echo 'CARGO_PROFILE_TEST_DEBUG=line-tables-only' >> "$GITHUB_ENV"
        fi

    # Only what the runner image lacks, usually protoc. apt waits on an
    # unresponsive mirror without limit, so each call is bounded and retried:
    # one update hung for 35 minutes (sequentech/meta#14622).
    - name: Install system dependencies
      shell: bash
      env:
        CORE_FIXTURE: ${{ inputs.cargo-build-name == 'sequent-core' }}
      run: |
        packages=(build-essential pkg-config libssl-dev protobuf-compiler libprotobuf-dev)
        # The Core database fixture.
        if [ "$CORE_FIXTURE" = true ]; then packages+=(postgresql libpq-dev); fi
        missing=()
        for package in "${packages[@]}"; do
          dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' || missing+=("$package")
        done
        [ "${#missing[@]}" -eq 0 ] && exit 0
        apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        for attempt in 1 2 3; do
          timeout 180 "${apt[@]}" update && break
          [ "$attempt" -eq 3 ] && exit 1
          echo "apt-get update did not finish (attempt $attempt); retrying"
        done
        timeout 600 "${apt[@]}" install -y "${missing[@]}"

    # Enforce the first production-module policy; test assertions are unrestricted.
    # Existing crate-wide lint debt remains tracked in meta #11566.
    - name: Check Sequent Core assurance lints
      if: inputs.cargo-build-name == 'sequent-core'
      shell: bash
      working-directory: packages
      env:
        CARGO_BUILD_JOBS: '2'
      run: cargo clippy --locked --no-deps --lib -p sequent-core --features default_features,keycloak

    - name: Install the local PDF test browser
      if: inputs.cargo-build-name == 'velvet'
      uses: ./.github/actions/setup-test-browser

    - name: Bound PDF test concurrency
      if: inputs.cargo-build-name == 'velvet'
      shell: bash
      run: |
        echo 'RUST_TEST_THREADS=2' >> "$GITHUB_ENV"
        echo 'RAYON_NUM_THREADS=2' >> "$GITHUB_ENV"
        echo 'DOC_RENDERER_BACKEND=inplace' >> "$GITHUB_ENV"
