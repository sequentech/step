#
# Posts a Slack alert when a policy label lands on a pull request, or when the
# Architects team is pulled in as a reviewer.
#
# CodeRabbit applies the labels and requests the reviews (see `.coderabbit.yaml`);
# both are ordinary GitHub events, so this file needs no integration of its own.
# CodeRabbit's built-in Slack support is org-level UI configuration and notifies
# on reviews generally — this fires only when a specific policy was breached, and
# says which one.
#
# To add an alert for a new policy: add a case below. To make a policy silent,
# leave it out — it still gets labelled, it just does not page anyone.
#
# WHERE THIS POSTS. `SLACK_WEBHOOK_URL` is a shared organisation secret pointing
# at #deployments-internal-production. That channel carries every deployment
# notification, so a policy alert lands among dozens of routine messages — and a
# rule that is never read is a rule that is not enforced.
#
# Set `POLICY_SLACK_WEBHOOK_URL` on the repository (or the organisation) to route
# these somewhere the Architects actually watch. It takes precedence when set;
# the shared webhook remains the fallback, so nothing breaks until you do.

name: Policy alert

on:
  pull_request:
    types: [labeled, review_requested]

  # Manual escape hatch. Nothing here reaches Slack until a policy is actually
  # breached, which makes "is the webhook configured for this repository?"
  # unanswerable without waiting for a real violation. Dispatching this sends
  # one test message and answers it.
  #
  # Only `step` carries a repository-level SLACK_WEBHOOK_URL; `gitops` resolves
  # an organisation secret. Whether that secret's repository selection covers
  # `beyond` is unverified — dispatch this there to find out.
  workflow_dispatch:
    inputs:
      label:
        description: "Policy label to simulate (e.g. policy:repo-scope)"
        required: true
        default: "policy:governance"

permissions: {}

jobs:
  notify:
    name: Notify Slack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.label.name, 'policy:') ||
      github.event.requested_team.slug == 'architects'
    runs-on: ubuntu-24.04
    steps:
      # Label names and team slugs come from GitHub and reach the script through
      # env, never interpolated into the shell.
      - name: Compose the alert
        id: alert
        env:
          LABEL: ${{ inputs.label || github.event.label.name }}
          TEAM: ${{ github.event.requested_team.slug }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          case "${LABEL:-team:${TEAM}}" in
            policy:repo-scope)
              icon=":rotating_light:"
              what="Repository scope — a change adds a dependency on something not publicly available"
              policy=".github/policies/10-repository-scope.md"
              ;;
            policy:architecture-change)
              icon=":building_construction:"
              what="An architectural decision changed, or the change contradicts the architecture document"
              policy=".github/policies/60-architectural-changes.md"
              ;;
            policy:secrets)
              icon=":rotating_light:"
              what="Possible credential or per-deployment configuration committed"
              policy=".github/policies/20-secrets-and-environment-config.md"
              ;;
            policy:governance)
              icon=":lock:"
              what="The policy system itself was changed"
              policy=".github/policies/50-governance.md"
              ;;
            policy:coverage)
              icon=":mag:"
              what="New code or documentation with no CI job covering it"
              policy=".github/policies/40-changes-must-be-checked.md"
              ;;
            team:architects)
              icon=":eyes:"
              what="Architect review requested"
              policy=""
              ;;
            *)
              # Labelled, deliberately silent.
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "icon=${icon}" >> "$GITHUB_OUTPUT"
          echo "what=${what}" >> "$GITHUB_OUTPUT"
          echo "policy=${policy}" >> "$GITHUB_OUTPUT"

          # A dispatch run has no pull request. Fall back to the run itself so
          # the test message is not three blank fields.
          if [ -n "${PR_URL}" ]; then
            echo "where=<${PR_URL}|#${PR_NUM}>" >> "$GITHUB_OUTPUT"
            echo "who=${PR_AUTHOR}" >> "$GITHUB_OUTPUT"
          else
            echo "where=<${RUN_URL}|manual test>" >> "$GITHUB_OUTPUT"
            echo "who=${ACTOR}" >> "$GITHUB_OUTPUT"
          fi

      # A missing webhook must not fail the check. This job runs on pull
      # requests, and `secrets` are not available to one raised from a fork —
      # an unset webhook would otherwise put a red X on an outside contributor's
      # pull request for a Slack message nobody was owed. Degrade to silent, and
      # say so in the log.
      - name: Check the webhook is configured
        id: webhook
        if: steps.alert.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.POLICY_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL is not set — policy alert not sent." \
              "The label is still on the pull request; only the Slack message is missing."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack notification
        if: steps.alert.outputs.skip != 'true' && steps.webhook.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.alert.outputs.icon }} *Policy review* — `${{ github.repository }}`\n${{ steps.alert.outputs.what }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Pull request:*\n${{ steps.alert.outputs.where }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ steps.alert.outputs.who }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Policy:*\n`${{ steps.alert.outputs.policy }}`"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.POLICY_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
