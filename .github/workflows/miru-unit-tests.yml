name: Miru component contracts
on:
  pull_request:
    paths: ['packages/**', '.github/workflows/miru-unit-tests.yml']
  push:
    branches: [main]
    paths: ['packages/**', '.github/workflows/miru-unit-tests.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: miru-component
          cargo-build-path: packages/target
          cargo-lock-path: packages/Cargo.lock
          targets: wasm32-wasip2
      - name: Install the pinned WASI C toolchain
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz
          echo "b7d4d944c88503e4f21d84af07ac293e3440b1b6210bfd7fe78e0afd92c23bc2  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-27.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build and exercise the real component
        working-directory: packages
        run: |
          export PATH="$WASI_SDK_PATH/bin:$PATH"
          export CC_wasm32_wasip2="$WASI_SDK_PATH/bin/clang"
          export AR_wasm32_wasip2="$WASI_SDK_PATH/bin/llvm-ar"
          export CFLAGS_wasm32_wasip2="--sysroot=$WASI_SDK_PATH/share/wasi-sysroot"
          cargo build --locked --release -p miru --target wasm32-wasip2
          export MIRU_TEST_COMPONENT="$PWD/target/wasm32-wasip2/release/miru.wasm"
          cargo test --locked -p miru --test component_contracts
          cargo clippy --locked -p miru --lib
