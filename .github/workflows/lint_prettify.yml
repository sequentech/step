name: Lint & Prettify

on:
  pull_request:
  push:
      branches: [ 'main', 'release/[0-9]+.[0-9]+', 'feat/use-arc-runner-java-test' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-prettify:
    name: Check frontend linting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The dependency cache the frontend test jobs share.
      - uses: ./.github/actions/setup-frontend

      # Lint resolves ui-core's and ui-essentials' built types.
      - name: Build ui-core
        run: yarn --cwd packages build:ui-core

      - name: Build ui-essentials
        run: yarn --cwd packages build:ui-essentials

      # ui-essentials' Jest suite runs in tests.yml; results-portal's runs only here.
      - name: Test results portal
        run: yarn --cwd packages test:results-portal

      - name: Lint
        run: yarn --cwd packages lint

      - name: Prettify
        run: yarn --cwd packages prettify

  lint-prettify-hasura:
    name: Check Hasura prettify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install
          dir: hasura/

      - name: Prettify
        uses: borales/actions-yarn@v4
        with:
          cmd: prettify
          dir: hasura/

      - name: Test metadata permissions
        uses: borales/actions-yarn@v4
        with:
          cmd: test
          dir: hasura/

  rust-fmt:
    name: Check Rust format 
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Check Rust code formatting
        run: cd packages/ && cargo fmt -- --check
  
  java-spotless:
    name: Check Java format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'adopt'

      # The runner image ships Maven. The modules' own build is not needed:
      # spotless:check reads sources only, and a reactor run resolves sibling
      # modules without installing them first (sequentech/meta#14622).
      - name: Run Spotless Check
        working-directory: packages/keycloak-extensions
        run: >-
          mvn -B -pl aws-ses-email-sender-provider,conditional-authenticators,ivr-config-provider,dummy-email-sender-provider,voter-enrollment,action-token-login-bridge,message-otp-authenticator,scanovate-authenticator
          com.diffplug.spotless:spotless-maven-plugin:check
