name: Lint & Prettify

on:
  pull_request:
  push:
      branches: [ 'main', 'release/[0-9]+.[0-9]+', 'feat/use-arc-runner-java-test' ]

jobs:
  lint-prettify:
    name: Check frontend linting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install
          dir: packages/

      - name: Build ui-core
        uses: borales/actions-yarn@v4
        with:
          cmd: build:ui-core
          dir: packages/
      
      - name: Build ui-essentials
        uses: borales/actions-yarn@v4
        with:
          cmd: build:ui-essentials
          dir: packages/

      - name: Test ui-essentials
        uses: borales/actions-yarn@v4
        with:
          cmd: test:ui-essentials
          dir: packages/

      - name: Test results portal
        uses: borales/actions-yarn@v4
        with:
          cmd: test:results-portal
          dir: packages/

      - name: Lint
        uses: borales/actions-yarn@v4
        with:
          cmd: lint
          dir: packages/

      - name: Prettify
        uses: borales/actions-yarn@v4
        with:
          cmd: prettify
          dir: packages/

  lint-prettify-hasura:
    name: Check Hasura prettify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install
          dir: hasura/

      - name: Prettify
        uses: borales/actions-yarn@v4
        with:
          cmd: prettify
          dir: hasura/

  rust-fmt:
    name: Check Rust format 
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Check Rust code formatting
        run: cd packages/ && cargo fmt -- --check
  
  java-spotless:
    name: Check Java format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Run Spotless Check
        run: cd packages/keycloak-extensions && mvn clean install &&mvn invoker:run@run-spotless-check

  policy-review-lint:
    name: Check policy review engine format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        working-directory: .github/policy-review
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --disable-pip-version-check \
            -r requirements-dev.txt

      # Scoped to the engine directory by its own pyproject.toml. There is no
      # Python linting elsewhere in this repository; anyone extending it further
      # can lift that configuration outwards.
      - name: Lint
        working-directory: .github/policy-review
        run: ruff check .

      - name: Check formatting
        working-directory: .github/policy-review
        run: ruff format --check .
