name: Documentation Preview
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - '.github/workflows/documentation.yml'
      - 'docs/docusaurus/**'
      - 'docs/api/graphql/**'
      - 'packages/graphql.schema.json'
    branches:
      - main
      - release/*
      - feat/use-arc-runner-java-test
      # Integration branch that combines programme stacks before main.
      - ovcs
      # Stacked meta-ticket PRs target the previous PR's branch.
      - 'feat/meta-*/**'

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          
      - name: Set BASE_URL and Build Docusaurus Preview
        id: build_docusaurus
        working-directory: ./docs/docusaurus
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            URL_PATH="/docusaurus/pr-preview/pr-$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")"
          elif [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$GITHUB_REF_NAME" == "main" ]; then
            URL_PATH="/docusaurus/main"
          elif [ "$GITHUB_EVENT_NAME" == "push" ] && [[ "$GITHUB_REF_NAME" == release/* ]]; then
            URL_PATH="/docusaurus/release-preview/$GITHUB_REF_NAME"
          fi
          echo "BASE_URL=$URL_PATH" >> "$GITHUB_ENV"
          export BASE_URL=$URL_PATH
          yarn install --frozen-lockfile
          yarn build

      - name: Spectaql | GraphQL Documentation
        working-directory: ./docs/api/graphql
        run: |
          yarn install --frozen-lockfile
          yarn generate-full-docs
          ls -lah docs/
          cp -r docs ../../docusaurus/build/graphql

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Publish (PR)
        uses: rossjrw/pr-preview-action@v1
        if: github.event_name == 'pull_request'
        with:
          pages-base-url: docs.sequentech.io
          source-dir: ./docs/docusaurus/build/
          preview-branch: doc-previews
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/main
            docusaurus/release-preview/*
          umbrella-dir: docusaurus/pr-preview

      - name: Publish (main)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          folder: ./docs/docusaurus/build/
          branch: doc-previews
          target-folder: docusaurus/main
          commit-message: "Deploy preview for ${{ github.ref_name }}"
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/pr-preview/*
            docusaurus/release-preview/*

      - name: Publish (release)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        with:
          folder: ./docs/docusaurus/build/
          branch: doc-previews
          target-folder: "docusaurus/release-preview/${{ github.ref_name }}"
          commit-message: "Deploy preview for ${{ github.ref_name }}"
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/main
            docusaurus/pr-preview/*
            docusaurus/release-preview/*
