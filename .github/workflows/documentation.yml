name: Documentation Preview
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - '.github/workflows/documentation.yml'
      - 'docs/docusaurus/**'
    branches:
      - main
      - release/*

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: '>= 18.0'
      - name: Build Preview (PR)
        if: github.event_name == 'pull_request'
        working-directory: ./docs/docusaurus
        run: |
          export BASE_URL=/docusaurus/pr-preview/pr-$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          # PR previews are for reviewing pages: English only keeps them small.
          export DOCS_LOCALES=en
          yarn install --frozen-lockfile
          yarn build
      - name: Build Preview (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        working-directory: ./docs/docusaurus
        run: |
          export BASE_URL=/docusaurus/main
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          yarn install --frozen-lockfile
          yarn build
      - name: Build Preview (release)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        working-directory: ./docs/docusaurus
        run: |
          export BASE_URL=/docusaurus/${{ github.ref_name }}
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          yarn install --frozen-lockfile
          yarn build
      # The administrator manual as PDF (uses the runner's Chrome). PR previews
      # skip it, and a failure here does not stop the site from publishing.
      - name: Print the administrator manual (PDF)
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: ./docs/docusaurus
        run: yarn pdf
      - name: Publish (PR)
        uses: rossjrw/pr-preview-action@v1
        if: github.event_name == 'pull_request'
        with:
          pages-base-url: docs.sequentech.io
          source-dir: ./docs/docusaurus/build/
          preview-branch: doc-previews
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/main
            docusaurus/release-preview/*
            docusaurus/release/*
          umbrella-dir: docusaurus/pr-preview
      - name: Publish (main)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          folder: ./docs/docusaurus/build/
          branch: doc-previews
          target-folder: docusaurus/main
          commit-message: "Deploy preview for ${{ github.ref_name }}"
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/pr-preview/*
            docusaurus/release-preview/*
            docusaurus/release/*
      - name: Publish (release)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        with:
          folder: ./docs/docusaurus/build/
          branch: doc-previews
          target-folder: "docusaurus/${{ github.ref_name }}"
          commit-message: "Deploy preview for ${{ github.ref_name }}"
          token: ${{ secrets.PAT }}
          clean-exclude: |
            docusaurus/main
            docusaurus/pr-preview/*
            docusaurus/release-preview/*
            docusaurus/release/*
