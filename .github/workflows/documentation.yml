name: Documentation Preview
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/documentation.yml'
      - '.github/workflows/documentation_cleanup.yml'
      - 'scripts/docs/**'
      - 'docs/docusaurus/**'
      - 'docs/api/graphql/**'
      - 'packages/graphql.schema.json'
    branches:
      - main
      - release/*
      - feat/use-arc-runner-java-test

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize all output writers, including the independent cleanup workflow.
concurrency:
  group: documentation-pages-output
  cancel-in-progress: false

jobs:
  retention-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/docs -p 'test_*.py' -v

  build:
    needs: retention-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          
      - name: Set BASE_URL and Build Docusaurus Preview
        id: build_docusaurus
        working-directory: ./docs/docusaurus
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            URL_PATH="/docusaurus/pr-preview/pr-$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_name }}" == "main" ]; then
            URL_PATH="/docusaurus/main"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref_name }}" == release/* ]]; then
            URL_PATH="/docusaurus/release-preview/${{ github.ref_name }}"
          fi
          echo "BASE_URL=$URL_PATH" >> $GITHUB_ENV
          export BASE_URL=$URL_PATH
          yarn install --frozen-lockfile
          yarn build

      - name: Spectaql | GraphQL Documentation
        working-directory: ./docs/api/graphql
        run: |
          yarn install --frozen-lockfile
          yarn generate-full-docs
          ls -lah docs/
          cp -r docs ../../docusaurus/build/graphql

      - name: Check out generated output
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: doc-previews
          path: .pages-site
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - name: Apply retention, enforce size guardrail and publish
        id: publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--source docs/docusaurus/build --target "${BASE_URL#/}")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            args+=(--active-pr "$PR_NUMBER")
          fi
          bash scripts/docs/publish.sh .pages-site "${args[@]}"

      - name: Verify actual Pages deployment and live output
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          python3 scripts/docs/verify_pages.py --repo "$GITHUB_REPOSITORY" \
            --sha "$PAGES_SHA" --site .pages-site --target "${BASE_URL#/}"
