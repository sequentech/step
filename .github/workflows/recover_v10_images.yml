name: Recover v10.0.1-rc.0 images
run-name: Recover v10.0.1-rc.0 images

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the recovered v10.0.1-rc.0 images to ECR'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: recover-v10.0.1-rc.0-images
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      max-parallel: 2
      matrix:
        include:
          - service: keycloak
            context: packages
            file: packages/Dockerfile.keycloak
            build_contexts: |
              beyond=./beyond

          - service: voting-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "voting-portal"

          - service: admin-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "admin-portal"

          - service: ballot-verifier
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "ballot-verifier"

          - service: results-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "results-portal"

          - service: harvest
            context: packages
            file: packages/harvest/Dockerfile.prod

          - service: b3
            context: packages
            file: packages/b3/Dockerfile.prod

          - service: braid
            context: packages
            file: packages/braid/Dockerfile.prod

          - service: windmill
            context: packages
            file: packages/windmill/Dockerfile.prod

          - service: immudb-init
            context: packages
            file: packages/Dockerfile.immudb-init.prod

          - service: immudb
            context: packages
            file: packages/Dockerfile.immudb

          - service: loadtesting
            context: .
            file: packages/loadtesting/Dockerfile

      fail-fast: false

    steps:
    - name: Check out existing release
      uses: actions/checkout@v4
      with:
        ref: refs/tags/v10.0.1-rc.0
        persist-credentials: false

    - name: Verify release commit
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "2c95cfb5745b0ba7aa9d35f901022572ae351f17"
        echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

    - name: Resolve beyond submodule commit
      if: matrix.service == 'keycloak'
      id: beyond
      run: echo "sha=$(git rev-parse HEAD:beyond)" >> "$GITHUB_OUTPUT"

    - name: Check out beyond submodule
      if: matrix.service == 'keycloak'
      uses: actions/checkout@v4
      with:
        repository: sequentech/beyond
        ref: ${{ steps.beyond.outputs.sha }}
        token: ${{ secrets.PAT }}
        path: beyond
        submodules: recursive
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GLOBALDOT }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GLOBALDOT }}
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push to ECR
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        push: ${{ inputs.push }}
        tags: |
          ${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:${{ env.SHORT_SHA }}
          ${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:v10.0.1-rc.0
        cache-from: type=registry,ref=${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:buildcache
        build-contexts: ${{ matrix.build_contexts }}
        build-args: |
          SPA_NAME=${{ matrix.spa_name }}
