name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to use for the images'
        required: false
        type: string
      push:
        description: 'Whether to push the images'
        required: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 13
      matrix:
        include:
          - service: keycloak
            context: packages
            file: packages/Dockerfile.keycloak
            build_contexts: |
              beyond=./beyond

          - service: voting-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "voting-portal"

          - service: admin-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "admin-portal"

          - service: ballot-verifier
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "ballot-verifier"

          - service: results-portal
            context: packages
            file: packages/Dockerfile.prod
            spa_name: "results-portal"

          - service: harvest
            context: packages
            file: packages/harvest/Dockerfile.prod

          - service: b4
            context: packages
            file: packages/b4/Dockerfile.prod

          - service: braid
            context: packages
            file: packages/braid/Dockerfile.prod

          - service: windmill
            context: packages
            file: packages/windmill/Dockerfile.prod

          - service: hasura
            # Build context is the hasura project dir (migrations/metadata live here),
            # not repo root — Dockerfile COPYs are relative to this path.
            context: hasura
            file: packages/Dockerfile.hasura

          - service: loadtesting
            context: .
            file: packages/loadtesting/Dockerfile

          # - service: mock_server
          #   context: packages/e2e/src/mock_server
          #   file: packages/e2e/src/mock_server/Dockerfile.prod

      fail-fast: false

    steps:
    - name: Check Out Repo
      uses: actions/checkout@v4

    - name: Resolve beyond submodule commit
      if: matrix.service == 'keycloak'
      id: beyond
      run: echo "sha=$(git rev-parse HEAD:beyond)" >> "$GITHUB_OUTPUT"

    - name: Check out beyond submodule
      if: matrix.service == 'keycloak'
      uses: actions/checkout@v4
      with:
        repository: sequentech/beyond
        ref: ${{ steps.beyond.outputs.sha }}
        token: ${{ secrets.PAT }}
        path: beyond
        submodules: recursive
        persist-credentials: false

    - name: Set short SHA
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GLOBALDOT }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GLOBALDOT }}
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Built to a local OCI layout and copied from there, so ECR and both Artifact
    # Registries get the same digest from one build.
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        outputs: ${{ inputs.push && format('type=oci,dest={0}/image,tar=false', runner.temp) || '' }}
        cache-from: type=registry,ref=${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:buildcache
        cache-to: type=registry,ref=${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:buildcache,mode=max
        build-contexts: ${{ matrix.build_contexts }}
        build-args: |
          SPA_NAME=${{ matrix.spa_name }}
          FEATURES=${{ matrix.features }}

    # After the build: this token lasts an hour, and a build can take several.
    - name: Authenticate to Google Cloud
      if: inputs.push
      id: gcp-auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_IMAGE_PUSH_SERVICE_ACCOUNT }}
        token_format: access_token
        create_credentials_file: false

    - name: Login to Artifact Registry (dev)
      if: inputs.push
      uses: docker/login-action@v3
      with:
        registry: europe-west4-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    - name: Login to Artifact Registry (prod)
      if: inputs.push
      uses: docker/login-action@v3
      with:
        registry: us-east1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    - name: Push to ECR and Artifact Registry
      if: inputs.push
      env:
        SERVICE: ${{ matrix.service }}
        TAGS: ${{ env.SHORT_SHA }} ${{ inputs.tag || github.run_number }}
        ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}
      run: |
        .github/scripts/push_image.sh "$RUNNER_TEMP/image" "$TAGS" \
          "docker://$ECR_REGISTRY/$SERVICE" \
          "docker://europe-west4-docker.pkg.dev/sequentech-dev/sequent/$SERVICE" \
          "docker://us-east1-docker.pkg.dev/sequent-production/sequent/$SERVICE"
