name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to use for the images'
        required: false
        type: string
      scope:
        description: 'Images to build: all, authoring, or architect'
        required: false
        type: string
        default: all
      push:
        description: 'Whether to push the images'
        required: true
        type: boolean
    secrets:
      PAT:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID_GLOBALDOT:
        required: false
      AWS_SECRET_ACCESS_KEY_GLOBALDOT:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the requested image scope
        id: select
        env:
          BUILD_SCOPE: ${{ inputs.scope }}
        run: |
          matrix=$(python3 .github/scripts/build_image_matrix.py "$BUILD_SCOPE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: plan
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

      fail-fast: false

    steps:
    - name: Check Out Repo
      uses: actions/checkout@v4

    - name: Resolve beyond submodule commit
      if: contains(fromJSON('["keycloak", "delivery-orchestrator", "election-architect"]'), matrix.service)
      id: beyond
      run: echo "sha=$(git rev-parse HEAD:beyond)" >> "$GITHUB_OUTPUT"

    - name: Check out beyond submodule
      if: contains(fromJSON('["keycloak", "delivery-orchestrator", "election-architect"]'), matrix.service)
      uses: actions/checkout@v4
      with:
        repository: sequentech/beyond
        ref: ${{ steps.beyond.outputs.sha }}
        token: ${{ secrets.PAT }}
        path: beyond
        submodules: recursive
        persist-credentials: false

    # The Architect image takes its sources and WASM from this step's
    # packages/, while its recipe says they are the step the beyond release
    # pins. Build only when the two packages/ trees are the same tree.
    - name: Check this step's packages/ is the one beyond pins
      if: matrix.service == 'election-architect'
      run: |
        pinned=$(git -C beyond rev-parse HEAD:step)
        git fetch --no-tags --depth 1 origin "$pinned"
        ours=$(git rev-parse HEAD:packages)
        theirs=$(git rev-parse "$pinned:packages")
        echo "step $GITHUB_SHA packages $ours; beyond pins step $pinned packages $theirs"
        test "$ours" = "$theirs"

    - name: Set short SHA
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV

    # The wizard's core is this step's election-config WASM. `ring` compiles C
    # for wasm32 and needs the clang the repository's Nix shell provides.
    - name: Set up Nix
      if: matrix.service == 'election-architect'
      uses: cachix/install-nix-action@v25

    - name: Build the election-config WASM
      if: matrix.service == 'election-architect'
      working-directory: packages/sequent-core
      run: nix develop --command ../../.devcontainer/scripts/rebuild-election-config-wasm.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GLOBALDOT }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GLOBALDOT }}
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Built to a local OCI layout and copied from there, so ECR and both Artifact
    # Registries get the same digest from one build.
    - name: Build
      id: image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        outputs: ${{ inputs.push && format('type=oci,dest={0}/image,tar=false', runner.temp) || '' }}
        cache-from: type=registry,ref=${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}:buildcache
        cache-to: ${{ inputs.push && format('type=registry,ref={0}/{1}:buildcache,mode=max', vars.AWS_ECR_REGISTRY_GLOBALDOT, matrix.service) || '' }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          io.sequent.beyond.revision=${{ steps.beyond.outputs.sha }}
        build-contexts: ${{ matrix.build_contexts }}
        build-args: |
          SPA_NAME=${{ matrix.spa_name }}
          FEATURES=${{ matrix.features }}
          STEP_REVISION=${{ github.sha }}

    # After the build: this token lasts an hour, and a build can take several.
    - name: Authenticate to Google Cloud
      if: inputs.push
      id: gcp-auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_IMAGE_PUSH_SERVICE_ACCOUNT }}
        token_format: access_token
        create_credentials_file: false

    - name: Login to Artifact Registry (dev)
      if: inputs.push
      uses: docker/login-action@v3
      with:
        registry: europe-west4-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    - name: Login to Artifact Registry (prod)
      if: inputs.push
      uses: docker/login-action@v3
      with:
        registry: us-east1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    # The prod registry has immutable tags, and rebuilding a commit changes its
    # digest. A short SHA tag there would stop a built commit getting a new tag.
    - name: Push to ECR and Artifact Registry
      if: inputs.push
      env:
        SERVICE: ${{ matrix.service }}
        TAG: ${{ inputs.tag || github.run_number }}
        ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}
      run: |
        ecr="docker://$ECR_REGISTRY/$SERVICE"
        dev="docker://europe-west4-docker.pkg.dev/sequentech-dev/sequent/$SERVICE"
        prod="docker://us-east1-docker.pkg.dev/sequent-production/sequent/$SERVICE"
        .github/scripts/push_image.sh "$RUNNER_TEMP/image" \
          "$ecr:$SHORT_SHA" "$ecr:$TAG" \
          "$dev:$SHORT_SHA" "$dev:$TAG" \
          --immutable "$prod:$TAG"

    - name: Record immutable image provenance
      if: inputs.push
      env:
        IMAGE: ${{ vars.AWS_ECR_REGISTRY_GLOBALDOT }}/${{ matrix.service }}
        DIGEST: ${{ steps.image.outputs.digest }}
        STEP_COMMIT: ${{ github.sha }}
        BEYOND_COMMIT: ${{ steps.beyond.outputs.sha }}
      run: |
        printf '%s\n' "Image: $IMAGE@$DIGEST" "Step: $STEP_COMMIT" "Beyond: $BEYOND_COMMIT" >> "$GITHUB_STEP_SUMMARY"
