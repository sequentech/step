name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to use for the images'
        required: false
        type: string
      push:
        description: 'Whether to push the images'
        required: true
        type: boolean
        default: false

jobs:
  # Runs before anything with credentials. Publishing is refused, not turned
  # into a dry run, outside the integration branches; a tag must be one Docker
  # tag. The inputs reach the script through env, never inline.
  preflight:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check the publish target and tag
        env:
          PUSH: ${{ inputs.push }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$PUSH" = "true" ]; then
            case "$REF" in
              refs/heads/main|refs/heads/ovcs) ;;
              *) echo "::error::push=true is allowed only from main or ovcs, not $REF"; exit 1 ;;
            esac
          fi
          if [ -n "$TAG" ]; then
            if ! printf '%s' "$TAG" | grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}' \
              || [ "$(printf '%s' "$TAG" | wc -l)" -ne 0 ]; then
              echo "::error::tag must be one Docker tag: a letter, digit or underscore, then up to 127 letters, digits, underscores, dots or dashes"
              exit 1
            fi
          fi

  build-and-push:
    needs: preflight
    uses: ./.github/workflows/reusable_build_push.yml
    secrets:
      PAT: ${{ secrets.PAT }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID_GLOBALDOT: ${{ secrets.AWS_ACCESS_KEY_ID_GLOBALDOT }}
      AWS_SECRET_ACCESS_KEY_GLOBALDOT: ${{ secrets.AWS_SECRET_ACCESS_KEY_GLOBALDOT }}
    # Forwarded as given, as publish_release.yml does. Only workflow_dispatch
    # triggers this workflow, so the former `github.event_name == 'push'`
    # condition was always false: the push input was ignored and nothing was
    # ever published. Publishing still runs in the reusable workflow's
    # `release` environment, whose protection rules apply.
    with:
      tag: ${{ inputs.tag }}
      push: ${{ inputs.push }}