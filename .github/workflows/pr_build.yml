name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to use for the images'
        required: false
        type: string
      push:
        description: 'Whether to push the images'
        required: true
        type: boolean
        default: false

jobs:
  build-and-push:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable_build_push.yml
    secrets: inherit
    with:
      push: ${{ inputs.push }}
      tag: ${{ inputs.tag }}
