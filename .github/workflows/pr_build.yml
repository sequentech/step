name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to use for the images'
        required: false
        type: string
      push:
        description: 'Whether to push the images'
        required: true
        type: boolean
        default: false

jobs:
  build-and-push:
    # meta-13833 integration branch only: build to the root-account ECR (dev-euw1
    # pulls its replica in eu-west-1) and honour the dispatch inputs.
    uses: ./.github/workflows/reusable_build_push_root.yml
    secrets: inherit
    with:
      push: ${{ inputs.push || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      tag: ${{ inputs.tag }}