name: Backend E2E journeys

on:
  pull_request:
    paths:
      - .github/workflows/backend-e2e.yml
      - .devcontainer/**
      - packages/**
      - hasura/**
      - scripts/e2e/**
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/backend-e2e.yml
      - .devcontainer/**
      - packages/**
      - hasura/**
      - scripts/e2e/**
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      COMPOSE_PARALLEL_LIMIT: "1"
      STEP_E2E_PROJECT: step-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      STEP_E2E_CARGO_TARGET: ${{ github.workspace }}/.cache/backend-e2e/target
      STEP_E2E_CARGO_HOME: ${{ github.workspace }}/.cache/backend-e2e/cargo-home
      STEP_E2E_OUTPUT_DIR: ${{ github.workspace }}/.cache/backend-e2e/run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check journey runner outcome and ownership contracts
        run: python3 -m unittest scripts.e2e.test_runner scripts.e2e.test_run_safety -v

      - name: Make room for the backend build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/backend-e2e/target
            .cache/backend-e2e/cargo-home
          key: backend-e2e-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'packages/Cargo.lock', 'packages/Dockerfile.cargo-packages', 'scripts/e2e/build.sh') }}
          restore-keys: backend-e2e-${{ runner.os }}-

      - name: Build and run the isolated backend journeys
        run: scripts/e2e/run.sh

      - name: Restore ownership for cache upload
        if: always()
        run: |
          if [[ -d .cache/backend-e2e ]]; then
            sudo chown -R "$(id -u):$(id -g)" .cache/backend-e2e
          fi

      - name: Summarize the journey results
        if: always()
        run: python3 scripts/e2e/summary.py .cache/backend-e2e/run >> "$GITHUB_STEP_SUMMARY"

      # run.sh writes the marker just before compose up: earlier failures have
      # no results, while a started run without any still fails the upload.
      - name: Upload journey results and service logs
        if: always() && hashFiles('.cache/backend-e2e/run/.compose-started') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-e2e-${{ github.run_attempt }}
          path: |
            .cache/backend-e2e/run
            !.cache/backend-e2e/run/.compose-started
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload the results summary
        if: always() && hashFiles('.cache/backend-e2e/run/summary.md') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-e2e-results-${{ github.run_attempt }}
          path: |
            .cache/backend-e2e/run/summary.md
            .cache/backend-e2e/run/journeys.json
            .cache/backend-e2e/run/bootstrap.json
          retention-days: 30
