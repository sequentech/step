name: Frontend coverage
on:
  pull_request:
    paths: ['packages/**', 'scripts/coverage/**', '.github/workflows/frontend-coverage.yml', '.github/actions/setup-test-browser/**', '.github/actions/setup-frontend/**']
  push:
    branches: [main]
    paths: ['packages/**', 'scripts/coverage/**', '.github/workflows/frontend-coverage.yml', '.github/actions/setup-test-browser/**', '.github/actions/setup-frontend/**']
permissions:
  contents: read
concurrency:
  group: frontend-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  comparison:
    name: ${{ matrix.package }} coverage — no decrease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [ui-core, voting-portal, ui-essentials, results-portal, ballot-verifier, admin-portal]
    steps:
      # The head is the workspace itself, so setup-frontend restores the same
      # dependency cache as the other frontend jobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
          persist-credentials: false
      - name: Keep the base checkout out of the head's status
        # The comparison requires a clean head checkout.
        run: echo /base/ >> .git/info/exclude
      - uses: ./.github/actions/setup-frontend
      - name: Install the base's locked dependencies
        # Most pull requests keep the dependency manifests, so the base copies
        # the head's installed tree (workspace links are relative) and reruns
        # its postinstall steps. Otherwise it installs its own versions; the
        # comparison still uses the head's locked Jest/Istanbul instrumenter.
        run: |
          # Tracked files only: the head's postinstall has already copied
          # packages (TinyMCE, with its package.json) into public/.
          inputs() {
            git -C "$1" ls-files -z -- packages/yarn.lock \
              ':(glob)packages/**/package.json' ':(glob)packages/*/rust/*.tgz' \
              | (cd "$1" && xargs -0 sha256sum)
          }
          if [ "$(inputs .)" = "$(inputs base)" ]; then
            echo 'Base dependency manifests match the head: copying its installed tree.'
            for modules in packages/node_modules packages/*/node_modules packages/keycloak-extensions/sequent-theme/node_modules; do
              if [ -d "$modules" ]; then
                cp -a "$modules" "base/$modules"
              fi
            done
            for manifest in base/packages/*/package.json; do
              if node -e 'process.exit(require(process.argv[1]).scripts?.postinstall ? 0 : 1)' "./$manifest"; then
                yarn --cwd "$(dirname "$manifest")" run postinstall
              fi
            done
          else
            echo 'Base dependency manifests differ from the head: installing them.'
            yarn --cwd base/packages install --frozen-lockfile --non-interactive
          fi
      - name: Verify the real frontend gate
        if: matrix.package == 'ui-core'
        run: node scripts/coverage/test_frontend.cjs
      - name: Install the pinned local test browser
        if: contains(fromJSON('["ui-core", "voting-portal", "ui-essentials"]'), matrix.package)
        uses: ./.github/actions/setup-test-browser
      - name: Exercise the real browser boundary
        if: contains(fromJSON('["ui-core", "voting-portal", "ui-essentials"]'), matrix.package)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          export UI_CORE_CHROME_PATH="$CHROME"
          export VOTING_PORTAL_TEST_CHROME_PATH="$CHROME"
          export UI_ESSENTIALS_TEST_CHROME_PATH="$CHROME"
          yarn --cwd "packages/$PACKAGE" test:browser
      - name: Compare all four source metrics
        env:
          PACKAGE: ${{ matrix.package }}
        run: >-
          python3 scripts/coverage/ci.py frontend "$PACKAGE"
          --base base --head . --output "$RUNNER_TEMP/coverage/frontend"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-coverage-${{ matrix.package }}
          path: ${{ runner.temp }}/coverage/frontend/
          if-no-files-found: error
          retention-days: 7
  summary:
    name: Frontend coverage summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Failed comparisons are reported too. Those jobs keep the
    # gate; this one only repeats the verdicts they recorded.
    needs: comparison
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: head
          persist-credentials: false
          sparse-checkout: scripts/coverage
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: frontend-coverage-*
          path: ${{ runner.temp }}/artifacts
      - name: Summarize every paired verdict
        id: summary
        if: always()
        # The comparison matrix: a package without a verdict is a row.
        run: |
          python3 head/scripts/coverage/summary.py "$RUNNER_TEMP/artifacts" \
            --expect ui-core voting-portal ui-essentials results-portal ballot-verifier admin-portal \
            > "$RUNNER_TEMP/frontend-coverage-summary.md"
          cat "$RUNNER_TEMP/frontend-coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.summary.outcome == 'success'
        with:
          name: frontend-coverage-summary
          path: ${{ runner.temp }}/frontend-coverage-summary.md
          if-no-files-found: error
          retention-days: 7
