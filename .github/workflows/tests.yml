name: Tests

on:
  pull_request:
  push:
    branches: [main, ovcs, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: "CI tooling: affected selection"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan against the actual PR merge base
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          VALIDATION: ${{ github.event_name == 'pull_request' && 'affected' || 'full' }}
        run: python3 -m scripts.dev.ci plan --base "$BASE" --validation "$VALIDATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-plan*.json
          retention-days: 7

  run-tests:
    name: Run Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.run-tests
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.selection).rust }}
    # Harvest's route tests create their own database on this server.
    services:
      postgres:
        image: ${{ matrix.service == 'harvest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 3322:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: ${{ matrix.service }}
          cargo-build-path: packages/target
          cargo-lock-path: packages/Cargo.lock
          profile: dev
          features: ${{ matrix.service == 'sequent-core' && 'default_features,keycloak' || 'default' }}

      - name: Run tests
        env:
          RUST_BACKTRACE: "full"
          PROTOC: "/usr/bin/protoc"
          KEYCLOAK_DB__USER: "test"
          KEYCLOAK_DB__PASSWORD: "test"
          KEYCLOAK_DB__HOST: "127.0.0.1"
          KEYCLOAK_DB__PORT: "3322"
          KEYCLOAK_DB__DBNAME: "test"
          KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
          HASURA_DB__USER: "test"
          HASURA_DB__PASSWORD: "test"
          HASURA_DB__HOST: "127.0.0.1"
          HASURA_DB__PORT: "3322"
          HASURA_DB__DBNAME: "test"
          HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
          LOW_SQL_LIMIT: "1000"
          DEFAULT_SQL_LIMIT: "20"
          DEFAULT_SQL_BATCH_SIZE: "1000"
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs || 4 }}
        run: cd packages/${{ matrix.service }} && cargo test --locked ${{ matrix.extra }}

  # Windmill has PostgreSQL-backed tests, so it uses a dedicated job with an
  # unconditional service container instead of matrix-dependent service YAML.
  run-windmill-tests:
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.run-windmill-tests
    name: Run Windmill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "full"
      PROTOC: "/usr/bin/protoc"
      KEYCLOAK_DB__USER: "test"
      KEYCLOAK_DB__PASSWORD: "test"
      KEYCLOAK_DB__HOST: "127.0.0.1"
      KEYCLOAK_DB__PORT: "3322"
      KEYCLOAK_DB__DBNAME: "test"
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
      HASURA_DB__USER: "test"
      HASURA_DB__PASSWORD: "test"
      HASURA_DB__HOST: "127.0.0.1"
      HASURA_DB__PORT: "3322"
      HASURA_DB__DBNAME: "test"
      HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
      LOW_SQL_LIMIT: "1000"
      DEFAULT_SQL_LIMIT: "20"
      DEFAULT_SQL_BATCH_SIZE: "1000"
      CARGO_BUILD_JOBS: "2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 3322:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: windmill
          cargo-build-path: packages/target
          cargo-lock-path: packages/Cargo.lock
          profile: dev
          features: default,rabbitmq-tests

      - name: Run Windmill tests
        run: cargo test
        working-directory: packages/windmill

      - name: Install the pinned audit database fixture
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/immudb" https://github.com/codenotary/immudb/releases/download/v1.9.6/immudb-v1.9.6-linux-amd64
          echo "26a26b68c02a86b3464e669710bd77fb06ccdbbaca03f481c4706c3526c2c5f8  $RUNNER_TEMP/immudb" | sha256sum --check
          chmod +x "$RUNNER_TEMP/immudb"

      - name: Audit delivery survives broker redelivery and uncertain commits
        run: cargo test --locked -p windmill --features rabbitmq-tests --test electoral_log_delivery
        working-directory: packages
        env:
          ELECTORAL_LOG_TEST_IMMUDB_BINARY: ${{ runner.temp }}/immudb

      - name: Run PostgreSQL-backed voter-channel regression
        run: >-
          cargo test
          services::cast_votes::tests::voters_by_channel_defaults_legacy_votes_and_uses_latest_valid_revote
          -- --ignored --exact
        working-directory: packages/windmill

      - name: Start the voting-flow database fixture
        id: castvote-fixture
        run: |
          url=$(scripts/voting_flow/castvote_fixture.sh)
          echo "CAST_VOTE_TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run the ignored insert_cast_vote PostgreSQL tests
        shell: bash
        run: |
          cargo test --locked -p windmill --lib services::insert_cast_vote::tests -- --ignored \
            | tee "$RUNNER_TEMP/insert-cast-vote-tests.log"
          # An empty filter also succeeds; require that the tests actually ran.
          grep --quiet --extended-regexp 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/insert-cast-vote-tests.log"
        working-directory: packages

      - name: Remove the voting-flow database fixture
        if: always() && steps.castvote-fixture.outputs.created == 'true'
        run: docker rm --force --volumes step-castvote-fixture

  run-frontend-tests:
    name: ${{ matrix.package }} focused tests
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.run-frontend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.selection).node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Run the selected package tests
        working-directory: packages/${{ matrix.package }}
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"

  tooling:
    name: "Tooling: ${{ matrix.check }}"
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.selection).python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.check == 'python:scripts-coverage'
        with:
          node-version: '22.22.0'
      - name: Run the selected tooling suite
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"

  docs:
    name: ${{ matrix.check }}
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.selection).docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - run: npm install --global yarn@1.22.22
      - name: Build the selected documentation
        working-directory: ${{ matrix.cwd }}
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"

  wasm-freshness:
    name: Committed WASM source freshness
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.wasm-freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: python3 -m scripts.dev.wasm --check-package

  frontend-ui:
    needs: plan
    if: fromJSON(needs.plan.outputs.selection).jobs.frontend-ui
    uses: ./.github/workflows/frontend-ui-tests.yml
    with:
      selection: ${{ needs.plan.outputs.selection }}

  required-feedback:
    name: Required feedback checks
    needs: [plan, run-tests, run-windmill-tests, run-frontend-tests, tooling, docs, wasm-freshness, frontend-ui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require success or an explicit selection skip
        env:
          CI_SELECTION: ${{ needs.plan.outputs.selection }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 -m scripts.dev.ci verify

  # ===========================================================================
  # JOB: notify-on-failure
  # ===========================================================================
  # Sends a Slack notification to the dev channel when the test job fails.
  # Runs on the GCP runner — it will be a fresh pod, not the one that failed.
  # ===========================================================================
  notify-on-failure:
    name: Notify on failure
    needs: [run-tests, run-windmill-tests, run-frontend-tests]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *GHA Runner Failure* — `${{ github.repository }}`"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch/PR:*\n${{ github.head_ref || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": ":warning: Possible OOM kill \u2014 runner lost communication with GitHub."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
