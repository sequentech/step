name: Tests

on:
  pull_request:
  push:
    branches: [ 'main', 'release/[0-9]+.[0-9]+' ]

# Avoid intermittent HTTP/2 framing errors while fetching crates.io dependencies.
env:
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  run-tests:
    name: Run Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          #- service: braid # these take too long!
          - service: electoral-log
          - service: trellis
          - service: harvest
          - service: strand
          - service: sequent-core
            extra: --features keycloak,default_features
          - service: step-cli
          - service: velvet
            # PDF tests launch Chrome; serialize them and bound report workers.
            extra: -- --test-threads=1
          - service: wrap-map-err

      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: ${{ matrix.service }}
          cargo-build-path: packages/${{ matrix.service }}/target
          cargo-lock-path: packages/${{ matrix.service }}/Cargo.lock

      - name: Install Chrome
        run: |
            sudo apt-get install -y wget
            wget -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./chrome.deb

      - name: Run tests
        env:
          RUST_BACKTRACE: "full"
          PROTOC: "/usr/bin/protoc"
          KEYCLOAK_DB__USER: "test"
          KEYCLOAK_DB__PASSWORD: "test"
          KEYCLOAK_DB__HOST: "127.0.0.1"
          KEYCLOAK_DB__PORT: "3322"
          KEYCLOAK_DB__DBNAME: "test"
          KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
          HASURA_DB__USER: "test"
          HASURA_DB__PASSWORD: "test"
          HASURA_DB__HOST: "127.0.0.1"
          HASURA_DB__PORT: "3322"
          HASURA_DB__DBNAME: "test"
          HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
          LOW_SQL_LIMIT: "1000"
          DEFAULT_SQL_LIMIT: "20"
          DEFAULT_SQL_BATCH_SIZE: "1000"
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs || 4 }}
          RAYON_NUM_THREADS: ${{ matrix.service == 'velvet' && '2' || '0' }}
        run: cd packages/${{ matrix.service }} && cargo test ${{ matrix.extra }}

  # Windmill has PostgreSQL-backed tests, so it uses a dedicated job with an
  # unconditional service container instead of matrix-dependent service YAML.
  run-windmill-tests:
    name: Run Windmill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "full"
      PROTOC: "/usr/bin/protoc"
      KEYCLOAK_DB__USER: "test"
      KEYCLOAK_DB__PASSWORD: "test"
      KEYCLOAK_DB__HOST: "127.0.0.1"
      KEYCLOAK_DB__PORT: "3322"
      KEYCLOAK_DB__DBNAME: "test"
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
      HASURA_DB__USER: "test"
      HASURA_DB__PASSWORD: "test"
      HASURA_DB__HOST: "127.0.0.1"
      HASURA_DB__PORT: "3322"
      HASURA_DB__DBNAME: "test"
      HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
      LOW_SQL_LIMIT: "1000"
      DEFAULT_SQL_LIMIT: "20"
      DEFAULT_SQL_BATCH_SIZE: "1000"
      CARGO_BUILD_JOBS: "2"
      ELECTORAL_LOG_TEST_DATABASE_URL: "postgresql://test:test@127.0.0.1:3322/test?sslmode=disable"
      ELECTORAL_LOG_PG_HOST: "127.0.0.1"
      ELECTORAL_LOG_PG_PORT: "3322"
      ELECTORAL_LOG_PG_USER: "test"
      ELECTORAL_LOG_PG_PASSWORD: "test"
      ELECTORAL_LOG_PG_DATABASE: "test"
      ELECTORAL_LOG_PG_SSLMODE: "disable"
      ENV_SLUG: "electoral-log-tests"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 3322:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: windmill
          cargo-build-path: packages/windmill/target
          cargo-lock-path: packages/windmill/Cargo.lock

      - name: Run Windmill tests
        run: cargo test
        working-directory: packages/windmill

      - name: Run PostgreSQL-backed voter-channel regression
        run: >-
          cargo test
          services::cast_votes::tests::voters_by_channel_defaults_legacy_votes_and_uses_latest_valid_revote
          -- --ignored --exact
        working-directory: packages/windmill

      - name: Test PostgreSQL electoral-log contract
        run: cd packages && cargo test -p electoral-log --test postgres -- --ignored --test-threads=1

      - name: Test electoral-log application wiring
        run: cd packages && cargo test -p windmill postgres_wiring_tests --lib -- --ignored --test-threads=1

  # ===========================================================================
  # JOB: run-frontend-tests
  # ===========================================================================
  # Runs the Jest frontend tests and the Node.js theme tests.
  # ===========================================================================
  run-frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - package: ui-core
            test_args: --runInBand
          - package: ui-essentials
            test_args: --runInBand
          - package: admin-portal
            test_args: --runInBand
          - package: voting-portal
            test_args: --runInBand
          - package: ballot-verifier
            test_args: --runInBand
            build_libs: true
          - package: keycloak-extensions/sequent-theme
            test_args: ''
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: packages/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline
        working-directory: packages

      # ui-core and ui-essentials are consumed through their dist/ bundles,
      # which yarn install does not produce. Suites that resolve either package
      # need them built first, mocked ones included: jest.mock() still resolves
      # the module before it swaps in the factory.
      - name: Build workspace libraries
        if: matrix.build_libs
        run: yarn build:ui-core && yarn build:ui-essentials
        working-directory: packages

      - name: Run ${{ matrix.package }} tests
        run: yarn --cwd ./${{ matrix.package }} test ${{ matrix.test_args }}
        working-directory: packages

  # ===========================================================================
  # JOB: notify-on-failure
  # ===========================================================================
  # Sends a Slack notification to the dev channel when the test job fails.
  # Runs on the GCP runner — it will be a fresh pod, not the one that failed.
  # ===========================================================================
  notify-on-failure:
    name: Notify on failure
    needs: [run-tests, run-windmill-tests, run-frontend-tests]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *GHA Runner Failure* — `${{ github.repository }}`"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch/PR:*\n${{ github.head_ref || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": ":warning: Possible OOM kill \u2014 runner lost communication with GitHub."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
