name: Tests

on:
  pull_request:
  push:
    branches: [ 'main', 'release/[0-9]+.[0-9]+' ]

jobs:
  run-tests:
    name: Run Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          #- service: braid # these take too long!
          - service: electoral-log
          - service: harvest
          - service: strand
          - service: immu-board
          - service: immudb-rs
          - service: sequent-core
            extra: --features keycloak,default_features
          - service: step-cli
          - service: velvet
          - service: wrap-map-err

      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: ${{ matrix.service }}
          cargo-build-path: packages/${{ matrix.service }}/target
          cargo-lock-path: packages/${{ matrix.service }}/Cargo.lock

      - name: Install Chrome
        run: |
            sudo apt-get install -y wget
            wget -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./chrome.deb

      - name: Check CLI automation and voter CSV contracts
        if: matrix.service == 'step-cli'
        run: |
          python3 -m unittest discover -s packages/step-cli/scripts -p 'test_*.py'
          python3 -m venv "$RUNNER_TEMP/cli-python"
          "$RUNNER_TEMP/cli-python/bin/pip" install Faker==13.3.4 "psycopg[binary]==3.3.3"
          "$RUNNER_TEMP/cli-python/bin/python" -m unittest discover -s packages/windmill/external-bin/janitor/scripts -p 'test_voter_keys.py'
          "$RUNNER_TEMP/cli-python/bin/python" -m unittest discover -s packages/voting-load -p 'test_capture.py' -k PreflightTests

      - name: Run tests
        env:
          RUST_BACKTRACE: "full"
          PROTOC: "/usr/bin/protoc"
          KEYCLOAK_DB__USER: "test"
          KEYCLOAK_DB__PASSWORD: "test"
          KEYCLOAK_DB__HOST: "127.0.0.1"
          KEYCLOAK_DB__PORT: "3322"
          KEYCLOAK_DB__DBNAME: "test"
          KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
          HASURA_DB__USER: "test"
          HASURA_DB__PASSWORD: "test"
          HASURA_DB__HOST: "127.0.0.1"
          HASURA_DB__PORT: "3322"
          HASURA_DB__DBNAME: "test"
          HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
          LOW_SQL_LIMIT: "1000"
          DEFAULT_SQL_LIMIT: "20"
          DEFAULT_SQL_BATCH_SIZE: "1000"
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs || 4 }}
        run: cd packages/${{ matrix.service }} && cargo test ${{ matrix.extra }}

  # Windmill has PostgreSQL-backed tests, so it uses a dedicated job with an
  # unconditional service container instead of matrix-dependent service YAML.
  run-windmill-tests:
    name: Run Windmill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "full"
      PROTOC: "/usr/bin/protoc"
      KEYCLOAK_DB__USER: "test"
      KEYCLOAK_DB__PASSWORD: "test"
      KEYCLOAK_DB__HOST: "127.0.0.1"
      KEYCLOAK_DB__PORT: "3322"
      KEYCLOAK_DB__DBNAME: "test"
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
      HASURA_DB__USER: "test"
      HASURA_DB__PASSWORD: "test"
      HASURA_DB__HOST: "127.0.0.1"
      HASURA_DB__PORT: "3322"
      HASURA_DB__DBNAME: "test"
      HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
      LOW_SQL_LIMIT: "1000"
      DEFAULT_SQL_LIMIT: "20"
      DEFAULT_SQL_BATCH_SIZE: "1000"
      CARGO_BUILD_JOBS: "2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 3322:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: windmill
          cargo-build-path: packages/windmill/target
          cargo-lock-path: packages/windmill/Cargo.lock

      - name: Run Windmill tests
        run: cargo test
        working-directory: packages/windmill

      - name: Install the pinned audit database fixture
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/immudb" https://github.com/codenotary/immudb/releases/download/v1.9.6/immudb-v1.9.6-linux-amd64
          echo "26a26b68c02a86b3464e669710bd77fb06ccdbbaca03f481c4706c3526c2c5f8  $RUNNER_TEMP/immudb" | sha256sum --check
          chmod +x "$RUNNER_TEMP/immudb"

      - name: Audit delivery survives broker redelivery and uncertain commits
        run: cargo test --locked -p windmill --features rabbitmq-tests --test electoral_log_delivery
        working-directory: packages
        env:
          ELECTORAL_LOG_TEST_IMMUDB_BINARY: ${{ runner.temp }}/immudb

      - name: Run PostgreSQL-backed voter-channel regression
        run: >-
          cargo test
          services::cast_votes::tests::voters_by_channel_defaults_legacy_votes_and_uses_latest_valid_revote
          -- --ignored --exact
        working-directory: packages/windmill

      - name: Start the voting-flow database fixture
        id: castvote-fixture
        run: |
          url=$(scripts/voting_flow/castvote_fixture.sh)
          echo "CAST_VOTE_TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run the ignored insert_cast_vote PostgreSQL tests
        shell: bash
        run: |
          cargo test --locked -p windmill --lib services::insert_cast_vote::tests -- --ignored \
            | tee "$RUNNER_TEMP/insert-cast-vote-tests.log"
          # An empty filter also succeeds; require that the tests actually ran.
          grep --quiet --extended-regexp 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/insert-cast-vote-tests.log"
        working-directory: packages

      - name: Remove the voting-flow database fixture
        if: always() && steps.castvote-fixture.outputs.created == 'true'
        run: docker rm --force --volumes step-castvote-fixture

  # ===========================================================================
  # JOB: run-frontend-tests
  # ===========================================================================
  # Runs the Jest frontend tests and the Node.js theme tests.
  # ===========================================================================
  run-frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - package: ui-core
            test_args: --runInBand
          - package: ui-essentials
            test_args: --runInBand
          - package: admin-portal
            test_args: --runInBand
          - package: voting-portal
            test_args: --runInBand
          - package: keycloak-extensions/sequent-theme
            test_args: ''
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: packages/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline
        working-directory: packages

      - name: Run ${{ matrix.package }} tests
        run: yarn --cwd ./${{ matrix.package }} test ${{ matrix.test_args }}
        working-directory: packages

  # ===========================================================================
  # JOB: notify-on-failure
  # ===========================================================================
  # Sends a Slack notification to the dev channel when the test job fails.
  # Runs on the GCP runner — it will be a fresh pod, not the one that failed.
  # ===========================================================================
  notify-on-failure:
    name: Notify on failure
    needs: [run-tests, run-windmill-tests, run-frontend-tests]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *GHA Runner Failure* — `${{ github.repository }}`"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch/PR:*\n${{ github.head_ref || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": ":warning: Possible OOM kill \u2014 runner lost communication with GitHub."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
