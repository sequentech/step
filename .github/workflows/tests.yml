name: Tests

on:
  pull_request:
  push:
    branches: [ 'main', 'release/[0-9]+.[0-9]+' ]

jobs:
  # sequent-core is compiled against a different feature set by nearly every
  # consumer, and a module gated one way with its re-export gated another only
  # fails for the sets nobody happens to build locally: `cargo build --workspace`
  # unifies features across the graph and hides it entirely. That is exactly how
  # an ungated `pub use build::{…}` reached CI and reddened fourteen jobs in the
  # slow suites below, each of which reports it as its own failure.
  #
  # `--lib` rather than `--all-targets`: the question is whether the library
  # compiles for a consumer that asked for this much and no more. The test
  # modules need `default_features` and are covered by the suites below.
  #
  # This job is `cargo check` only, so it finishes in a couple of minutes and
  # names the gate that broke.
  feature-gates:
    name: sequent-core at ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This job reads code and runs `cargo check`. Without a block it inherits the
    # repository default, which can include write scopes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: no features
            cache: none
            features: ""
          - gate: default_features
            cache: default
            features: --features default_features
          - gate: keycloak,default_features
            cache: keycloak
            features: --features keycloak,default_features
          - gate: election_config_templates
            cache: templates
            features: --features election_config_templates
          - gate: election_config_archive
            cache: archive
            features: --features election_config_archive
          - gate: election_config_xlsx
            cache: xlsx
            features: --features election_config_xlsx
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Or the job token stays in .git/config, readable by every later step.
          persist-credentials: false

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          # Per gate, or six jobs would evict each other's artifacts all day.
          cargo-build-name: sequent-core-${{ matrix.cache }}
          cargo-build-path: packages/target
          cargo-lock-path: packages/Cargo.lock

      - name: cargo check ${{ matrix.gate }}
        env:
          PROTOC: "/usr/bin/protoc"
        run: cargo check -p sequent-core --lib ${{ matrix.features }}
        working-directory: packages

  run-tests:
    name: Run Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          #- service: braid # these take too long!
          - service: electoral-log
          - service: harvest
          - service: strand
          - service: immu-board
          - service: immudb-rs
          - service: sequent-core
            extra: --features keycloak,default_features
          - service: step-cli
          - service: velvet
          - service: wrap-map-err

      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: ${{ matrix.service }}
          cargo-build-path: packages/${{ matrix.service }}/target
          cargo-lock-path: packages/${{ matrix.service }}/Cargo.lock

      - name: Install Chrome
        run: |
            sudo apt-get install -y wget
            wget -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./chrome.deb

      - name: Run tests
        env:
          RUST_BACKTRACE: "full"
          PROTOC: "/usr/bin/protoc"
          KEYCLOAK_DB__USER: "test"
          KEYCLOAK_DB__PASSWORD: "test"
          KEYCLOAK_DB__HOST: "127.0.0.1"
          KEYCLOAK_DB__PORT: "3322"
          KEYCLOAK_DB__DBNAME: "test"
          KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
          HASURA_DB__USER: "test"
          HASURA_DB__PASSWORD: "test"
          HASURA_DB__HOST: "127.0.0.1"
          HASURA_DB__PORT: "3322"
          HASURA_DB__DBNAME: "test"
          HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
          LOW_SQL_LIMIT: "1000"
          DEFAULT_SQL_LIMIT: "20"
          DEFAULT_SQL_BATCH_SIZE: "1000"
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs || 4 }}
        run: cd packages/${{ matrix.service }} && cargo test ${{ matrix.extra }}

  # Windmill has PostgreSQL-backed tests, so it uses a dedicated job with an
  # unconditional service container instead of matrix-dependent service YAML.
  run-windmill-tests:
    name: Run Windmill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "full"
      PROTOC: "/usr/bin/protoc"
      KEYCLOAK_DB__USER: "test"
      KEYCLOAK_DB__PASSWORD: "test"
      KEYCLOAK_DB__HOST: "127.0.0.1"
      KEYCLOAK_DB__PORT: "3322"
      KEYCLOAK_DB__DBNAME: "test"
      KEYCLOAK_DB__MANAGER__RECYCLING_METHOD: "Verified"
      HASURA_DB__USER: "test"
      HASURA_DB__PASSWORD: "test"
      HASURA_DB__HOST: "127.0.0.1"
      HASURA_DB__PORT: "3322"
      HASURA_DB__DBNAME: "test"
      HASURA_DB__MANAGER__RECYCLING_METHOD: "Verified"
      LOW_SQL_LIMIT: "1000"
      DEFAULT_SQL_LIMIT: "20"
      DEFAULT_SQL_BATCH_SIZE: "1000"
      CARGO_BUILD_JOBS: "2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 3322:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Rust tests
        uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: windmill
          cargo-build-path: packages/windmill/target
          cargo-lock-path: packages/windmill/Cargo.lock

      - name: Run Windmill tests
        run: cargo test
        working-directory: packages/windmill

      - name: Run PostgreSQL-backed voter-channel regression
        run: >-
          cargo test
          services::cast_votes::tests::voters_by_channel_defaults_legacy_votes_and_uses_latest_valid_revote
          -- --ignored --exact
        working-directory: packages/windmill

  # ===========================================================================
  # JOB: run-frontend-tests
  # ===========================================================================
  # Runs the Jest frontend tests and the Node.js theme tests.
  # ===========================================================================
  run-frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - package: ui-core
            test_args: --runInBand
          - package: ui-essentials
            test_args: --runInBand
          - package: admin-portal
            test_args: --runInBand
          - package: voting-portal
            test_args: --runInBand
          - package: keycloak-extensions/sequent-theme
            test_args: ''
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: packages/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline
        working-directory: packages

      - name: Run ${{ matrix.package }} tests
        run: yarn --cwd ./${{ matrix.package }} test ${{ matrix.test_args }}
        working-directory: packages

  # ===========================================================================
  # JOB: notify-on-failure
  # ===========================================================================
  # Sends a Slack notification to the dev channel when the test job fails.
  # Runs on the GCP runner — it will be a fresh pod, not the one that failed.
  # ===========================================================================
  notify-on-failure:
    name: Notify on failure
    needs: [run-tests, run-windmill-tests, run-frontend-tests]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *GHA Runner Failure* — `${{ github.repository }}`"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch/PR:*\n${{ github.head_ref || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": ":warning: Possible OOM kill \u2014 runner lost communication with GitHub."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
