name: Build Sequent Core WASM Target

on:
  pull_request:
  push:
    branches: [ 'main', 'feat/use-arc-runner-java-test' ]
  release:
    types: [published]

jobs:
  build_wasm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check that the workspace packages use the package built from source
        working-directory: packages
        run: |
          set -euo pipefail
          if git ls-files -- '*/rust/sequent-core-*.tgz' | grep -q .; then
            echo "A prebuilt sequent-core package is committed; packages/sequent-core is built instead."
            exit 1
          fi
          for dir in admin-portal ballot-verifier voting-portal; do
            grep -q "^\"sequent-core@file:./${dir}/rust/pkg\":" yarn.lock \
              || { echo "yarn.lock does not resolve sequent-core of ${dir} from rust/pkg"; exit 1; }
          done

      - name: Build the sequent-core WebAssembly package
        uses: ./.github/actions/build-sequent-core-wasm

      - name: Check that the package packs
        working-directory: packages/sequent-core
        run: nix develop --command wasm-pack -v pack .

      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install JS dependencies
        working-directory: packages
        run: yarn install --frozen-lockfile

      - name: Build ui-core
        working-directory: packages
        run: yarn build:ui-core

      - name: Build ui-essentials
        working-directory: packages
        run: yarn build:ui-essentials
