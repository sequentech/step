name: Package coverage

on:
  pull_request:
    paths: ['packages/**', 'rust-toolchain.toml', 'scripts/coverage/**', '.github/workflows/rust-coverage.yml']
  push:
    branches: [main]
    paths: ['packages/**', 'rust-toolchain.toml', 'scripts/coverage/**', '.github/workflows/rust-coverage.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Native profile supported by this hosted worker
        type: choice
        options: [sequent-core, strand]
        default: sequent-core
        required: true
      base_ref:
        description: Compare with this base branch or commit (select a different candidate branch above)
        type: string
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: package-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  reporter-tests:
    name: Coverage tooling — no decrease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_REF }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false
      - name: Install the Python coverage tool
        run: python3 -m pip install coverage==7.16.0 ruff==0.16.7
      - name: Check Python formatting and imports
        run: |
          ruff format --check --config head/scripts/coverage/ruff.toml head/scripts/coverage
          ruff check --config head/scripts/coverage/ruff.toml head/scripts/coverage
      - name: Test and compare both revisions
        run: >-
          python3 head/scripts/coverage/ci.py python coverage-tooling
          --base base --head head --output "$RUNNER_TEMP/coverage/tooling"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-tooling
          path: ${{ runner.temp }}/coverage/tooling/
          if-no-files-found: error
          retention-days: 7

  package-comparison:
    # Automate the first Core profile. Additional native profiles remain
    # explicit manual runs while their package-by-package rollout is reviewed.
    name: Rust package coverage — no decrease
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: reporter-tests
    env:
      COVERAGE_PROFILE: ${{ inputs.profile || 'sequent-core' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_REF }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler libprotobuf-dev
      - name: Install the repository Rust toolchain
        working-directory: head
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov 0.9.1
        run: |
          curl --fail --location --silent --show-error --output /tmp/cargo-llvm-cov.tar.gz https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tar.gz' | sha256sum --check
          tar -xzf /tmp/cargo-llvm-cov.tar.gz -C "$HOME/.cargo/bin"
      - name: Compare package coverage
        run: >-
          python3 head/scripts/coverage/ci.py rust "$COVERAGE_PROFILE"
          --base base --head head --output "$RUNNER_TEMP/coverage/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ env.COVERAGE_PROFILE }}
          path: |
            ${{ runner.temp }}/coverage/native/
            base/coverage/${{ env.COVERAGE_PROFILE }}/
            head/coverage/${{ env.COVERAGE_PROFILE }}/
          if-no-files-found: error
          retention-days: 7
