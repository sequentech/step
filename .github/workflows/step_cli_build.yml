name: Build Step CLI Binary

on:
  pull_request:
  push:
    branches: [ 'main', 'release/[0-9]+.[0-9]+' ]
  release:
    types: [published]

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: rust-local-target
      RUSTFLAGS: "-C target-feature=-crt-static -lgcc_eh -lm"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install protoc and OpenSSL dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler musl-tools libssl-dev pkg-config musl-dev libunwind-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: packages/step-cli/rust-local-target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('packages/step-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Link openssl
        working-directory: packages/step-cli
        run: sudo ln -s /usr/include/x86_64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h && sudo ln -s /usr/include/x86_64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h

      - name: Build step-cli
        working-directory: packages/step-cli
        env:
          OPENSSL_DIR: /usr
          OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
          OPENSSL_STATIC: 1
          PKG_CONFIG_ALLOW_CROSS: 1
          OPENSSL_NO_VENDOR: 0
          CARGO_BUILD_JOBS: 4
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: List build output target-rust-local (for debugging)
        working-directory: packages/step-cli
        run: ls -lR rust-local-target/x86_64-unknown-linux-musl/release

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
              name: step-cli-binary
              path: packages/step-cli/rust-local-target/x86_64-unknown-linux-musl/release/seq