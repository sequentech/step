name: Build Step CLI Binary

on:
  pull_request:
  push:
    branches: [ 'main', 'ovcs', 'release/[0-9]+.[0-9]+' ]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENSSL_DIR: /usr
      OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
      OPENSSL_STATIC: '1'
      PKG_CONFIG_ALLOW_CROSS: '1'
      OPENSSL_NO_VENDOR: '0'
      RUSTFLAGS: "-C target-feature=-crt-static -lgcc_eh -lm"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install protoc and OpenSSL dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler musl-tools libssl-dev pkg-config musl-dev libunwind-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Restore compatible compiler units
        uses: ./.github/actions/setup-rust-cache
        with:
          epoch: ${{ vars.STEP_RUST_CACHE_EPOCH || 'v1' }}
          name: step-cli
          target-dir: packages/step-cli/rust-local-target
          lockfile: packages/Cargo.lock
          profile: release
          targets: x86_64-unknown-linux-musl

      - name: Link openssl
        working-directory: packages/step-cli
        run: sudo ln -s /usr/include/x86_64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h && sudo ln -s /usr/include/x86_64-linux-gnu/openssl/configuration.h /usr/include/openssl/configuration.h

      - name: Build step-cli
        working-directory: packages/step-cli
        env:
          CARGO_BUILD_JOBS: 4
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: List build output target-rust-local (for debugging)
        working-directory: packages/step-cli
        run: ls -lR rust-local-target/x86_64-unknown-linux-musl/release

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
              name: step-cli-binary-${{ github.run_id }}
              path: packages/step-cli/rust-local-target/x86_64-unknown-linux-musl/release/seq
