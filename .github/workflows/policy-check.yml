#
# Thin caller: declares when the policy review runs for this repository and
# points it at this repository's own policy files. All the logic lives in the
# reusable workflow; this file should stay small.

name: Policy check

on:
  # `synchronize` is every new commit. Drafts are filtered out by the shared
  # workflow, so this means: every push to a pull request that is ready for
  # review, plus the moment it becomes ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review.
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  policy-review:
    name: Policy review
    uses: ./.github/workflows/policy-review.yml
    with:
      policies_path: .github/policies
      repo_type: >-
        Public open-source repository for the Sequent voting platform. It holds
        the platform's own source code and must remain self-contained: it may
        not depend on, or refer to, any repository that is not public.
      pr_number: ${{ inputs.pr_number || 0 }}
      engine_ref: ${{ github.ref_name }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
