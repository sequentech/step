name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Code coverage scope
        type: choice
        options: [none, e2e, combined]
        default: none
      contracts_only:
        description: Validate runner contracts without provisioning a stack
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      [
        packages/e2e/**,
        packages/*/test/e2e/**,
        .devcontainer/e2e/**,
        .github/workflows/e2e.yml,
        scripts/e2e,
      ]
permissions:
  contents: read
  actions: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Runner contracts
        run: PYTHONPATH=packages/e2e python3 -m unittest discover -s packages/e2e/tests_runner -v
  chromium:
    if: github.event_name == 'workflow_dispatch' && !inputs.contracts_only
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      COVERAGE: ${{ inputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for Rust and browser artifacts
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@v3
      - name: Record workflow start for total wall time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          echo "E2E_WORKFLOW_STARTED=$started" >> "$GITHUB_ENV"
      - name: Tool image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer/e2e
          file: .devcontainer/e2e/Dockerfile
          tags: step-e2e-tools:local
          load: true
          cache-from: type=gha,scope=e2e-tools
          cache-to: type=gha,scope=e2e-tools,mode=max
      - name: Authentication image
        uses: docker/build-push-action@v6
        with:
          context: packages
          file: packages/Dockerfile.keycloak
          build-contexts: beyond=./beyond
          tags: step-e2e-keycloak:local
          load: true
          cache-from: type=gha,scope=e2e-keycloak
          cache-to: type=gha,scope=e2e-keycloak,mode=max
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            .e2e/cargo
            .e2e/wasm
            .e2e/yarn-cache
          key: e2e-build-${{ runner.os }}-${{ inputs.coverage }}-${{ hashFiles('packages/Cargo.lock', 'packages/rust-toolchain*', 'packages/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-build-${{ runner.os }}-${{ inputs.coverage }}-${{ hashFiles('packages/Cargo.lock', 'packages/rust-toolchain*', 'packages/yarn.lock') }}-
      - name: Full isolated Chromium journey
        run: scripts/e2e run --run-id "$RUN_ID" --coverage "$COVERAGE"
      - name: Summarize wall time and coverage
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" ".e2e/runs/$RUN_ID" || true
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          started = os.environ.get('E2E_WORKFLOW_STARTED')
          if started:
              seconds = (datetime.now(timezone.utc) - datetime.fromisoformat(started.replace('Z', '+00:00'))).total_seconds()
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(f'Workflow wall time through reporting, including setup/build/cache: **{seconds / 60:.1f} minutes**.\n\n')
          PY
          if [ -f ".e2e/runs/$RUN_ID/report/summary.md" ]; then
            cat ".e2e/runs/$RUN_ID/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'E2E failed before a report was produced. Inspect the failed build step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ".e2e/runs/$RUN_ID/report/coverage.md" ]; then
            cat ".e2e/runs/$RUN_ID/report/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload public reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: .e2e/runs/${{ env.RUN_ID }}/report/
          retention-days: 14
          if-no-files-found: warn
      - name: Final cleanup
        if: always()
        run: |
          scripts/e2e cleanup "$RUN_ID"
          sudo chown -R "$(id -u):$(id -g)" .e2e
      - name: Preserve build cache after failures too
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .e2e/cargo
            .e2e/wasm
            .e2e/yarn-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
