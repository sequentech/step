#
# Unit tests for the policy review engine. The engine is shared infrastructure —
# other repositories call it — so a regression here is felt beyond this
# repository and the tests gate every change to it.

name: Policy review engine checks

on:
  pull_request:
    paths:
      - .github/policy-review/**
      - .github/workflows/policy-review.yml
      - .github/workflows/policy-review-tests.yml
  push:
    branches: [main]
    paths:
      - .github/policy-review/**
      - .github/workflows/policy-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Named for everything it does, not just the tests. A check whose name
    # undersells its coverage makes it harder to know what is actually enforced.
    name: Lint, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: .github/policy-review
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --disable-pip-version-check \
            -r requirements-dev.txt

      # There is no Python linting elsewhere in this repository, so this is
      # scoped to the engine directory via its own pyproject.toml rather than
      # retrofitted across code this change does not own.
      - name: Lint
        working-directory: .github/policy-review
        run: ruff check .

      - name: Check formatting
        working-directory: .github/policy-review
        run: ruff format --check .

      - name: Run unit tests
        working-directory: .github/policy-review
        run: python -m unittest discover -s tests -t . -v

      # The engine is public. Guarding that here means a policy rule naming a
      # private repository, environment or customer cannot reach it by accident.
      - name: Check the engine carries no private policy content
        working-directory: .github/policy-review
        run: python -m unittest tests.test_public_safety -v
