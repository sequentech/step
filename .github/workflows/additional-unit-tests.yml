name: Additional package unit tests
on:
  pull_request:
    paths: ['packages/**', '.github/workflows/additional-unit-tests.yml', '.github/actions/setup-rust-tests/**']
  push:
    branches: [release/10.0]
    paths: ['packages/**', '.github/workflows/additional-unit-tests.yml', '.github/actions/setup-rust-tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [immu-board, e2e, mock_server]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-tests
        with:
          cargo-build-name: additional-${{ matrix.package }}
          cargo-build-path: packages/target
          cargo-lock-path: packages/Cargo.lock
      - name: Run package contracts
        working-directory: packages
        env:
          RUST_TEST_THREADS: '2'
        run: cargo test --locked -p '${{ matrix.package }}' --tests
      - name: Check production code
        working-directory: packages
        run: |
          if [ '${{ matrix.package }}' = immu-board ]; then
            cargo clippy --locked -p immu-board --lib --bins
          else
            cargo clippy --locked -p '${{ matrix.package }}' --bins
          fi
