name: REUSE licensing check

on:
    pull_request:
    push:
      branches: [ 'main', 'release/[0-9]+.[0-9]+', 'feat/use-arc-runner-java-test' ]

jobs:
  reuse:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: REUSE licensing check
      uses: fsfe/reuse-action@v6
