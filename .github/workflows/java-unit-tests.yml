name: Java package unit tests
on:
  pull_request:
    paths: ['packages/ECIESEncryption/**', '.github/workflows/java-unit-tests.yml']
  push:
    branches: [main]
    paths: ['packages/ECIESEncryption/**', '.github/workflows/java-unit-tests.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # https://github.com/adoptium/temurin17-binaries/releases/tag/jdk-17.0.20.1%2B1
          java-version: '17.0.20.1+1'
      - name: Install Maven 3.9.9
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/maven.sha512" https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz.sha512
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/maven.sha512")" "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Run command-line contracts
        working-directory: packages/ECIESEncryption
        run: mvn -B -ntp test
