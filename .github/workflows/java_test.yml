name: Java Test

on:
    pull_request:
    push:
      branches: [ 'main', 'release/[0-9]+.[0-9]+', 'feat/use-arc-runner-java-test']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Install Maven
      run: |
        sudo apt-get update
        sudo apt-get install -y maven

    - name: Keycloak Extensions Build and Test with Maven
      run: mvn -B clean verify --file packages/keycloak-extensions/pom.xml


