mutation CreateUser(
    $tenantId: String!
    $electionEventId: String
    $user: KeycloakUser2!
) {
    create_user(
        tenant_id: $tenantId
        election_event_id: $electionEventId
        user: $user
    ) {
        id
        username
    }
}
