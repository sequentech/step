mutation ImportUsers(
    $tenantId: String!
    $electionEventId: String
    $documentId: String!
    $sha256: String
) {
    import_users(
        tenant_id: $tenantId
        election_event_id: $electionEventId
        document_id: $documentId
        sha256: $sha256
    ) {
        task_execution {
            id
            execution_status
        }
    }
}
