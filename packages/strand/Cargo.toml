[package]
name = "strand"
version = "0.4.0"
authors = [
  "David Ruescas <david@sequenttech.io>",
  "Eduardo Robles <edulix@sequenttech.io>"
]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[features]
rayon = ["dep:rayon"]
wasmrayon = ["rayon", "wasm", "dep:wasm-bindgen-rayon"]
wasmtest = ["wasm", "dep:web-sys"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:web-sys"]
# num_bigint = ["dep:num-bigint", "dep:num-traits", "dep:num-integer", "dep:num-modular"]
# malachite = ["dep:malachite"]

[dependencies]

# Backends
# See https://docs.rs/curve25519-dalek/latest/curve25519_dalek/#simd-backend to select simd backend
curve25519-dalek = { version = "=5.0.0-pre.6", features = ["precomputed-tables", "digest"] }
num-bigint = { version = "0.4", features = ["rand"], optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }
num-modular = { version = "=0.5", features = ["num-bigint"], optional = true } # Pinned to avoid compile errors at the moment
malachite = { version = "0.6", default-features = false, features = ["naturals_and_integers"], optional = true }

# Signatures
ed25519-dalek = { version = "=3.0.0-pre.7", features = ["rand_core", "pkcs8", "alloc"] }

# symmetric
chacha20poly1305 = {version = "0.11.0-rc.3", features=["getrandom"] }
aead = { version = "0.6.0-rc.10", features=["rand_core"] }

# Hashing
sha2 = "0.11"
# Needed for extendable hashing function when deriving generators for ristretto
sha3 = "0.11"
# sha2 = "0.10.7"
# Needed for extendable hashing function when deriving generators for ristretto
# sha3 = "0.10"

# Serialization
# borsh = "0.9.3"
borsh = { version = "1.5", features = ["derive"] }
base64 = "0.22.1"

# RNG
rand = { package="rand", version = "=0.10" }
rand_core = { version = "0.10", optional = true }
getrandom = { version = "=0.4.2", features = ["wasm_js"] } # Enable wasm_js feature for WASM support
rand_chacha = "0.9"

# WASM
# Note: Using specific version of wasm-bindgen to match Nix version
wasm-bindgen-rayon = {version = "1.3", features = ["no-bundler"], optional = true}
wasm-bindgen = {version = "=0.2.104", optional = true}
serde-wasm-bindgen = {version = "0.6", optional = true}
web-sys = { version = "0.3", features = ['Performance', 'console'], optional = true }

rayon = { version = "1.5", optional = true }
cfg-if = "1.0"
thiserror = "2.0"

# Only needed for wasm demo
serde = { version = "1.0.215", features = ["derive"] }

# Used for debug impl and demo
hex = { version = "0.4" }

[dev-dependencies]
criterion = "0.5"
serde_json = "1.0"

[build-dependencies]
rustc_version = "0.4"

[[bench]]
name = "shuffle"
harness = false
# remove this to run benchmark
# bench = false

[[bench]]
name = "encrypt"
harness = false

[[bench]]
name = "verify_ballot"
harness = false
# remove this to run benchmark
# bench = false
