[package]
name = "braid-wasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "braid_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
braid = { path = "../braid", default-features = false, features = ["wasm-core"] }
strand = { path = "../strand", features=["rayon", "wasm", "wasmrayon"] }
b4 = { path = "../b4", default-features = false, features = ["wasm-core"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }  # Match strand version
js-sys = "0.3"

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbTransactionMode",
    "IdbCursorWithValue",
] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# IndexedDB
indexed_db_futures = "0.5"

# Utilities
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
tracing-wasm = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
