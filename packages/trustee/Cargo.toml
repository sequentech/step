[package]
name = "trustee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
protocol-board = { path = "../protocol-board" }
wbraid = { workspace = true }
vsc = { workspace = true }

anyhow = { workspace = true }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
# braid's transport and persistence futures are not `Send`: one thread.
tokio = { version = "1.40", features = ["rt", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
# The ids `protocol_board::DkgBoard` names its boards from.
uuid = "1.5"

[lints.rust]
unsafe_code = "forbid"
