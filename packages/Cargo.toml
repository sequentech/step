[workspace]
resolver = "2"

members = [
    "braid",
    "b4",
    "electoral-log",
    "harvest",
    "strand",
    "immu-board",
    "immudb-rs",
    "sequent-core",
    "velvet",
    "windmill",
    "pgmq-broker",
    "wrap-map-err",
    "step-cli",
    "e2e/src/mock_server",
    "e2e",
    "orare",
    "orare/doc_renderer",
    "plugins/*"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"


[patch.crates-io]
celery = { git = "https://github.com/Findeton/rusty-celery.git", rev = "c76b500a0fa444cd7e81d77de80ed21d1d929718" }

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
