[workspace]
resolver = "2"

members = [
    "braid",
    "b4",
    "electoral-log",
    "harvest",
    "strand",
    "immu-board",
    "immudb-rs",
    "sequent-core",
    "velvet",
    "windmill",
    "wrap-map-err",
    "step-cli",
    "e2e/src/mock_server",
    "e2e",
    "orare",
    "orare/doc_renderer",
    "plugins/*"
]

# Lightweight Assurance Methods is the shared target for retained Rust crates.
# A crate opts in with [lints] workspace = true after its existing debt is fixed.
# During that rollout, new test modules enforce this same policy directly.
[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
private_interfaces = "warn"
private_bounds = "warn"
unnameable_types = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
unwrap_used = "deny"
panic = "deny"
shadow_unrelated = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
future_not_send = "deny"
arithmetic_side_effects = "deny"
# Apply groups before their individual rules, so future changes are unambiguous.
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"


[patch.crates-io]
celery = { git = "https://github.com/Findeton/rusty-celery.git", rev = "b4145925aaaf742b7ba54499fff45313bcadfca1" }

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
