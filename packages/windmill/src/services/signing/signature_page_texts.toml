# The texts of the PDF signature page and of each signature's appearance, by
# language code (the codes of the portals' languages). `{name}` placeholders
# are filled in by the signing code (services::signing::page_texts). Every
# language has every key, and a `certify` sentence for each action that signs
# a PDF. English is the fallback. The languages are the portals' (en, es, cat,
# eu, fr, gl, nl, tl).

[en]
title = "{organization}: digital signatures"
signature = "Signature {n}"
signature_of = "Signature {n} of {total}"
signed_by = "Digitally signed by {name}"
date = "Date: {time}"
issuer = "Issuer: {issuer}"
code = "Signing code: {code}"
document = "Document SHA-256 before signatures: {sha256}"

[en.certify]
generate-election-returns = "We certify that these election returns are true and correct. Each of us signed them with our digital certificate."
generate-reports = "We certify that this report is true and correct. Each of us signed it with our digital certificate."

[es]
title = "{organization}: firmas digitales"
signature = "Firma {n}"
signature_of = "Firma {n} de {total}"
signed_by = "Firmado digitalmente por {name}"
date = "Fecha: {time}"
issuer = "Emisor: {issuer}"
code = "Código de firma: {code}"
document = "SHA-256 del documento antes de las firmas: {sha256}"

[es.certify]
generate-election-returns = "Certificamos que estas actas electorales son verídicas y correctas. Cada uno de nosotros las firmó con su certificado digital."
generate-reports = "Certificamos que este informe es verídico y correcto. Cada uno de nosotros lo firmó con su certificado digital."

[cat]
title = "{organization}: signatures digitals"
signature = "Signatura {n}"
signature_of = "Signatura {n} de {total}"
signed_by = "Signat digitalment per {name}"
date = "Data: {time}"
issuer = "Emissor: {issuer}"
code = "Codi de signatura: {code}"
document = "SHA-256 del document abans de les signatures: {sha256}"

[cat.certify]
generate-election-returns = "Certifiquem que aquestes actes electorals són veraces i correctes. Cadascun de nosaltres les ha signat amb el seu certificat digital."
generate-reports = "Certifiquem que aquest informe és veraç i correcte. Cadascun de nosaltres l'ha signat amb el seu certificat digital."

[eu]
title = "{organization}: sinadura digitalak"
signature = "{n}. sinadura"
signature_of = "{n}. sinadura, guztira {total}"
signed_by = "{name}(e)k digitalki sinatua"
date = "Data: {time}"
issuer = "Jaulkitzailea: {issuer}"
code = "Sinadura-kodea: {code}"
document = "Dokumentuaren SHA-256 sinaduren aurretik: {sha256}"

[eu.certify]
generate-election-returns = "Ziurtatzen dugu hauteskunde-akta hauek egiazkoak eta zuzenak direla. Gutako bakoitzak bere ziurtagiri digitalarekin sinatu ditu."
generate-reports = "Ziurtatzen dugu txosten hau egiazkoa eta zuzena dela. Gutako bakoitzak bere ziurtagiri digitalarekin sinatu du."

[fr]
title = "{organization} : signatures numériques"
signature = "Signature {n}"
signature_of = "Signature {n} sur {total}"
signed_by = "Signé numériquement par {name}"
date = "Date : {time}"
issuer = "Émetteur : {issuer}"
code = "Code de signature : {code}"
document = "SHA-256 du document avant les signatures : {sha256}"

[fr.certify]
generate-election-returns = "Nous certifions que ces procès-verbaux électoraux sont sincères et exacts. Chacun de nous les a signés avec son certificat numérique."
generate-reports = "Nous certifions que ce rapport est sincère et exact. Chacun de nous l'a signé avec son certificat numérique."

[gl]
