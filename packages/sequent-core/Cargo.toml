[package]
name = "sequent-core"
version = "0.1.0"
edition = "2021"
authors = [
  "Felix Robles <felix@sequentech.io>"
]
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "render_pdf"
required-features = ["reports"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
# borsh = "0.9.3"
borsh = { version = "1.5", features = ["derive"] }

# wasm
# Note: Using specific version of wasm-bindgen to match Nix version
wasm-bindgen = {version = "=0.2.104", features = ['serde-serialize'], optional = true}
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", features = ['Performance', 'console'], optional = true}
cfg-if = "1.0"
# signatures
ed25519-dalek = {version = "=3.0.0-pre.1", features = ["serde"]}
curve25519-dalek = { version = "=5.0.0-pre.1", features = [] }
# aws
aws-config = { version = "1.6", features = ["behavior-version-latest"], optional = true }
aws-sdk-sesv2 = { version = "1.70", optional = true }
aws-sdk-sns = { version = "1.63", optional = true }

# for s3
aws-sdk-s3 = { version = "1.121.0", optional = true }
aws-smithy-types = { version = "1.3", optional = true }
sha256 = { version = "1.6", optional = true }

# time
chrono = { version = "0.4", features = ["serde"] }

# time
time = { version = "0.3", optional = true }

# serializing
hex = "0.4"
base64 = "0.22"

# rust to json schema
schemars = { version = "0.8", features = ["chrono"]}
# strand
strand = { path="../strand", features = [], optional = true}

num-bigint = { version = "0.4", features = ["rand"], optional = true }
num-traits = "0.2"
quick-error = "2.0"

strum = "0.27"
strum_macros = "0.27"

# error logging
console_error_panic_hook = "0.1"

# error handling
anyhow = "1.0"

# character mapping for write-ins
phf = { version = "0.11", features = ["macros"], default-features = false }

# template system
handlebars = { version = "6.1", optional = true }
handlebars-chrono = { version = "0.2", features = [ "locale", "timezone" ], optional = true }
num-format = { version = "0.4", optional = true }
urlencoding = { version = "2.1", optional = true }
headless_chrome = { version = "1.0", optional = true }
reqwest = { version="0.12", features = ["blocking", "json", "rustls-tls"], optional = true, default-features = false }
reqwest-retry = { version = "0.7", optional = true }
reqwest-middleware = { version = "0.4", optional = true }
# logging
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-tree = { version = "0.4", optional = true }
tracing-log = { version = "0.2", optional = true }

tempfile = {version = "3.15", optional = true}
keycloak = { version = "24.0", optional = true }

# openid connection
openid = { version = "0.17", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
rocket = { version = "0.5", features = ["json"], optional = true }
uuid = { version = "1.5", features = ["v4", "fast-rng"], optional = true }
regex = { version = "1.10", optional = true }
jsonwebtoken = { version = "9.1", optional = true }

# For converting rows into users
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }

# probehandler
tokio = { version = "1.44", features = ["full"], optional = true }
warp =  { version = "0.3", optional = true }
ammonia = { version = "4.1", optional = true }
ordered-float = { version = "5.0", features = ["serde"] }

rand = { package="rand", version = "=0.8" }

# for lambda/openwhisk
async-trait = { version = "0.1", optional = true }

printpdf = { version = "0.8", optional = true }
kuchiki = { version = "0.8", optional = true }

# sqlite
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
csv = "1.3.0"

# reading authoring spreadsheets; optional so front ends with no workbook to read
# do not carry it into their WASM bundle
calamine = { version = "0.26", features = ["dates"], optional = true }

# uuid5 for the deterministic ids a generated bundle uses. The `uuid` crate is not
# used for this: its v4 feature pulls getrandom, whose WASM support is version
# specific and already pinned elsewhere in this workspace, and nothing here needs
# randomness.
sha1 = { version = "0.10", optional = true }


# WASM plugin management
wasmtime = {version = "41.0.2", optional = true}
wasmtime-wasi = {version = "41.0.2", optional = true}

[dev-dependencies]
ptree = "0.5"
wasm-bindgen-test = "0.3.42"
# writes the tiny .xlsx the reader's tests read, so no binary fixture is committed
zip = "2.1"

[features]
wasmtest = ["wasm", "dep:web-sys", "strand/wasmtest"]
wasm = ["dep:wasm-bindgen", "areas", "dep:serde-wasm-bindgen"]
signatures=["dep:tracing"]
default = []
areas = []
reports = ["dep:handlebars", "dep:handlebars-chrono", "dep:headless_chrome", "dep:reqwest", "dep:tracing", "dep:tokio", "dep:num-format", "dep:urlencoding", "dep:aws-config", "dep:aws-sdk-sesv2", "dep:aws-sdk-sns", "dep:aws-sdk-s3", "dep:aws-smithy-types", "dep:sha256", "dep:ammonia"]
reports_sync = []
s3 = ["dep:reqwest", "dep:aws-config", "dep:aws-sdk-sesv2", "dep:aws-sdk-sns", "dep:aws-sdk-s3", "dep:aws-smithy-types"]
keycloak = ["jwt", "dep:openid", "dep:reqwest", "dep:reqwest-retry", "dep:reqwest-middleware", "dep:serde_urlencoded", "dep:rocket", "dep:keycloak", "dep:tracing", "dep:uuid", "dep:regex", "dep:jsonwebtoken", "dep:tokio-postgres", "dep:time"]
log = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-tree", "dep:tracing-log"]
probe = ["dep:tokio", "dep:warp"]
# Lambda examples
lambda_inplace = []
lambda_openwhisk = []
lambda_aws_lambda = []
plugins_wit = ["dep:wasmtime", "dep:wasmtime-wasi"]
default_features = ["dep:strand", "dep:num-bigint", "dep:tempfile", "dep:ammonia", "dep:sha1"]
# Reading .xlsx into an election_config::sheet::Workbook. Separate from
# default_features because admin-portal and voting-portal have no workbook to
# read and should not pay for a spreadsheet parser in their bundle.
election_config_xlsx = ["default_features", "dep:calamine"]

sqlite = ["dep:tokio", "dep:rusqlite"]
time = ["dep:time"]
tracing = ["dep:tracing"]
jwt = ["time", "tracing"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
