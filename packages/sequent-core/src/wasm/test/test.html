<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>sequent-core wasm test</title>
  </head>
  <body style="background-color:black;">
    <script type="module">
        import init, {
            generate_sample_auditable_ballot_js,
            hash_auditable_ballot_js,
            decode_auditable_ballot_js,
        } from '../../../../node_modules/sequent-core/index.js';

        try {
            await init();
            const ballot = generate_sample_auditable_ballot_js();
            const hash = hash_auditable_ballot_js(ballot);
            const decoded = decode_auditable_ballot_js(ballot);
            if (!/^[0-9a-f]{64}$/.test(hash) || decoded.length !== ballot.contests.length) {
                throw new Error('Invalid sample ballot hash or contest coverage');
            }
            document.getElementById('lognew').textContent = 'verified: ' + hash;
        } catch (error) {
            document.getElementById('lognew').textContent = 'failed: ' + String(error);
            throw error;
        }
    </script>
    <span id="lognew" style="color:cyan;white-space: pre;font-size: 20px;"></span>
  </body>
</html>
