# Ballots cast each hour of the chosen day, with the running total.
id: hourly-votes
title: Ballots by hour
source: voting_enrollment_activity
selectors:
  day:
    label: Day
    options_from: event_days
query:
  template: timeseries
  measures: [voted]
  grain: hour
  day: {selector: day}
height: 280
chart:
  charts:
    votes:
      type: area
      query: data
      x: bucket_label
      y: voted_cumulative
      # Names the first series in the legend; the axis itself needs no title.
      y_label: Ballots so far
      style: {number_format: integer, axis_y: {title: {visible: false}}}
      layers:
        - {type: bar, y: voted, label: In the hour}
  rows: [votes]
