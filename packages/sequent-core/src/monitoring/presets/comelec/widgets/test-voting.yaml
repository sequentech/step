# Pre-enrolled voters who cast a vote in a test election. The denominator is
# pre-enrolled voters (D1).
id: test-voting
title: Test voting
description: Percentages use pre-enrolled OVs.
source: test_voting
requirements: [SW-F-0253, SW-F-0367]
queries:
  share: {template: summary, ratio: [test_voted, pre_enrolled]}
  progress:
    template: by_measure
    measures: [pre_enrolled, test_voted]
    labels: {pre_enrolled: Pre-enrolled OVs, test_voted: Test voted}
height: 240
chart:
  charts:
    share:
      type: kpi
      query: share
      value: numerator
      label: Test voted
      style: {value: {format: integer}}
      support: {value: pct_label, label: of pre-enrolled OVs}
    progress:
      type: spark_bar
      query: progress
      x: value
      y: label
  rows:
    - share
    - progress
