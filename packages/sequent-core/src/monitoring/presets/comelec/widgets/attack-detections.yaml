# Attacks the platform detected, over time and by category.
id: attack-detections
title: Attack detections
source: attack_detections
requirements: [SW-F-0283]
selectors:
  grain:
    label: Interval
    control: toggle
    options: {hour: Hourly, day: Daily}
    default: day
  day:
    label: Day
    options_from: event_days
    when: {selector: grain, in: [hour]}
queries:
  total: {template: summary, measures: [detections]}
  series:
    template: timeseries
    measures: [detections]
    grain: {selector: grain}
    day: {selector: day}
  categories:
    template: by_group
    group_by: category
    measures: [detections]
    sort: {by: value, order: desc}
height: 400
chart:
  charts:
    total:
      type: kpi
      query: total
      value: detections
      label: Detections
      style: {value: {format: integer}}
    series:
      type: bar
      query: series
      x: bucket_label
      y: detections
      y_label: Detections
      # In time order, which the labels alone are not when clocks go back.
      sort: {by: bucket_utc, order: asc}
      style: {orientation: vertical, number_format: number}
    categories:
      type: bar
      query: categories
      x: group
      y: detections
      # The query's order, Unknown last; unsorted, a bar orders by value.
      sort: {by: position, order: asc}
      title: By category
      style:
        orientation: horizontal
        number_format: number
        marks: {bar: {labels: {visible: true, format: number}}}
  rows:
    - total
    - {cols: [series, categories]}
