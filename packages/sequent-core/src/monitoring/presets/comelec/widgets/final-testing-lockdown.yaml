# Posts that passed final testing, and Posts locked down, over the Posts in
# scope.
id: final-testing-lockdown
title: Final testing and lockdown
source: final_testing_lockdown
requirements: [SW-F-0254, SW-F-0255]
selectors:
  milestone:
    label: Milestone
    control: toggle
    options: {tested: Final testing done, locked_down: Locked down}
    default: tested
    maps: {tested: [tested, posts], locked_down: [locked_down, posts]}
queries:
  milestone: {template: summary, ratio: {selector: milestone}}
  posts: {template: by_post, measures: [posts], sort: {by: label, order: asc}}
height: 400
chart:
  charts:
    reached:
      type: kpi
      query: milestone
      value: numerator
      label: Posts that reached the milestone
      style: {value: {format: integer}}
      support: {value: pct_label, label: of the Posts in scope}
    in_scope:
      type: kpi
      query: milestone
      value: denominator
      label: Posts in scope
      style: {value: {format: integer}}
    posts:
      type: table
      query: posts
      style:
        columns:
          post: {label: Post}
          post_id: {visible: false}
          position: {visible: false}
          region: {label: Region}
          state: {visible: false}
          state_label: {label: Status}
          posts: {visible: false}
  rows:
    - {cols: [reached, in_scope]}
    - posts
