id: credentials-by-post
title: Credentials by Post
source: voting_credentials
requirements: [SW-F-0251]
query:
  template: by_group
  group_by: post
  measures: [approved, credentials_issued]
  ratio: [credentials_issued, approved]
  sort: {by: ratio, order: asc}
height: 340
chart:
  charts:
    posts:
      type: table
      query: data
      title: Lowest share issued first
      style:
        columns:
          group: {label: Post}
          group_key: {visible: false}
          position: {visible: false}
          approved: {label: Approved, format: integer, align: right}
          credentials_issued: {label: Issued, format: integer, align: right}
          numerator: {visible: false}
          denominator: {visible: false}
          pct: {visible: false}
          pct_label: {label: Issued of approved, align: right}
  rows: [posts]
