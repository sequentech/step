# Voters casting their first vote per hour or per day, each voter counted at their first one, with the
# running total. The day picker shows only for hourly.
id: voting-activity
title: Voting activity
source: voting_enrollment_activity
requirements: [SW-F-0267]
selectors:
  grain:
    label: Interval
    control: toggle
    options: {hour: Hourly, day: Daily}
    default: hour
  day:
    label: Day
    options_from: event_days
    when: {selector: grain, in: [hour]}
query:
  template: timeseries
  measures: [voted]
  grain: {selector: grain}
  day: {selector: day}
height: 320
chart:
  charts:
    activity:
      type: bar
      query: data
      x: bucket_label
      y: voted
      y_label: First votes
      style: {number_format: integer}
      layers:
        - type: line
          y: voted_cumulative
          label: Running total
          axis_y: {position: right, title: Running total}
  rows: [activity]
