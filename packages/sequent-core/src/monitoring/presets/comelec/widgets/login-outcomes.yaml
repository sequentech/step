# Sign-in attempts over time by outcome.
id: login-outcomes
title: Login outcomes
source: access_security
requirements: [SW-F-0280, SW-F-0281]
selectors:
  grain:
    label: Interval
    control: toggle
    options: {hour: Hourly, day: Daily}
    default: hour
  day:
    label: Day
    options_from: event_days
    when: {selector: grain, in: [hour]}
query:
  template: timeseries
  measures: [logins, login_failures, password_resets]
  grain: {selector: grain}
  day: {selector: day}
height: 320
chart:
  charts:
    outcomes:
      type: line
      query: data
      x: bucket_label
      y: logins
      # Names the first series in the legend; the axis itself needs no title.
      y_label: Successful
      style: {number_format: integer, axis_y: {title: {visible: false}}}
      layers:
        - {type: line, y: login_failures, label: Failed}
        - {type: line, y: password_resets, label: Password resets}
  rows: [outcomes]
