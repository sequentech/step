# How many Posts in scope have reached a milestone, how they stand now, and
# the milestone by region. The denominator is always the Posts in scope.
id: poll-status
title: Poll status
source: poll_status
requirements: [SW-F-0256, SW-F-0257, SW-F-0258, SW-F-0368, SW-F-0369, SW-F-0370]
selectors:
  milestone:
    label: Milestone
    options: {initialized: Initialized, opened: Opened, closed: Closed}
    default: opened
    maps: {initialized: [initialized, posts], opened: [opened, posts], closed: [closed, posts]}
queries:
  milestone: {template: summary, ratio: {selector: milestone}}
  states: {template: by_group, group_by: state, measures: [posts]}
  regions: {template: by_group, group_by: region, ratio: {selector: milestone}}
height: 360
chart:
  charts:
    reached:
      type: kpi
      query: milestone
      value: numerator
      label: Posts that reached the milestone
      style: {value: {format: integer}}
      support: {value: pct_label, label: of the Posts in scope}
    in_scope:
      type: kpi
      query: milestone
      value: denominator
      label: Posts in scope
      style: {value: {format: integer}}
    states:
      type: donut
      query: states
      theta: posts
      color: group
      title: Posts by current state
    regions:
      type: bar
      query: regions
      x: group
      y: pct
      # The query's order, Unknown last; unsorted, a bar orders by value.
      sort: {by: position, order: asc}
      title: By region
      style:
        orientation: horizontal
        number_format: percent
        marks: {bar: {labels: {visible: true, format: percent}}}
  rows:
    - {cols: [reached, in_scope]}
    - {cols: [states, regions]}
