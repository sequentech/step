# Voters approved per hour or per day, each voter counted at their first one, with the
# running total. The day picker shows only for hourly.
id: enrollment-activity
title: Enrollment activity
source: voting_enrollment_activity
requirements: [SW-F-0282]
selectors:
  grain:
    label: Interval
    control: toggle
    options: {hour: Hourly, day: Daily}
    default: hour
  day:
    label: Day
    options_from: event_days
    when: {selector: grain, in: [hour]}
query:
  template: timeseries
  measures: [approved]
  grain: {selector: grain}
  day: {selector: day}
height: 320
chart:
  charts:
    activity:
      type: bar
      query: data
      x: bucket_label
      y: approved
      y_label: Approvals
      # In time order, which the labels alone are not when clocks go back.
      sort: {by: bucket_utc, order: asc}
      style: {orientation: vertical, number_format: number, axis_y: {ticks: {step: 1}}}
      layers:
        - type: line
          y: approved_cumulative
          label: Running total
          axis_y: {position: right, title: Running total, ticks: {step: 1}}
  rows: [activity]
