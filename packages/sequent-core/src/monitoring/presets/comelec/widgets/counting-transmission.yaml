# Both milestones at once, over the Posts in scope, the Posts whose
# transmission failed, the same as bars against the Posts in scope, and
# where each Post stands.
id: counting-transmission
title: Counting and transmission
description: Percentages use the Posts in scope.
source: counting_transmission
requirements: [SW-F-0263, SW-F-0264, SW-F-0265]
queries:
  tallied: {template: summary, ratio: [tallied, posts]}
  transmitted: {template: summary, ratio: [transmitted, posts]}
  failed: {template: summary, measures: [transmission_failed]}
  progress:
    template: by_measure
    measures: [posts, tallied, transmitted, transmission_failed]
    labels: {posts: Posts in scope, tallied: Vote counting done, transmitted: Results transmitted, transmission_failed: Transmission errors}
  posts: {template: by_post, measures: [posts], sort: {by: label, order: asc}}
height: 560
chart:
  charts:
    tallied:
      type: kpi
      query: tallied
      value: numerator
      label: Vote counting done
      style: {value: {format: integer}}
      support: {value: pct_label, label: of Posts}
    transmitted:
      type: kpi
      query: transmitted
      value: numerator
      label: Results transmitted
      style: {value: {format: integer}}
      support: {value: pct_label, label: of Posts}
    failed:
      type: kpi
      query: failed
      value: transmission_failed
      label: Transmission errors
      style: {value: {format: integer}}
    progress:
      type: spark_bar
      query: progress
      x: value
      y: label
    posts:
      type: table
      query: posts
      title: Posts
      style:
        columns:
          post: {label: Post}
          post_id: {visible: false}
          position: {visible: false}
          region: {label: Region}
          state: {visible: false}
          state_label: {label: Status}
          posts: {visible: false}
      conditional_formatting:
        state_label:
          when:
            - {eq: Transmission failed, background: negative.bg}
  rows:
    - {cols: [tallied, transmitted, failed]}
    - progress
    - posts
