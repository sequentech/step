# Posts that have counted and transmitted their results, over the Posts in
# scope, and those whose transmission failed.
id: counting-transmission
title: Counting and transmission
source: counting_transmission
requirements: [SW-F-0263, SW-F-0264, SW-F-0265]
selectors:
  milestone:
    label: Milestone
    control: toggle
    options: {tallied: Counted, transmitted: Transmitted}
    default: tallied
    maps: {tallied: [tallied, posts], transmitted: [transmitted, posts]}
queries:
  milestone: {template: summary, ratio: {selector: milestone}}
  failed: {template: summary, measures: [transmission_failed]}
  posts: {template: by_post, measures: [posts], sort: {by: label, order: asc}}
height: 460
chart:
  charts:
    reached:
      type: kpi
      query: milestone
      value: numerator
      label: Posts at the milestone
      style: {value: {format: integer}}
      support: {value: pct_label, label: of the Posts in scope}
    in_scope:
      type: kpi
      query: milestone
      value: denominator
      label: Posts in scope
      style: {value: {format: integer}}
    failed:
      type: kpi
      query: failed
      value: transmission_failed
      label: Transmission failed
      style: {value: {format: integer}}
    posts:
      type: table
      query: posts
      style:
        columns:
          post: {label: Post}
          post_id: {visible: false}
          position: {visible: false}
          region: {label: Region}
          state: {visible: false}
          state_label: {label: Status}
          posts: {visible: false}
      conditional_formatting:
        state_label:
          when:
            - {eq: Transmission failed, background: negative.bg}
  rows:
    - {cols: [reached, in_scope]}
    - failed
    - posts
