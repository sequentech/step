# Approved voters who have been issued voting credentials. Credentials count
# as issued when they are set (D1).
id: credentials-issued
title: Voting credentials issued
description: Percentages use approved OVs.
source: voting_credentials
requirements: [SW-F-0251]
queries:
  share: {template: summary, ratio: [credentials_issued, approved]}
  progress:
    template: by_measure
    measures: [approved, credentials_issued]
    labels: {approved: Approved OVs, credentials_issued: Credentials issued}
height: 240
chart:
  charts:
    share:
      type: kpi
      query: share
      value: numerator
      label: Credentials issued
      style: {value: {format: integer}}
      support: {value: pct_label, label: of approved OVs}
    progress:
      type: spark_bar
      query: progress
      x: value
      y: label
  rows:
    - share
    - progress
