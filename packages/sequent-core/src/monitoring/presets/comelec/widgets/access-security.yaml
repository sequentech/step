# Sign-in attempts by outcome, and password resets. Counted in attempts, not
# voters.
id: access-security
title: Access and security
description: Counted in sign-in attempts, not OVs.
source: access_security
requirements: [SW-F-0252, SW-F-0268]
queries:
  outcomes:
    template: by_measure
    measures: [logins, login_failures]
    labels: {logins: Successful sign-ins, login_failures: Failed sign-ins}
  resets: {template: summary, measures: [password_resets]}
height: 220
chart:
  charts:
    outcomes:
      type: spark_bar
      query: outcomes
      x: value
      y: label
    resets:
      type: kpi
      query: resets
      value: password_resets
      label: Password resets
      style: {value: {format: integer}}
  rows:
    - outcomes
    - resets
