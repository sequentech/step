# Sign-in attempts by outcome, and password resets. Counted in attempts, not
# voters.
id: access-security
title: Access and security
description: Counted in sign-in attempts, not OVs.
source: access_security
requirements: [SW-F-0252, SW-F-0268]
query: {template: summary, measures: [logins, login_failures, password_resets]}
height: 300
chart:
  charts:
    logins:
      type: kpi
      query: data
      value: logins
      label: Successful sign-ins
      style: {value: {format: integer}}
    failures:
      type: kpi
      query: data
      value: login_failures
      label: Failed sign-ins
      style: {value: {format: integer}}
    resets:
      type: kpi
      query: data
      value: password_resets
      label: Password resets
      style: {value: {format: integer}}
  rows:
    - {cols: [logins, failures]}
    - resets
