# Every Post in scope with its own counts and ratio, highest first.
id: turnout-by-post
title: Turnout by Post
source: voter_turnout
requirements: [SW-F-0259, SW-F-0260, SW-F-0261]
selectors:
  measure:
    label: Show
    options: {voted_reg: Voted of registered, voted_pre: Voted of pre-enrolled, pre_reg: Pre-enrolled of registered}
    default: voted_reg
    maps: {voted_reg: [voted, registered], voted_pre: [voted, pre_enrolled], pre_reg: [pre_enrolled, registered]}
  order:
    label: Order
    control: toggle
    options: {ratio: Highest first, label: By name}
    default: ratio
    maps: {ratio: {by: ratio, order: desc}, label: {by: label, order: asc}}
query:
  template: by_group
  group_by: post
  measures: [registered, pre_enrolled, voted]
  ratio: {selector: measure}
  sort: {selector: order}
height: 360
chart:
  charts:
    posts:
      type: table
      query: data
      style:
        columns:
          group: {label: Post}
          group_key: {visible: false}
          position: {visible: false}
          registered: {label: Registered, format: integer, align: right}
          pre_enrolled: {label: Pre-enrolled, format: integer, align: right}
          voted: {label: Voted, format: integer, align: right}
          numerator: {visible: false}
          denominator: {visible: false}
          pct: {visible: false}
          pct_label: {label: Turnout, align: right}
  rows: [posts]
