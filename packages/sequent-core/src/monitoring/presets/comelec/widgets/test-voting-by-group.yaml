id: test-voting-by-group
title: Test voting by group
description: Percentages use each group's pre-enrolled OVs.
source: test_voting
requirements: [SW-F-0367]
selectors:
  breakdown:
    label: Breakdown
    options: {sex: Sex, age_band: Age, status: Status abroad}
    default: sex
query:
  template: by_group
  group_by: {selector: breakdown}
  ratio: [test_voted, pre_enrolled]
height: 320
chart:
  charts:
    bars:
      type: bar
      query: data
      x: group
      y: pct
      # The query's order, Unknown last; unsorted, a bar orders by value.
      sort: {by: position, order: asc}
      y_label: Test voted of pre-enrolled
      style:
        orientation: horizontal
        number_format: percent
        marks: {bar: {labels: {visible: true, format: percent}}}
  rows: [bars]
