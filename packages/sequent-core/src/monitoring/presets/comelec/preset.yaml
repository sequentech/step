# The monitoring dashboards shipped for the Philippine overseas vote: an
# overview and one section for each part of the election, in the order it
# runs, each answering the monitoring records of that part.
id: comelec
version: 5
title: COMELEC overseas voting
description: An overview and a section for each part of the overseas vote, from enrollment to transmission, answering every monitoring record of the package.
export_requirements: [SW-F-0270]
owned_elsewhere:
  - requirements: [SW-F-0248, SW-F-0272, SW-F-0273]
    subject: Communications logs
    owner: DEV-COMMUNICATIONS
  - requirements: [SW-F-0266]
    subject: Other reports
    owner: DEV-REPORTS
  - requirements: [SW-F-0278]
    subject: Anomaly detection, designed in VOTE-SECOPS
    owner: DEV-PLATFORM-SECURITY
  - requirements: [SW-F-0374]
    subject: CSV and SQL export of the audit logs; dashboard export covers dashboard data
    owner: DEV-AUDIT-LOGS
