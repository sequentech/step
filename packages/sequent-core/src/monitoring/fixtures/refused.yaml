# Configuration that must be refused because of what it contains: anything that
# would reach outside the governed data, or be interpreted rather than shown.
#
# Shared by the Rust policy and the renderer's own defence-in-depth checks, so
# the two refuse the same things. Every case names the kind of document, the
# problem code the Rust policy reports and the path it reports it at.
- name: inline SQL as a chart query
  kind: widget
  code: dangling_reference
  path: chart.charts.k.query
  yaml: |
    id: w
    title: W
    source: voter_turnout
    query: {template: summary, measures: [voted]}
    chart: {charts: {k: {type: kpi, query: "SELECT count(*) FROM cast_vote", value: voted}}, rows: [k]}
- name: SQL query object in a chart
  kind: widget
  code: forbidden_key
  path: chart.charts.k.query.sql
  yaml: |
    id: w
    title: W
    source: voter_turnout
    query: {template: summary, measures: [voted]}
    chart: {charts: {k: {type: kpi, query: {sql: "SELECT 1 AS voted"}, value: voted}}, rows: [k]}
- name: named SQL queries in the chart
  kind: widget
  code: forbidden_key
  path: chart.queries
  yaml: |
    id: w
    title: W
    source: voter_turnout
    query: {template: summary, measures: [voted]}
    chart:
      queries: {extra: "SELECT 1"}
      charts: {k: {type: kpi, query: data, value: voted}}
      rows: [k]
- name: inline values in the chart
  kind: widget
  code: forbidden_key
  path: chart.queries
  yaml: |
    id: w
    title: W
    source: voter_turnout
    query: {template: summary, measures: [voted]}
    chart:
      queries: {data: {columns: [voted], values: [[874624]]}}
      charts: {k: {type: kpi, query: data, value: voted}}
      rows: [k]
- name: HTTP query in a layer
