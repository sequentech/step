[package]
name = "wrap-map-err"
version = "0.1.0"
edition = "2021"
authors = [
  "Eduardo Robles <edu@sequentech.io>"
]
license = "AGPL-3.0-only"

[lib]
proc-macro = true

[dependencies]
syn = {version = "2.0", features = ['full', 'visit-mut'] }
quote = "1.0"
proc-macro2 = "1.0"

# deny rather than forbid: tests/behavior.rs allows `unsafe` to check that the macro
# keeps the unsafe context of a wrapped function (scripts/check-unsafe.py).
[lints.rust]
unsafe_code = "deny"
