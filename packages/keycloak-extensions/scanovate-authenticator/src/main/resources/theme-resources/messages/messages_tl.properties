scanovateInternalError=Error. Pakisubukang muli mamaya.<br>
scanovateVerificationFailedError=Hindi namin ma-verify ang inyong pagkakakilanlan. Pakisubukang muli.<br>
scanovateDocumentAuthenticationError=Hindi namin ma-authenticate ang inyong ID. Siguraduhing ito ay valid, maliwanag at buong nakikita, at subukang muli.<br>
scanovateMaxTrialsError=Hindi nakumpleto ang pag-verify ng pagkakakilanlan matapos ang ilang pagsubok. Pakisuri ang pahintulot sa camera at ang inyong koneksyon, at subukang muli.<br>
scanovateAttributesError=Paumanhin, mukhang ang impormasyong nakuha ng aming sistema ay hindi tumutugma sa mga detalye na iyong ibinigay sa form. Subukang muli o i-restart ang pagpaparehistro at suriing mabuti ang iyong mga entry.<br>
scanovateScoringError=Kailangang mapabuti ang kalidad ng mga ibinigay na imahe. Pakisubukang muli.<br>
scanovateMaxRetriesError=Ikinalulungkot naming ipaalam na hindi na-verify ang inyong pagkakakilanlan matapos ang pinakamaraming pagsubok, kaya’t hindi naging matagumpay ang inyong pag-enroll.<br><br>Maraming salamat!
