scanovateInternalError=Error. Pakisubukang muli mamaya.
scanovateVerificationFailedError=Hindi namin ma-verify ang inyong pagkakakilanlan. Pakisubukang muli.
scanovateDocumentAuthenticationError=Hindi namin ma-authenticate ang inyong ID. Siguraduhing ito ay valid, maliwanag at buong nakikita, at subukang muli.
scanovateMaxTrialsError=Hindi nakumpleto ang pag-verify ng pagkakakilanlan matapos ang ilang pagsubok. Pakisuri ang pahintulot sa camera at ang inyong koneksyon, at subukang muli.
scanovateAttributesError=Ang impormasyong nakuha ng aming sistema ay hindi tumutugma sa mga detalye na iyong ibinigay sa form. Subukang muli o i-restart ang pagpaparehistro at suriing mabuti ang iyong mga entry.
scanovateScoringError=Kailangang mapabuti ang kalidad ng mga ibinigay na imahe. Pakisubukang muli.
scanovateMaxRetriesError=Hindi na-verify ang inyong pagkakakilanlan matapos ang pinakamaraming pagsubok, kaya hindi naging matagumpay ang inyong pag-enroll.
scanovateCaptureTitle=I-verify ang Iyong Pagkakakilanlan
scanovateCaptureThemeRequired=Kailangan ng hakbang na ito sa pag-verify ng pagkakakilanlan ang sequent-ui na login theme, na hindi naka-enable para sa halalang ito. Pakikontak ang mga administrador ng halalan.
scanovateCaptureInvalidError=Hindi namin maproseso ang mga larawan o ang video. Pakikuhang muli ang mga ito.
scanovateLivenessError=Hindi namin makumpirma na ikaw ang nasa harap ng kamera. Pakisubukang muli.
scanovateFaceMismatchError=Hindi tugma ang mukha sa inyong mga larawan sa larawan sa inyong ID.
scanovateFaceNotFoundError=Hindi namin makita ang inyong mukha sa inyong ID o sa larawan ninyong hawak ito. Tiyaking malinaw at walang takip ang larawan sa inyong ID.
