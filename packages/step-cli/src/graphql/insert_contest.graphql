mutation InsertContest(
  $tenant_id: uuid!,
  $election_event_id: uuid!,
  $election_id: uuid!,
  $description: String,
  $counting_algorithm: String,
  $max_votes: Int,
  $min_votes: Int,
  $winning_candidates_num: Int,
  $presentation: jsonb,
  $is_acclaimed: Boolean,
  $is_active: Boolean,
  $is_encrypted: Boolean,
) {
  insert_sequent_backend_contest(objects: {
    tenant_id: $tenant_id,
    election_event_id: $election_event_id,
    election_id: $election_id,
    description: $description,
    max_votes: $max_votes,
    min_votes: $min_votes,
    winning_candidates_num: $winning_candidates_num,
    presentation: $presentation
    counting_algorithm: $counting_algorithm,
    is_acclaimed:  $is_acclaimed,
    is_active: $is_active,
    is_encrypted: $is_encrypted,
  }) {
    affected_rows
    returning {
      id
    }
  }
}