mutation CreateTrusteeMutation($name: String!, $publicKey: String!, $shareEncryptionPublicKey: String!, $tenantId: uuid!) {
  insert_sequent_backend_trustee_one(
    object: { name: $name, public_key: $publicKey, share_encryption_public_key: $shareEncryptionPublicKey, tenant_id: $tenantId }
  ) {
    id
  }
}
