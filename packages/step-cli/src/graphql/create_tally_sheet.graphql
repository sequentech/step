mutation CreateNewTallySheet(
    $election_event_id: String!
    $channel: String!
    $content: jsonb!
    $contest_id: String!
    $area_id: String!
) {
    create_new_tally_sheet(
        election_event_id: $election_event_id
        channel: $channel
        content: $content
        contest_id: $contest_id
        area_id: $area_id
    ) {
        id
        status
        version
    }
}
