mutation InsertElection($tenant_id: uuid!, $election_event_id: uuid!, $external_id: String!, $description: String, $presentation: jsonb) {
  insert_sequent_backend_election(objects: {
    tenant_id: $tenant_id,
    election_event_id: $election_event_id,
    external_id: $external_id,
    description: $description,
    presentation: $presentation
  }) {
    affected_rows
    returning {
      id
    }
  }
}