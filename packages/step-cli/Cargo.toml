[package]
name = "step-cli"
version = "0.1.0"
edition = "2021"
default-run = "step-cli"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27"
strum_macros = "0.27"
reqwest = { version = "0.12", features = ["blocking", "json"] }
graphql_client = "0.14"
rayon = "1.5"
sequent-core = { path="../sequent-core", features = ["keycloak", "probe", "reports","default_features"] }
windmill = { path="../windmill" }
strand = { path="../strand" }
immudb-rs = { path="../immudb-rs" }
electoral-log = { path="../electoral-log" }

uuid = { version = "1.5", features = ["v4", "fast-rng"] }
fake = { version = "4", features = ["derive"] }
csv = "1.1"
rand = "0.9"
chrono = "0.4"
tokio = { version = "1.38", features = ["full"] }
tokio-postgres = "0.7"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1", "serde"] }

hex = "0.4"
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"

colored = "3.0"

url = "2"

# logging
tracing = "0.1"

[[bin]]
name = "step-cli"
path = "src/main.rs"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
private_interfaces = "warn"
private_bounds = "warn"
unnameable_types = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
unwrap_used = "deny"
panic = "deny"
shadow_unrelated = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
missing_const_for_fn = "deny"
future_not_send = "deny"
arithmetic_side_effects = "deny"
suspicious = "deny"
complexity = "deny"
style = "deny"
perf = "deny"
pedantic = "deny"