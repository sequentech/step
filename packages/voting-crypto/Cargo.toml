[package]
name = "voting-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
ed25519 = { version = "3.0", features = ["pkcs8", "alloc"] }
vsc = { workspace = true }
wbraid = { workspace = true, default-features = false, features = ["core"] }
anyhow = "1.0"
base64 = "0.22"
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.11"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
serde_json = "1.0"
