[package]
name = "messaging-webhooks"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The one public entrypoint for messaging provider callbacks: relays them, signed, to harvest"

[dependencies]
messaging = { path = "../messaging" }
sequent-core = { path = "../sequent-core", features = ["default_features", "log"] }
anyhow = { workspace = true }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
rocket = { version = "0.5", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
tracing-tree = "0.4"

[dev-dependencies]
# The loopback stand-in for harvest.
messaging = { path = "../messaging", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"
