# Real PDF tests launch Chrome, including inside Rayon batches. Keep ordinary
# `cargo test` from multiplying both pools by the host CPU count on CI runners.
# Explicit environment settings still override these development defaults.
[env]
RUST_TEST_THREADS = "2"
RAYON_NUM_THREADS = "2"
