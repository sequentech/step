[workspace]
resolver = "2"

members = [
    "strand",
    "braid",
    "b4",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"


[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"