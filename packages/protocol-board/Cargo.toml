[package]
name = "protocol-board"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "protocol_board"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
voting-crypto = { path = "../voting-crypto" }
wbraid = { workspace = true }
vsc = { workspace = true }
# Only `types`, which needs no features.
sequent-core = { path = "../sequent-core", default-features = false }

anyhow = { workspace = true }
base64 = "0.22"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
strum = "0.27"
strum_macros = "0.27"
toml = "0.8"
uuid = "1.5"
# `spawn_blocking` and the current runtime handle, for the board I/O bridge.
tokio = { version = "1.40", features = ["rt", "time", "sync"], optional = true }
tracing = "0.1"

async-trait = "0.1"
wasm-bindgen = { version = "=0.2.128", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = ["native"]
native = ["wbraid/native", "dep:tokio"]
browser = ["wbraid/wasm", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen"]

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros"] }
uuid = { version = "1.5", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
