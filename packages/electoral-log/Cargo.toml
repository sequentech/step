[package]
name = "electoral-log"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.5", features = ["v4"] }
voting-crypto = { path = "../voting-crypto" }
clap = { version = "4.0", features = ["derive"] }
wbraid-b4 = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json"] }
borsh = { version = "1.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1.38", features = ["test-util", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# logging
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-attributes = "0.1"
tracing-subscriber = "0.3"
tracing-tree = "0.4"

[features]
wbraid-storage-tests = []

[dev-dependencies]
tokio = { version = "1.38", features = ["process"] }
tempfile = "3"
serial_test = "3.2"

[[test]]
name = "board_storage"
required-features = ["wbraid-storage-tests"]
