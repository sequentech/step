[package]
name = "electoral-log"
version = "0.1.0"
edition = "2021"

[dependencies]
voting-crypto = { path = "../voting-crypto" }
trellis = { path = "../trellis", optional = true }
sha2 = "0.10"
clap = { version = "4.0", features = ["derive"], optional = true }
async-trait = { version = "0.1", optional = true }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"], optional = true }
futures-util = { version = "0.3", optional = true }
openssl = { version = "0.10", optional = true }
postgres-openssl = { version = "0.5", optional = true }
borsh = { version = "1.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1.38", features = ["test-util", "rt-multi-thread", "macros", "sync"], optional = true }
hex = "0.4"
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# logging
log = "0.4"
tracing = "0.1"
tracing-log = { version = "0.2", optional = true }
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
tracing-tree = { version = "0.4", optional = true }

[[example]]
name = "load_test"
test = true
required-features = ["native"]

[[example]]
name = "ballot_box_load"
test = true
required-features = ["native"]

[dev-dependencies]

# Pure canonical statements and verification also run in the browser.
[features]
default = ["native"]
native = ["dep:trellis", "dep:clap", "dep:async-trait", "dep:deadpool-postgres", "dep:tokio-postgres", "dep:futures-util", "dep:openssl", "dep:postgres-openssl", "dep:tokio", "dep:tracing-log", "dep:tracing-subscriber", "dep:tracing-tree", "uuid/v4"]

[[bin]]
name = "electoral-log-admin"
path = "src/bin/electoral-log-admin.rs"
required-features = ["native"]
