[package]
name = "electoral-log"
version = "0.1.0"
edition = "2021"

[dependencies]
trellis = { path = "../trellis" }
sha2 = "0.11"
clap = { version = "4.0", features = ["derive"] }
async-trait = "0.1"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tokio-postgres = "0.7"
openssl = "0.10"
postgres-openssl = "0.5"
borsh = { version = "1.5", features = ["derive"] }
anyhow = "1.0"
strand = { path="../strand" }
serde = { version = "1.0", features = ["derive"] }
strum = "0.28"
strum_macros = "0.28"
tokio = { version = "1.38", features = ["test-util", "rt-multi-thread", "macros", "sync"] }
hex = "0.4"
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }

# logging 
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-attributes = "0.1"
tracing-subscriber = "0.3"
tracing-tree = "0.4"

[[example]]
name = "load_test"
test = true

[[example]]
name = "ballot_box_load"
test = true

[dev-dependencies]
