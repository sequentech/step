server {
    listen 8000;
    root   /usr/share/nginx/html;
    index  index.html;

    # Disable sendfile as it can cause issues in containerized environments with large files
    sendfile off;

    # Handle SPA routing: serve index.html for unrecognized paths
    location / {
        try_files $uri $uri/ /index.html$is_args$args;
    }

    # Correct mime type for webmanifest
    location ~* \.webmanifest$ {
        types { } default_type "application/manifest+json";
    }

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # # Security headers (Might be set by the k8s ingress instead)
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-XSS-Protection "1; mode=block" always;
    # add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Enable when using HTTPS

    # Additional configurations...
}