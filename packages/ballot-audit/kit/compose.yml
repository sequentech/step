# Restored copies for the offline ballot audit. Start and stop it with
# audit-env, which sets the variables below.
#
# Every service shares the network namespace of `tools`, which has no network:
# the copies reach each other only on 127.0.0.1, and nothing reaches outside.
# The tools refuse addresses that are not loopback.

name: ${AUDIT_PROJECT:-ballot-audit}

x-copy: &copy
  network_mode: service:tools
  depends_on: [tools]
  restart: "no"

services:
  tools:
    image: ${AUDIT_IMAGE:-ballot-audit:local}
    network_mode: none
    user: "${AUDIT_UID:-1000}:${AUDIT_GID:-1000}"
    command: ["sleep", "infinity"]
    init: true
    working_dir: /audit/results
    volumes:
      - ${AUDIT_DIR:?}/private:/audit/private
      - ${AUDIT_DIR:?}/results:/audit/results
      - b3-blobs:/audit/b3-blobs

  hasura-db:
    <<: *copy
    image: postgres:${AUDIT_POSTGRES_VERSION:?}
    command: ["postgres", "-p", "55432", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?}
    volumes:
      - ${AUDIT_DIR:?}/backups:/backups:ro
      - hasura-data:/var/lib/postgresql/data

  keycloak-db:
    <<: *copy
    image: postgres:${AUDIT_POSTGRES_VERSION:?}
    command: ["postgres", "-p", "55433", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?}
    volumes:
      - ${AUDIT_DIR:?}/backups:/backups:ro
      - keycloak-data:/var/lib/postgresql/data

  b3-db:
    <<: *copy
    image: postgres:${AUDIT_POSTGRES_VERSION:?}
    command: ["postgres", "-p", "55434", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?}
    volumes:
      - ${AUDIT_DIR:?}/backups:/backups:ro
      - b3-data:/var/lib/postgresql/data

  immudb:
    <<: *copy
    image: codenotary/immudb:${AUDIT_IMMUDB_VERSION:?}
    environment:
      IMMUDB_ADDRESS: 127.0.0.1
      IMMUDB_PORT: "43322"
      IMMUDB_PGSQL_SERVER: "false"
      IMMUDB_METRICS_SERVER: "false"
      IMMUDB_WEB_SERVER: "false"
      # The copy keeps the users of the source. A new admin password lets
      # audit-env make the read-only user without the password of the source.
      IMMUDB_ADMIN_PASSWORD: ${AUDIT_IMMUDB_ADMIN_PASSWORD:?}
      IMMUDB_FORCE_ADMIN_PASSWORD: "true"
    volumes:
      - immudb-data:/var/lib/immudb

  b3:
    <<: *copy
    image: ${AUDIT_IMAGE:-ballot-audit:local}
    user: "${AUDIT_UID:-1000}:${AUDIT_GID:-1000}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -n "$$(ls -A /audit/b3-blobs)" ]; then export B3_BLOB_ROOT=/audit/b3-blobs; fi
        exec b3-server
    environment:
      B3_PG_HOST: 127.0.0.1
      B3_PG_PORT: "55434"
      B3_PG_USER: postgres
      B3_PG_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?}
      B3_PG_DATABASE: b3_copy
      B3_BIND: 127.0.0.1:50051
    volumes:
      - b3-blobs:/audit/b3-blobs

  # One-shot jobs that unpack the ImmuDB data directory and the B3 blob
  # directory into their volumes.
  unpack:
    image: ${AUDIT_IMAGE:-ballot-audit:local}
    network_mode: none
    user: "0:0"
    profiles: ["unpack"]
    volumes:
      - ${AUDIT_DIR:?}/backups:/backups:ro
      - immudb-data:/unpack/immudb
      - b3-blobs:/unpack/b3-blobs

volumes:
  hasura-data:
  keycloak-data:
  b3-data:
  immudb-data:
  b3-blobs:
