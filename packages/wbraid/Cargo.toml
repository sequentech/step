[workspace]
# members = ["crates/b4", "crates/braid", "crates/braid_b5", "crates/strand", "crates/vsc", "crates/b5"]
members = ["crates/braid_b5", "crates/vsc", "crates/b5", "crates/rnk", "crates/strand"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"





