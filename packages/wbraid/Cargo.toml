[workspace]
members = ["crates/braid", "crates/vsc", "crates/b4", "crates/rnk", "crates/v2v"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"





