[workspace]
members = ["crates/b4", "crates/braid-wasm", "crates/braid", "crates/strand"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
