[package]
name = "braid"
version = "0.4.0"
authors = [
  "David Ruescas <david@sequentech.io>",
  "Eduardo Robles <edu@sequentech.io>"
]
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
rand = "0.9"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

strand = { path="../strand", optional = true }
b3 = { path="../b3", default-features = false, optional = true }
crepe = "0.1"
strum = { version = "0.27", features = ["derive"] }

# Native-only dependencies
rayon = { version = "1.5", optional = true }
tonic = { version = "0.13", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tokio = { version = "1.40", optional = true }

# WASM-only dependencies  
wasm-bindgen-rayon = {version = "1.0", features = ["no-bundler"], optional = true}
wasm-bindgen = {version = "=0.2", optional = true}
tracing-wasm = {version="0.2", optional = true}
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json"] }
indexed_db_futures = { version = "0.5", optional = true }

# Shared dependencies (used in both native and WASM)
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
serde = "1.0"
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-attributes = "0.1"
rustc-hash = "2.0"
cfg-if = "1.0"

# Native-only shared dependencies
colored = { version = "3.0", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-tree = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
anyhow = "1.0"
thiserror = "2.0"
reedline-repl-rs = { version = "1.0", optional = true }
ascii_table = { version = "4.0", optional = true }
async-trait = "0.1"

# profile memory (native only)
tikv-jemallocator = {version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"], optional = true }

[dev-dependencies]
criterion = {version = "0.5", features=["html_reports"]}
serial_test = "3.2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default feature for native builds (server mode)
default = ["native"]

# Native build with gRPC, filesystem, SQLite  
native = [
    "dep:strand",
    "strand/rayon", 
    "dep:rayon",
    "dep:tonic",
    "dep:rusqlite",
    "dep:tokio",
    "dep:b3",
    "b3/native",
    "b3/client",
    "dep:colored",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:tracing-tree",
    "dep:toml",
    "dep:reedline-repl-rs",
    "dep:ascii_table"
]

# WASM build with HTTP bulletin board and IndexedDB
wasm-core = [
    "dep:strand",
    "strand/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-rayon",
    "dep:rayon",
    "dep:tracing-wasm",
    "dep:reqwest",
    "dep:indexed_db_futures",
    "dep:b3",
    "b3/wasm-core"
]

# Cryptography backend options (strand features)
# wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-rayon", "dep:tracing-wasm", "instant/wasm-bindgen"]
fips_core = ["strand/fips_core"]
fips_full = ["strand/fips_full"]
rug = ["strand/rug"]

# Memory profiling (native only)
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]
