[package]
name = "braid"
version = "0.6.0"
authors = [
  "David Ruescas <david@sequentech.io>",
  "Eduardo Robles <edu@sequentech.io>"
]
edition = "2021"
license = "AGPL-3.0-only"
# Legacy binaries under src/bin depend on the pre-v0.6 protocol/native stack and
# are retired from the build for M2 (files kept on disk for reference; M3 rebuilds
# `dbg`). Disable auto-discovery so src/bin/* is not compiled.
autobins = false

[dependencies]
rand = "0.9"

vsc = { path="../vsc", optional = true }
b4 = { path="../b4", optional = true, default-features = false }
crepe = "0.1"
ascent = { version = "0.8", default-features = false, features = ["wasm-bindgen"] }
enum_dispatch = "0.3.13"
strum = { version = "0.27", features = ["derive"] }

# Native-only dependencies
rayon = { version = "1.5", optional = true }
tonic = { version = "0.13", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"], optional = true }
tokio = { version = "1.40", optional = true }
aws-config = { version = "1.5", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.52", optional = true }
chrono = { version = "0.4", optional = true }

# WASM-only dependencies  
# Pinned exactly: the wasm-bindgen crate schema must match the installed
# wasm-bindgen-cli version. This also transitively constrains js-sys/web-sys.
wasm-bindgen = { version = "=0.2.123", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbTransactionMode",
    "IdbCursorWithValue",
    "IdbVersionChangeEvent",
    # OPFS (Origin Private File System) support
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    # localStorage for OPFS metadata cache
    "Storage",
] }
tracing-wasm = { version = "0.2", optional = true }
indexed_db_futures = { version = "0.5", optional = true }
futures-channel = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
bincode = { version = "1.3", optional = true }

# Shared optional dependencies (used in both native and WASM but with different features)
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

# Shared dependencies (used in both native and WASM)
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
serde = "1.0"
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-attributes = "0.1"
rustc-hash = "2.0"
cfg-if = "1.0"

# Native-only shared dependencies
colored = { version = "3.0", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-tree = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
anyhow = "1.0"
thiserror = "2.0"
reedline-repl-rs = { version = "1.0", optional = true }
ascii_table = { version = "4.0", optional = true }
async-trait = "0.1"

# profile memory (native only)
tikv-jemallocator = {version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"], optional = true }

# Native-only dev-deps (criterion pulls rayon and refuses to build for wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = {version = "0.5", features=["html_reports"]}
serial_test = "3.2"

# wasm-only: the headless-browser test harness for the IndexedDB backend (M3).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default feature for native builds (server mode)
default = ["native"]

# Native build with gRPC, filesystem, SQLite  
native = [
    "dep:vsc",
    "vsc/server",
    "dep:rayon",
    "dep:tonic",
    "dep:rusqlite",
    "dep:sqlx",
    "dep:tokio",
    "dep:b4",
    "b4/native",
    "dep:colored",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:tracing-tree",
    "dep:toml",
    "dep:reedline-repl-rs",
    "dep:ascii_table",
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:reqwest",
    "dep:chrono",
]

# Base wasm build: bindings, IndexedDB persistence, browser I/O. Deliberately
# EXCLUDES `wasm-bindgen-rayon` (the crypto Web Worker thread pool) because it is
# the only dependency that forces `+atomics` — which in turn forces a
# shared-memory build and a multithreaded async executor. Tests build against
# `wasm-core` so they run in a plain headless browser (no atomics, no
# SharedArrayBuffer, no COOP/COEP, no build-std). The parallel crypto add-on
# lives in the `wasm` feature below.
wasm-core = [
    "dep:vsc",
    "dep:toml",
    "vsc/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:rayon",
    "dep:tracing-wasm",
    "dep:indexed_db_futures",
    "dep:futures-channel",
    "dep:console_error_panic_hook",
    "dep:serde-wasm-bindgen",
    "dep:bincode",
    "dep:b4",
    "b4/wasm-core",
]

# Full browser build = wasm-core + the `wasm-bindgen-rayon` thread pool for
# parallel crypto (requires the atomics + shared-memory toolchain; see
# build-wasm.ps1). This is what real browser trustees ship with.
wasm = ["wasm-core", "dep:wasm-bindgen-rayon"]

# Memory profiling (native only)
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]
