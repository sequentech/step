[package]
name = "vsc"
version = "0.6.2"
license = "Apache-2.0"
edition = "2024"

[dependencies]
# Elliptic Curves
curve25519-dalek = {version = "5.0.0-pre.6", features = ["rand_core", "digest", "precomputed-tables"] }
# curve25519-dalek = {version = "4.1.3", features = ["rand_core", "digest", "precomputed-tables"] }

elliptic-curve = { version = "0.14.0-rc.31" }
generic-array = "=0.14.7"
p256 = { version = "0.14.0-rc.9", features = ["arithmetic", "std", "hash2curve", "group-digest"] }
# p256 = { version = "0.13.2", features = ["arithmetic", "std", "hash2curve"] }

# hashing
sha3 = "0.11"

# rng
rand = { version = "0.10.1", features = ["std"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
# getrandom 0.3.4 is used by some dependencies, need js feature for WASM
getrandom_v03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

# signatures
ed25519-dalek = {version = "3.0.0-pre.6", features=["rand_core"] }
# ed25519-dalek = {version = "2.2.0", features=["rand_core"] }

# encoding
base64 = "0.22"

# misc
thiserror = "1.0.50"
rayon = { version = "1.10.0", optional = true }
cfg-if = "1.0.1"

# serialization
vser_derive = { path = "./macros/vser_derive" }
serde = { version = "1.0.219", features=["derive"], optional = true}

hex = "0.4.3"
custom_warning_macro = { path = "../macros/custom_warning_macro" }

# symmetric encryption
chacha20poly1305 = {version = "0.11.0-rc.3", features=["getrandom"] }
aead = { version = "0.6.0-rc.10", features=["rand_core"] }

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"
test = true
name = "cryptography"

[features]
default = ["client", "server"]
server = ["dep:rayon"]
client = []
# Fold strategy for the shuffle's wide parallel products (see
# `zkp::shuffle::fold_values`). Off: rayon's recursive `reduce`, the historical
# behaviour. On: `bounded_combine`, chunked plain loops whose stack use is
# bounded by a small constant independent of input size and scheduling. The
# folded values -- and therefore the proofs -- are byte-identical either way;
# the switch exists so the two implementations can be benchmarked against each
# other.
bounded-combine = []
custom-warnings = ["custom_warning_macro/on"]
serde = ["dep:serde"]
long_running_tests = []
wasm = []

[[bench]]
name = "large_vector"
harness = true

[[bench]]
name = "shuffle"
harness = true

[dev-dependencies]
serde = { version = "1.0.219", features=["derive"] }
bincode = { version = "2.0.1", features=["serde"] }
wasm-bindgen-test = "0.3"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
# Public docs must not link to items absent from the public docs build.
private_intra_doc_links = "deny"
# Bare generics like `Vec<T>` parse as HTML tags and vanish from rendered docs.
invalid_html_tags = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
private_interfaces = "warn"
private_bounds = "warn"
unnameable_types = "warn"
# https://github.com/taiki-e/cargo-llvm-cov?tab=readme-ov-file#exclude-code-from-coverage
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
unwrap_used = "deny"
panic = "deny"
shadow_unrelated = "deny"
print_stdout = "deny"
print_stderr = "deny"
future_not_send = "deny"
arithmetic_side_effects = "deny"
# groups, not a single lint
suspicious = "deny"
complexity = "deny"
style = "deny"
perf = "deny"
pedantic = "deny"
# TODO
# this probably should be on
indexing_slicing = "warn"
# We set this to allow as it is unclear whether we really want this
missing_const_for_fn = "allow"