[package]
name = "b4"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "b4"
path = "src/main.rs"

# NOTE: the `monitor` TUI binary (src/monitor.rs) is retired for v0.6 — it
# depended on the board/message metadata b4 no longer stores (§8.1). Kept on disk
# as reference; an operator monitor is a future diagnostics concern (§12).

[features]
default = ["native"]

native = ["dep:tokio", "dep:sqlx", "dep:aws-config", "dep:aws-sdk-s3", "dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]

tokio = { workspace = true, optional = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

base64 = "0.22"

# Web framework
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"], optional = true }

# S3
aws-config = { version = "1.5", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.52", optional = true }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

