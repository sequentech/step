# missing_panics_doc = "deny"
# doc_markdown = "deny"
# unwrap_used = "deny"
# panic = "deny"
# shadow_unrelated = "deny"
# print_stdout = "deny"
# print_stderr = "deny"
# future_not_send = "deny"
# arithmetic_side_effects = "deny"
# groups, not a single lint
