[package]
name = "vcompat"
version = "0.1.0"
edition = "2021"

# Verificatum wire-format compatibility layer. Kept as small and auditable as
# possible: these bytes must match VMN exactly. The only runtime dependency is
# a SHA-2 implementation, which VMN's random oracles are built from (VMNV 5.1)
# and which is not something to hand-roll. `hex` is dev-only, for test vectors.

[dependencies]
sha2 = "0.11"
# Modular arithmetic for deriving independent generators (VMNV 6.8): Legendre
# symbols and square roots mod p. Correctness is pinned against VMN's own
# `bas.h` output, and the values derived are public generators.
num-bigint = "0.4"

[dev-dependencies]
num-traits = "0.2"
hex = "0.4"
