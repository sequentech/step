[package]
name = "b3"
version = "0.1.0"
authors = [
  "David Ruescas <david@sequentech.io>",
  "Eduardo Robles <edu@sequentech.io>"
]
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
strand = { path="../strand", optional = true }
borsh = { version = "1.5", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
anyhow = "1.0"

# Native-only dependencies
rayon = { version = "1.5", optional = true }
futures = { version = "0.3", optional = true }
config = { version = "0.15", optional = true }
tonic = { version = "0.13", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1.38", features = ["full"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
bb8-postgres = { version = "0.9", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }

# WASM-only dependencies
wasm-bindgen = { version = "=0.2", optional = true }

# Shared dependencies (used in both native and WASM)
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-attributes = "0.1"
tracing-subscriber = "0.3"
tracing-tree = "0.4"

cfg-if = "1.0"
hex = "0.4"
base64 = "0.22"
serde = "1.0"
toml = "0.8"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default feature for native builds
default = ["native"]

# Native build with gRPC, PostgreSQL client/server
native = [
    "dep:strand",
    "strand/rayon",
    "dep:rayon",
    "dep:tonic",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:bb8-postgres",
    "dep:clap"
]

# WASM build (just message types, no I/O)
wasm-core = [
    "dep:strand",
    "strand/wasm",
    "dep:wasm-bindgen"
]

# Existing features (native-only)
sqlcopy = ["native", "dep:futures"]
client = ["native"]
server = ["client", "dep:config"]

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
serial_test = "3.2"
