[package]
name = "hsm-service"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The platform's only path to its HSM or KMS keys: a private-network service with per-key, per-purpose authorization and a hash-chained audit log."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hsm-service"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["alloc", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
cryptoki = "0.12"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
p256 = { version = "0.11", features = ["ecdsa", "ecdh"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hsm-client = { path = "../hsm-client" }
voting-crypto = { path = "../voting-crypto" }

[lints.rust]
unsafe_code = "forbid"
