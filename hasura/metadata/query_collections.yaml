- name: allowed-queries
  definition:
      queries:
          - name: IvrIsPhoneBlacklisted
            query: |
                query IvrIsPhoneBlacklisted ($phone: String!, $event_id: uuid!) {
                  blacklist: sequent_backend_phone_blacklist_aggregate(where: {phone_e164:{_eq:$phone},_or:[{election_event_id:{_eq:$event_id}},{election_event_id:{_is_null:true}}]}, limit: 1) {
                    aggregate {
                      count
                    }
                  }
                }
          - name: IvrGetElectionEventStatus
            query: |
                query IvrGetElectionEventStatus ($event_id: uuid!) {
                  event: sequent_backend_election_event_by_pk(id: $event_id) {
                    status
                  }
                }
