table:
    name: staff_crl
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - issuer_id
              - issuer_fingerprint
              - url
              - der
              - this_update
              - next_update
              - fetched_at
              - last_ok_at
              - status
              - last_error
              - created_at
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
      role: signing-certificates-read
