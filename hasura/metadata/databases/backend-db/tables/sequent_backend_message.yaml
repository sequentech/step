table:
    name: message
    schema: sequent_backend
# The delivery ledger. Provider ids, billing and the destination digest are
# for the backend; administrators read states through
# `messaging-config-read`, with the logical key that groups a message's
# attempts (an id such as `keycloak:otp:<code id>`, never content).
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          columns:
              - accepted_at
              - account_id
              - attempt
              - channel
              - created_at
              - delivered_at
              - direction
              - election_event_id
              - error
              - failure
              - failed_at
              - id
              - language
              - logical_key
              - masked_destination
              - purpose
              - state
              - template_alias
              - tenant_id
              - updated_at
              - voter_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          allow_aggregations: true
      role: messaging-config-read
    - comment: ""
      permission:
          columns:
              - accepted_at
              - account_id
              - attempt
              - channel
              - created_at
              - delivered_at
              - direction
              - election_event_id
              - error
              - failure
              - failed_at
              - id
              - language
              - masked_destination
              - purpose
              - state
              - template_alias
              - tenant_id
              - updated_at
              - voter_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          allow_aggregations: true
      role: notification-read
    - comment: ""
      permission:
          columns:
              - accepted_at
              - account_id
              - attempt
              - billing
              - channel
              - created_at
              - delivered_at
              - destination_country
              - destination_digest
              - direction
              - election_event_id
              - error
              - failure
              - failed_at
              - id
              - language
              - logical_key
              - masked_destination
              - provider_message_id
              - purpose
              - state
              - template_alias
              - tenant_id
              - updated_at
              - voter_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      role: service-account
