table:
    name: applications
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - permission_label:
                              _is_null: true
                        - permission_label:
                              _in: X-Hasura-Permission-Labels
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          columns:
              - applicant_id
              - status
              - verification_type
              - annotations
              - applicant_data
              - labels
              - created_at
              - updated_at
              - area_id
              - election_event_id
              - id
              - tenant_id
              - permission_label
      role: admin-user
