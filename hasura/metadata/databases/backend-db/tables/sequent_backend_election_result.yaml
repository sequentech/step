table:
    name: election_result
    schema: sequent_backend
insert_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - result_eml_signature
        - annotations
        - labels
        - statistics
        - result_eml
        - created_at
        - last_updated_at
        - area_id
        - election_event_id
        - election_id
        - id
        - tenant_id
    role: service-account
select_permissions:
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - result_eml_signature
        - annotations
        - labels
        - statistics
        - result_eml
        - created_at
        - last_updated_at
        - area_id
        - election_event_id
        - election_id
        - id
        - tenant_id
        filter: {}
    role: service-account
-   comment: ''
    permission:
        columns:
        - result_eml_signature
        - annotations
        - labels
        - statistics
        - result_eml
        - created_at
        - last_updated_at
        - area_id
        - election_event_id
        - election_id
        - id
        - tenant_id
        filter:
            _and:
            -   _and:
                -   area_id:
                        _eq: X-Hasura-Area-Id
                -   tenant_id:
                        _eq: X-Hasura-Tenant-Id
            -   election_event_id:
                    _eq: X-Hasura-Election-Event-Id
            -   lifecycle_access:
                    voter_allowed:
                        _eq: true
    role: user
update_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - result_eml_signature
        - annotations
        - labels
        - statistics
        - result_eml
        - created_at
        - last_updated_at
        - area_id
        - election_event_id
        - election_id
        - id
        - tenant_id
        filter: {}
    role: service-account
delete_permissions:
-   comment: ''
    permission:
        filter: {}
    role: service-account
object_relationships:
-   name: lifecycle_access
    using:
        manual_configuration:
            remote_table:
                schema: sequent_backend
                name: election_lifecycle_access
            column_mapping:
                tenant_id: tenant_id
                election_event_id: election_event_id
            insertion_order: null
