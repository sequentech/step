table:
    name: election_result
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - result_eml_signature
              - annotations
              - labels
              - statistics
              - result_eml
              - created_at
              - last_updated_at
              - area_id
              - election_event_id
              - election_id
              - id
              - tenant_id
      role: service-account
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - result_eml_signature
              - annotations
              - labels
              - statistics
              - result_eml
              - created_at
              - last_updated_at
              - area_id
              - election_event_id
              - election_id
              - id
              - tenant_id
          filter:
              _or:
                  - election_event_id:
                        _is_null: true
                  - election_event:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _in: X-Hasura-Permission-Labels
      role: admin-user
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - result_eml_signature
              - annotations
              - labels
              - statistics
              - result_eml
              - created_at
              - last_updated_at
              - area_id
              - election_event_id
              - election_id
              - id
              - tenant_id
          filter: {}
      role: service-account
    - comment: ""
      permission:
          columns:
              - result_eml_signature
              - annotations
              - labels
              - statistics
              - result_eml
              - created_at
              - last_updated_at
              - area_id
              - election_event_id
              - election_id
              - id
              - tenant_id
          filter:
              _and:
                  - area_id:
                        _eq: X-Hasura-Area-Id
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
      role: user
update_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - result_eml_signature
              - annotations
              - labels
              - statistics
              - result_eml
              - created_at
              - last_updated_at
              - area_id
              - election_event_id
              - election_id
              - id
              - tenant_id
          filter: {}
      role: service-account
delete_permissions:
    - comment: ""
      permission:
          filter: {}
      role: service-account
