table:
    name: document
    schema: sequent_backend
insert_permissions:
-   comment: ''
    permission:
        check:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
    role: document-write
-   comment: ''
    permission:
        check: {}
        columns:
        - annotations
        - created_at
        - election_event_id
        - id
        - is_public
        - labels
        - last_updated_at
        - media_type
        - name
        - size
        - tenant_id
    role: service-account
select_permissions:
-   comment: ''
    permission:
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        allow_aggregations: true
    role: document-read
-   comment: ''
    permission:
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        allow_aggregations: true
    role: document-write
-   comment: ''
    permission:
        columns:
        - annotations
        - created_at
        - election_event_id
        - id
        - is_public
        - labels
        - last_updated_at
        - media_type
        - name
        - size
        - tenant_id
        filter: {}
        allow_aggregations: true
    role: service-account
-   comment: ''
    permission:
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        allow_aggregations: true
    role: trustee-ceremony
-   comment: ''
    permission:
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            _and:
            -   tenant_id:
                    _eq: X-Hasura-Tenant-Id
                is_public:
                    _eq: true
            -   election_event_id:
                    _eq: X-Hasura-Election-Event-Id
            -   lifecycle_access:
                    voter_allowed:
                        _eq: true
        allow_aggregations: false
    role: user
update_permissions:
-   permission:
        columns:
        - is_public
        - media_type
        - name
        - size
        - annotations
        - labels
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            _and:
            -   tenant_id:
                    _eq: X-Hasura-Tenant-Id
            -   _or:
                -   annotations:
                        _is_null: true
                -   _not:
                        annotations:
                            _contains:
                                access:
                                    voter_secret_attributes: true
        check:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: document-write
-   comment: ''
    permission:
        columns:
        - annotations
        - created_at
        - election_event_id
        - id
        - is_public
        - labels
        - last_updated_at
        - media_type
        - name
        - size
        - tenant_id
        filter: {}
        check: {}
    role: service-account
delete_permissions:
-   permission:
        filter:
            _and:
            -   tenant_id:
                    _eq: X-Hasura-Tenant-Id
            -   _or:
                -   annotations:
                        _is_null: true
                -   _not:
                        annotations:
                            _contains:
                                access:
                                    voter_secret_attributes: true
    role: document-write
-   comment: ''
    permission:
        filter: {}
    role: service-account
object_relationships:
-   name: lifecycle_access
    using:
        manual_configuration:
            remote_table:
                schema: sequent_backend
                name: election_lifecycle_access
            column_mapping:
                tenant_id: tenant_id
                election_event_id: election_event_id
            insertion_order: null
