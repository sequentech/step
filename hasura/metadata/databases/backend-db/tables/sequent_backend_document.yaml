table:
    name: document
    schema: sequent_backend
insert_permissions:
    - role: admin-user
      permission:
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
      comment: ""
    - role: document-write
      permission:
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          columns:
              - is_public
              - media_type
              - name
              - size
              - annotations
              - labels
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
      comment: ""
    - role: service-account
      permission:
          check: {}
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
      comment: ""
select_permissions:
    - role: admin-user
      permission:
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      comment: ""
    - role: document-read
      permission:
          columns:
              - is_public
              - media_type
              - name
              - size
              - annotations
              - labels
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      comment: ""
    - role: document-write
      permission:
          columns:
              - is_public
              - media_type
              - name
              - size
              - annotations
              - labels
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      comment: ""
    - role: service-account
      permission:
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
          filter: {}
          allow_aggregations: true
      comment: ""
    - role: user
      permission:
          columns:
              - is_public
              - media_type
              - name
              - size
              - annotations
              - labels
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter: {}
          allow_aggregations: true
      comment: ""
update_permissions:
    - role: admin-user
      permission:
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - annotations:
                              _is_null: true
                        - _not:
                              annotations:
                                  _contains:
                                      access:
                                          voter_secret_attributes: true
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
    - role: document-write
      permission:
          columns:
              - is_public
              - media_type
              - name
              - size
              - annotations
              - labels
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - annotations:
                              _is_null: true
                        - _not:
                              annotations:
                                  _contains:
                                      access:
                                          voter_secret_attributes: true
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
    - role: service-account
      permission:
          columns:
              - annotations
              - created_at
              - election_event_id
              - id
              - is_public
              - labels
              - last_updated_at
              - media_type
              - name
              - size
              - tenant_id
          filter: {}
          check: {}
      comment: ""
delete_permissions:
    - role: admin-user
      permission:
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - annotations:
                              _is_null: true
                        - _not:
                              annotations:
                                  _contains:
                                      access:
                                          voter_secret_attributes: true
    - role: document-write
      permission:
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - annotations:
                              _is_null: true
                        - _not:
                              annotations:
                                  _contains:
                                      access:
                                          voter_secret_attributes: true
    - role: service-account
      permission:
          filter: {}
      comment: ""
