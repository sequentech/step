table:
    name: signing_request
    schema: sequent_backend
array_relationships:
    - name: approvals
      using:
          manual_configuration:
              column_mapping:
                  id: request_id
              insertion_order: null
              remote_table:
                  name: signing_approval
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - action
              - election_id
              - area_id
              - code
              - status
              - cancel_reason
              - required
              - requested_by_name
              - requested_by_username
              - created_at
              - expires_at
              - completed_at
              - executed_at
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - action:
                        _eq: approve-configuration
                  - _or:
                        - permission_label:
                              _is_null: true
                        - permission_label:
                              _in: X-Hasura-Permission-Labels
      role: sign-approve-configuration
