table:
    name: message_latest_attempt
    schema: sequent_backend
# The latest attempt of each message (a view on the delivery ledger): the
# drawer's last failure, the Logs filter and the event tab's counts. The same
# safe columns as `message` for `messaging-config-read`; nothing else reads
# it through Hasura, and a view takes no writes.
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          columns:
              - accepted_at
              - account_id
              - attempt
              - channel
              - created_at
              - delivered_at
              - direction
              - election_event_id
              - error
              - failure
              - failed_at
              - id
              - language
              - logical_key
              - masked_destination
              - purpose
              - state
              - template_alias
              - tenant_id
              - updated_at
              - voter_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          allow_aggregations: true
      role: messaging-config-read
