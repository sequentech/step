table:
    name: results_event
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - annotations
              - documents
              - labels
              - name
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
      role: service-account
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - annotations
              - documents
              - labels
              - name
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
      role: admin-user
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - annotations
              - documents
              - labels
              - name
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter: {}
      role: service-account
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - annotations
              - documents
              - labels
              - name
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
      role: tally-results-read
update_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - annotations
              - documents
              - labels
              - name
              - created_at
              - last_updated_at
              - election_event_id
              - id
              - tenant_id
          filter: {}
      role: service-account
