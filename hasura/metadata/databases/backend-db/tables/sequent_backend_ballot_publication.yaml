          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      role: admin-user
    - comment: ""
      permission:
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          columns:
              - election_ids
              - is_generated
              - annotations
              - labels
              - created_by_user_id
              - created_at
              - deleted_at
              - published_at
              - election_event_id
              - election_id
              - id
              - tenant_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      role: publish-write
    - comment: ""
      permission:
          check: {}
          columns:
              - election_ids
              - is_generated
              - annotations
              - labels
              - created_by_user_id
              - created_at
              - deleted_at
              - published_at
              - election_event_id
              - election_id
              - id
