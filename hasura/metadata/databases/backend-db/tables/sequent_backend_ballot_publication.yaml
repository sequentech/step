table:
    name: ballot_publication
    schema: sequent_backend
object_relationships:
    - name: election
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  election_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_id:
                              _is_null: true
                        - election:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          columns:
              - annotations
              - created_at
              - created_by_user_id
              - deleted_at
              - election_event_id
              - election_id
              - election_ids
              - id
              - is_generated
              - labels
              - published_at
              - tenant_id
      role: admin-user
    - comment: ""
