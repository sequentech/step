table:
    name: ballot_style
    schema: sequent_backend
object_relationships:
    - name: ballot_publication
      using:
          manual_configuration:
              column_mapping:
                  tenant_id: tenant_id
                  election_event_id: election_event_id
                  ballot_publication_id: id
              remote_table:
                  name: ballot_publication
                  schema: sequent_backend
    - name: election
      using:
          manual_configuration:
              column_mapping:
                  tenant_id: tenant_id
                  election_event_id: election_event_id
                  election_id: id
              remote_table:
                  name: election
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - election:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _in: X-Hasura-Permission-Labels
          columns:
              - ballot_signature
              - status
              - annotations
              - labels
              - ballot_eml
              - created_at
              - deleted_at
              - last_updated_at
              - area_id
              - ballot_publication_id
              - election_event_id
              - election_id
              - id
              - tenant_id
      role: admin-user
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - election:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _in: X-Hasura-Permission-Labels
          columns:
