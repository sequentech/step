table:
    name: approval_matrix
    schema: sequent_backend
select_permissions:
-   comment: ''
    permission:
        columns:
        - compared_fields
        - created_at
        - created_by
        - created_by_username
        - election_event_id
        - id
        - otherwise
        - rules
        - sha256
        - tenant_id
        - version
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
