table:
    name: results_contest
    schema: sequent_backend
object_relationships:
    - name: election
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  election_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - election:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _in: X-Hasura-Permission-Labels
          columns:
              - annotations
              - explicit_blank_votes
              - explicit_blank_votes_percent
              - implicit_blank_votes
              - implicit_blank_votes_percent
              - total_blank_votes
              - total_blank_votes_percent
              - contest_id
              - counting_algorithm
              - created_at
              - documents
              - election_event_id
              - election_id
              - elegible_census
              - explicit_invalid_votes
              - explicit_invalid_votes_percent
              - id
              - implicit_invalid_votes
              - implicit_invalid_votes_percent
              - labels
              - last_updated_at
              - name
              - results_event_id
              - tenant_id
              - total_auditable_votes
              - total_auditable_votes_percent
              - total_invalid_votes
              - total_invalid_votes_percent
              - total_valid_votes
              - total_valid_votes_percent
              - total_votes
              - total_votes_percent
              - voting_type
      role: admin-user
    - comment: ""
      permission:
          check: {}
          columns:
