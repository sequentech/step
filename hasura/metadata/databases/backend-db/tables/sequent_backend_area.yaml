        - election_event_id
        - id
        - labels
        - last_updated_at
        - name
        - parent_id
        - presentation
        - tenant_id
        - type
        filter:
            _and:
            -   _and:
                -   tenant_id:
                        _eq: X-Hasura-Tenant-Id
                -   id:
                        _eq: X-Hasura-Area-Id
            -   election_event_id:
                    _eq: X-Hasura-Election-Event-Id
            -   lifecycle_access:
                    voter_allowed:
                        _eq: true
    role: user
