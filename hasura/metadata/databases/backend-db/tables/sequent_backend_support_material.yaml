table:
    name: support_material
    schema: sequent_backend
insert_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
    role: service-account
-   comment: ''
    permission:
        check:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
    role: support-material-write
select_permissions:
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter: {}
    role: service-account
-   comment: Publication reviewers can read event support material; editing remains separately authorized.
    permission:
        allow_aggregations: true
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: publish-read
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: support-material-read
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: support-material-write
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            _and:
            -   _and:
                -   tenant_id:
                        _eq: X-Hasura-Tenant-Id
            -   election_event_id:
                    _eq: X-Hasura-Election-Event-Id
            -   lifecycle_access:
                    voter_allowed:
                        _eq: true
    role: user
update_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter: {}
    role: service-account
-   comment: ''
    permission:
        check:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
        columns:
        - is_hidden
        - annotations
        - data
        - labels
        - document_id
        - kind
        - created_at
        - last_updated_at
        - election_event_id
        - id
        - tenant_id
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: support-material-write
delete_permissions:
-   comment: ''
    permission:
        filter: {}
    role: service-account
-   comment: ''
    permission:
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: support-material-write
object_relationships:
-   name: lifecycle_access
    using:
        manual_configuration:
            remote_table:
                schema: sequent_backend
                name: election_lifecycle_access
            column_mapping:
                tenant_id: tenant_id
                election_event_id: election_event_id
            insertion_order: null
