table:
    name: messaging_event_config
    schema: sequent_backend
# Read-only through Hasura: only the `update_event_messaging_config` action
# writes it, after validating it.
select_permissions:
    - comment: ""
      permission:
          columns:
              - config
              - election_event_id
              - tenant_id
              - updated_at
              - updated_by
              - version
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: false
      role: messaging-config-read
