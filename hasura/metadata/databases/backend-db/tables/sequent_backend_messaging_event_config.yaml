table:
    name: messaging_event_config
    schema: sequent_backend
# Read-only through Hasura: only the `update_event_messaging_config` action
# writes it, after validating it.
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          columns:
              - config
              - election_event_id
              - tenant_id
              - updated_at
              - updated_by
              - version
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          allow_aggregations: false
      role: messaging-config-read
