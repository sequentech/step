# A stored bulk send (`SEND_TEMPLATE`, stopped and archived) is what its
# retries render: no role may change or delete it.
update_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - event_processor:
                              _is_null: true
                        - event_processor:
                              _neq: SEND_TEMPLATE
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          columns:
              - created_by
              - event_processor
              - task_id
              - annotations
              - cron_config
              - event_payload
              - labels
              - archived_at
              - created_at
              - stopped_at
              - election_event_id
              - id
              - tenant_id
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - event_processor:
                              _is_null: true
                        - event_processor:
