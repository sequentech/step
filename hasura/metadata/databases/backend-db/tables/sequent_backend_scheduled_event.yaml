table:
    name: scheduled_event
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          columns:
              - created_by
              - event_processor
              - task_id
              - annotations
              - cron_config
              - event_payload
              - labels
              - archived_at
              - created_at
              - stopped_at
              - election_event_id
              - id
              - tenant_id
      role: scheduled-event-create
    - comment: ""
      permission:
          check: {}
          columns:
              - created_by
              - event_processor
              - task_id
              - annotations
              - cron_config
              - event_payload
              - labels
              - created_at
              - stopped_at
              - archived_at
              - election_event_id
              - id
              - tenant_id
      role: service-account
