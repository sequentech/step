table:
    name: tally_session_contest
    schema: sequent_backend
object_relationships:
    - name: election
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  election_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - election:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _in: X-Hasura-Permission-Labels
          columns:
              - session_id
              - annotations
              - labels
              - created_at
              - last_updated_at
              - area_id
              - contest_id
              - election_event_id
              - election_id
              - id
              - tally_session_id
              - tenant_id
      role: admin-user
    - comment: ""
      permission:
          check: {}
          columns:
              - session_id
