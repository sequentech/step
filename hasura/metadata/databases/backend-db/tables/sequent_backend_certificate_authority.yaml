table:
    name: certificate_authority
    schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - id
              - tenant_id
              - election_event_id
              - common_name
              - subject
              - issuer_common_name
              - issuer
              - not_before
              - not_after
              - fingerprint_sha256
              - serial_number
              - pem
              - created_at
      role: service-account
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - common_name
              - subject
              - issuer_common_name
              - issuer
              - not_before
              - not_after
              - fingerprint_sha256
              - serial_number
              - pem
              - created_at
              - purpose
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - purpose:
                        _eq: voter-sign-in
      role: admin-user
