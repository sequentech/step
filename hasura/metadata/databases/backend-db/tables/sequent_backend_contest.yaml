table:
    name: contest
    schema: sequent_backend
object_relationships:
-   name: election
    using:
        manual_configuration:
            column_mapping:
                election_event_id: election_event_id
                election_id: id
                tenant_id: tenant_id
            insertion_order: null
            remote_table:
                name: election
                schema: sequent_backend
-   name: lifecycle_access
    using:
        manual_configuration:
            remote_table:
                schema: sequent_backend
                name: election_lifecycle_access
            column_mapping:
                tenant_id: tenant_id
                election_event_id: election_event_id
            insertion_order: null
array_relationships:
-   name: candidates
    using:
        manual_configuration:
            column_mapping:
                election_event_id: election_event_id
                id: contest_id
                tenant_id: tenant_id
            insertion_order: null
            remote_table:
                name: candidate
                schema: sequent_backend
insert_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - is_acclaimed
        - is_active
        - is_encrypted
        - counting_algorithm
        - voting_type
        - max_votes
        - min_votes
        - winning_candidates_num
        - annotations
        - conditions
        - labels
        - presentation
        - tally_configuration
        - description
        - external_id
        - image_document_id
        - created_at
        - last_updated_at
        - election_event_id
        - election_id
        - id
        - tenant_id
    role: service-account
select_permissions:
-   comment: ''
    permission:
        columns:
        - annotations
        - conditions
        - counting_algorithm
        - created_at
        - description
        - election_event_id
        - election_id
        - id
        - image_document_id
        - is_acclaimed
        - is_active
        - is_encrypted
        - labels
        - last_updated_at
        - max_votes
        - min_votes
        - presentation
        - tally_configuration
        - tenant_id
        - voting_type
        - winning_candidates_num
        filter:
            _and:
            -   tenant_id:
                    _eq: X-Hasura-Tenant-Id
            -   election:
                    _or:
                    -   permission_label:
                            _is_null: true
                    -   permission_label:
                            _in: X-Hasura-Permission-Labels
    role: tally-results-read
