table:
    name: contest
    schema: sequent_backend
object_relationships:
    - name: election
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  election_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election
                  schema: sequent_backend
array_relationships:
    - name: candidates
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  id: contest_id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: candidate
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - election:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
