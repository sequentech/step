table:
    name: signing_approval
    schema: sequent_backend
object_relationships:
    - name: request
      using:
          manual_configuration:
              column_mapping:
                  request_id: id
              insertion_order: null
              remote_table:
                  name: signing_request
                  schema: sequent_backend
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - request_id
              - user_id
              - display_name
              - signed_at
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - request:
                        _and:
                            - action:
                                  _eq: approve-configuration
                            - _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
      role: sign-approve-configuration
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - request_id
              - user_id
              - display_name
              - signed_at
          filter:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - request:
                        _and:
                            - action:
                                  _eq: approve-voter
                            - _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
      role: sign-approve-voter
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - request_id
              - user_id
              - display_name
              - signed_at
          filter:
