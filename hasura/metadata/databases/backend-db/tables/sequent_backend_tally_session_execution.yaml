table:
    name: tally_session_execution
    schema: sequent_backend
object_relationships:
    - name: tally_session
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: election_event_id
                  tally_session_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: tally_session
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - tally_session:
                        _or:
                            - permission_label:
                                  _is_null: true
                            - permission_label:
                                  _contained_in: X-Hasura-Permission-Labels
          columns:
              - annotations
              - created_at
              - current_message_id
              - election_event_id
              - id
              - labels
              - last_updated_at
              - results_event_id
              - session_ids
              - status
              - tally_session_id
              - tenant_id
              - documents
      role: admin-user
    - comment: ""
      permission:
          check: {}
          columns:
              - annotations
