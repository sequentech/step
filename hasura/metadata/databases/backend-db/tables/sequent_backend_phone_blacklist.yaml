table:
    name: phone_blacklist
    schema: sequent_backend
insert_permissions:
    - role: admin-user
      permission:
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          columns:
              - created_at
              - created_by
              - election_event_id
              - id
              - phone_e164
              - reason
              - tenant_id
              - updated_at
      comment: ""
    - role: service-account
      permission:
          check: {}
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
      comment: ""
select_permissions:
    - role: admin-user
      permission:
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      comment: ""
    - role: phone-blacklist-read
      permission:
          columns:
              - election_event_id
              - phone_e164
              - tenant_id
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      comment: ""
    - role: service-account
      permission:
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
          filter: {}
      comment: ""
update_permissions:
    - role: admin-user
      permission:
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          check:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      comment: ""
    - role: service-account
      permission:
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
          filter: {}
          check: {}
      comment: ""
delete_permissions:
    - role: admin-user
      permission:
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      comment: ""
    - role: service-account
      permission:
          filter: {}
      comment: ""
