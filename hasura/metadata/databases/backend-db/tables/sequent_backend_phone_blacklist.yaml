table:
    name: phone_blacklist
    schema: sequent_backend
object_relationships:
    - name: election_event
      using:
          manual_configuration:
              column_mapping:
                  election_event_id: id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: election_event
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - election_event_id:
                              _is_null: true
                        - election_event:
                              _or:
                                  - permission_label:
                                        _is_null: true
                                  - permission_label:
                                        _in: X-Hasura-Permission-Labels
          columns:
              - created_at
              - created_by
              - election_event_id
              - id
              - phone_e164
              - reason
              - tenant_id
              - updated_at
      role: admin-user
    - comment: ""
      permission:
          check: {}
          columns:
              - phone_e164
              - reason
              - created_at
              - created_by
              - election_event_id
              - id
              - tenant_id
              - updated_at
      role: service-account
