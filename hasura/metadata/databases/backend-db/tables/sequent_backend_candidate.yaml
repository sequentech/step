table:
    name: candidate
    schema: sequent_backend
object_relationships:
    - name: contest
      using:
          manual_configuration:
              column_mapping:
                  contest_id: id
                  election_event_id: election_event_id
                  tenant_id: tenant_id
              insertion_order: null
              remote_table:
                  name: contest
                  schema: sequent_backend
insert_permissions:
    - comment: ""
      permission:
          check:
              _and:
                  - tenant_id:
                        _eq: X-Hasura-Tenant-Id
                  - _or:
                        - contest_id:
                              _is_null: true
                        - contest:
                              election:
                                  _or:
                                      - permission_label:
                                            _is_null: true
                                      - permission_label:
                                            _in: X-Hasura-Permission-Labels
          columns:
              - alias
              - annotations
              - contest_id
              - created_at
              - description
              - election_event_id
              - id
              - image_document_id
              - is_public
              - labels
              - last_updated_at
              - name
              - presentation
              - tenant_id
              - type
      role: admin-user
