table:
    name: candidate
    schema: sequent_backend
object_relationships:
-   name: contest
    using:
        manual_configuration:
            column_mapping:
                contest_id: id
                election_event_id: election_event_id
                tenant_id: tenant_id
            insertion_order: null
            remote_table:
                name: contest
                schema: sequent_backend
-   name: lifecycle_access
    using:
        manual_configuration:
            remote_table:
                schema: sequent_backend
                name: election_lifecycle_access
            column_mapping:
                tenant_id: tenant_id
                election_event_id: election_event_id
            insertion_order: null
insert_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - annotations
        - contest_id
        - created_at
        - description
        - external_id
        - election_event_id
        - id
        - image_document_id
        - is_public
        - labels
        - last_updated_at
        - presentation
        - tenant_id
        - type
    role: service-account
select_permissions:
-   comment: ''
    permission:
        columns:
        - annotations
        - contest_id
        - created_at
        - description
        - election_event_id
        - id
        - image_document_id
        - is_public
        - labels
        - last_updated_at
        - presentation
        - tenant_id
        - type
        filter:
            _and:
            -   tenant_id:
                    _eq: X-Hasura-Tenant-Id
            -   _or:
                -   contest_id:
                        _is_null: true
                -   contest:
                        election:
                            _or:
                            -   permission_label:
                                    _is_null: true
                            -   permission_label:
                                    _in: X-Hasura-Permission-Labels
    role: tally-results-read
