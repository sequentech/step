table:
    name: protocol_board
    schema: sequent_backend
insert_permissions:
-   comment: ''
    permission:
        check: {}
        columns:
        - id
        - tenant_id
        - election_event_id
        - parent_id
        - keys_ceremony_id
        - tally_session_id
        - batch
        - name
        - manager_message
        - created_at
    role: service-account
select_permissions:
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - manager_message
        - id
        - tenant_id
        - election_event_id
        - parent_id
        - keys_ceremony_id
        - tally_session_id
        - batch
        - name
        - created_at
        filter:
            tenant_id:
                _eq: X-Hasura-Tenant-Id
    role: admin-ceremony
-   comment: ''
    permission:
        allow_aggregations: true
        columns:
        - id
        - tenant_id
        - election_event_id
        - parent_id
        - keys_ceremony_id
        - tally_session_id
        - batch
        - name
        - manager_message
        - created_at
        filter: {}
    role: service-account
