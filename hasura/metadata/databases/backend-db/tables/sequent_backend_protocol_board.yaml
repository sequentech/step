table:
    name: protocol_board
    schema: sequent_backend
computed_fields:
    - name: public_manager_message
      definition:
          function:
              name: protocol_board_public_manager_message
              schema: sequent_backend
      comment: manager_message of a dkg board, or of a tally board while its election event is in post-processing; null otherwise
insert_permissions:
    - comment: ""
      permission:
          check: {}
          columns:
              - id
              - tenant_id
              - election_event_id
              - parent_id
              - keys_ceremony_id
              - tally_session_id
              - batch
              - name
              - manager_message
              - created_at
      role: service-account
select_permissions:
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - parent_id
              - keys_ceremony_id
              - tally_session_id
              - batch
              - name
              - created_at
          computed_fields:
              - public_manager_message
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
      role: admin-ceremony
    - comment: ""
      permission:
          allow_aggregations: true
          columns:
              - id
              - tenant_id
              - election_event_id
              - parent_id
              - keys_ceremony_id
              - tally_session_id
              - batch
              - name
              - created_at
          computed_fields:
              - public_manager_message
          filter: {}
      role: service-account
