table:
    name: messaging_account
    schema: sequent_backend
# Never `webhook_key`: the callback URL comes from the
# `messaging_account_callback_url` action. Only `messaging-account-read` sees
# `credentials`, which holds when each was replaced, never a value.
select_permissions:
    - comment: ""
      permission:
          columns:
              - channel
              - created_at
              - credentials
              - id
              - is_default
              - limits
              - name
              - provider
              - provider_approval
              - readiness
              - sender
              - status
              - tenant_id
              - updated_at
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      role: messaging-account-read
    - comment: ""
      permission:
          columns:
              - channel
              - created_at
              - id
              - is_default
              - limits
              - name
              - provider
              - provider_approval
              - readiness
              - sender
              - status
              - tenant_id
              - updated_at
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      role: messaging-config-read
    - comment: ""
      permission:
          columns:
              - channel
              - created_at
              - credentials
              - id
              - is_default
              - limits
              - name
              - provider
              - provider_approval
              - readiness
              - sender
              - status
              - tenant_id
              - updated_at
          filter:
              tenant_id:
                  _eq: X-Hasura-Tenant-Id
          allow_aggregations: true
      role: service-account
