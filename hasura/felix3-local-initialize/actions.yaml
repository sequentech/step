actions:
    - name: operationalInitializeStatus
      definition:
          type: query
          handler: http://{{HARVEST_DOMAIN}}/operational-signing/initialize/status
          forward_client_headers: true
          request_transform:
              body:
                  action: transform
                  template: "{{$body.input}}"
              template_engine: Kriti
              version: 2
      permissions:
          - role: sign-initialize-voting
    - name: operationalInitializeStart
      definition:
          kind: synchronous
          handler: http://{{HARVEST_DOMAIN}}/operational-signing/initialize/start
          forward_client_headers: true
          request_transform:
              body:
                  action: transform
                  template: "{{$body.input}}"
              template_engine: Kriti
              version: 2
      permissions:
          - role: sign-initialize-voting
    - name: operationalInitializeFinish
      definition:
          kind: synchronous
          handler: http://{{HARVEST_DOMAIN}}/operational-signing/initialize/finish
          forward_client_headers: true
          request_transform:
              body:
                  action: transform
                  template: "{{$body.input}}"
              template_engine: Kriti
              version: 2
      permissions:
          - role: sign-initialize-voting
    - name: operationalInitializeCancel
      definition:
          kind: synchronous
          handler: http://{{HARVEST_DOMAIN}}/operational-signing/initialize/cancel
          forward_client_headers: true
          request_transform:
              body:
                  action: transform
                  template: "{{$body.input}}"
              template_engine: Kriti
              version: 2
      permissions:
          - role: sign-initialize-voting
    - name: operationalInitializeReconcile
      definition:
          kind: synchronous
          handler: http://{{HARVEST_DOMAIN}}/operational-signing/initialize/reconcile
          forward_client_headers: true
          request_transform:
              body:
                  action: transform
                  template: "{{$body.input}}"
              template_engine: Kriti
              version: 2
      permissions:
          - role: sign-initialize-voting
custom_types:
    input_objects:
        - name: OperationalInitializeReturnPageInput
    objects:
        - name: OperationalInitializePage
        - name: OperationalInitializeScope
        - name: OperationalInitializeStatus
        - name: OperationalInitializeStart
        - name: OperationalInitializeReturn
        - name: OperationalInitializeOutcome
